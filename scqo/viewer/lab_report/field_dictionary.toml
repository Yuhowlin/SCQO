# The lab's QPU characterization template — DATA, not code.
#
# scqo/viewer/lab_report/ is one lab's reporting convention living inside the
# vendor-neutral core, and this file is where that convention is confined. Another
# lab swaps THIS FILE and gets its own workbook: nothing in the renderers knows a
# field name, a unit, a sheet title or a language. Keep it that way — a convention
# that leaks back into xlsx.py or slides.py is the thing the split exists to stop.
#
# The `dictionary` rows below are the 欄位字典 sheet, in sheet order.

# 區段 / 項次 / 欄位名稱 / 輸入方式 / 型態·單位 / 說明 / 分類·重要度
dictionary_header = ["區段", "項次", "欄位名稱", "輸入方式", "型態/單位", "說明", "分類/重要度"]

[sheets]
data = "Data"
dashboard = "Dashboard"
dictionary = "欄位字典"
dictionary_title = "QPU 公版欄位字典（標準規格）"

