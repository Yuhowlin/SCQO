notes = "ADDITIVE COMBO — one scqo-only feature; nothing an operator owns changes (no Parameters, experiment names, state files, config keys or stored state) and no dependency ships. CLASSIFICATION NOTE: the capability-rename-and-browse fragment was filed `breaking` — RELEASING.md's version rule lists renamed catalog fields as breaking — and was judged ADDITIVE at the cut: the renamed key is a Python dict key on catalog() with ZERO consumers anywhere in the stack (verified across scqo-qm, scqo-qblox, scqo-contrib, scqat and the operator's notebooks), so no user artifact must change to keep working. What does change is that dict key and the bare `scqo run` output format, both under BEHAVIOR CHANGE below. Same re-judgment precedent as v2.2.0's readout-average-mode fragment. ADDITIVE (scqo) — THE CATALOG'S DERIVED MARKERS ARE NOW `capabilities`, NEVER `tags`: catalog() entries carry `capabilities`, `_derived_tags` became `_derived_capabilities`, and `scqo run <name> --help` prints a `capabilities:` line. The word `tag` now means exactly ONE thing across the stack — the datastore's user-attached RUN tags (record.json + index.sqlite, `scqo tag`, `scqo find --tag`, `scqo run --tag`, config default_tags, the design-seeded `seeded:` anchors), all UNCHANGED. The collision was real enough that every discussion of either had to disambiguate first, and the asymmetry decided which side moved: capabilities are recomputed from Parameters-mixin subclassing on every catalog() call and persist NOWHERE, so renaming them costs no migration, while run tags live in immutable run records and keep the word. Capabilities stay DERIVED and never declared; zero capabilities stays legitimate. ADDITIVE (scqo) — CATALOG BROWSING ON THE ONE ENTRY POINT: bare `scqo run` now prints compact name COLUMNS (column-major, so the alphabetical families read DOWN each column) closed by a capability-count footer, and the new `scqo run --capability NAME` filters that listing — repeatable = AND, and `none` is the zero-capability bucket (legitimate for a not-yet-classifiable experiment, so it must stay browsable). Backed by a curated CAPABILITY_SUMMARIES table in _capabilities whose keys are pinned to the DERIVABLE set by test_capabilities, so the browser can never advertise a capability that does not exist. Guards refuse an experiment name alongside the flag, an unknown capability (the error lists the valid set) and `none` AND-ed with a real capability — all before a session is built. No new verb: `scqo run` remains the single CLI entry point. BEHAVIOR CHANGE (scqo) — (1) any consumer reading `entry['tags']` off catalog() must read `entry['capabilities']`; no shim or alias ships (house rule) and no such consumer exists in the stack. (2) Bare `scqo run` NO LONGER prints descriptions or per-name capability brackets — the 32-char name column broke on every multi-capability suffix — so a script parsing that output must move to `scqo run <name> --help` (full description + parameter schema) or to `--capability` (the filter); the footer still names every capability and its count. Every CLI meta line is ASCII: an em-dash in the filter header rendered as mojibake on the Windows console and was replaced. OFFLINE-VALIDATED — full suites green at the cut (scqo 798, scqo-qm 318, scqo-qblox 268). NO hardware validation is owed for this combo: the change touches only the catalog surface and the CLI listing — no probe, schedule, program or instrument path. TEST-ORDER NOTE: the new catalog-listing spot-checks passed alone and FAILED in the full suite, because other test modules @register deliberately-broken fixtures at module level and those carry no capabilities, so every one of them piled into the `none` bucket; both spot-checks now enumerate the EXPORTED experiments, the same selection-by-type guard test_capabilities already used. STILL OWED (carried forward, untouched by this combo): register_stark.py run + calibrate and qc_n_stark_amp HARDWARE VALIDATION (v2.0.0/v2.1.0); readout average mode HARDWARE VALIDATION on both backends (v2.2.0). SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 — git fetch --tags && git checkout v2.3.0 in scqo/scqo-qm/scqo-qblox + scqat at v0.18.0. No new dependency ships, so the [viewer] extra needs NO extras reinstall this time, but DO re-run the editable installs or `scqo doctor` keeps reporting 2.2.0 (editable .dist-info metadata is frozen at install time and a checkout never refreshes it): uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps, per venv (.venv-qm, .venv-qblox, .venv-view), restart the viewer, then `scqo doctor` from a NON-INSTALLER account over SSH."

