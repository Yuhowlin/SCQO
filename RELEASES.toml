notes = "REQUIRED: scqat MUST be at v0.11.0, and unlike v0.19.0 this one DEGRADES SILENTLY below it — nothing raises. SCQO reads the new keys with .get(..., nan), so an under-version scqat yields a run record whose mapping_fidelity* fields are all NaN and figures under the OLD names, with no error anywhere. Re-run the editable installs (line at the end) and check `scqo --version` reports 0.22.0. NEW — THE MAPPING FIDELITY F, FOR FREE. The Lorentzian scqat already fits, A/(1+(f/f_c)^2)+B, IS the reference RTS spectrum 4F^2*G/((2G)^2+(2pi f)^2) + (1-F^2)*dt written in different variables: our series is 0/1 (a quarter of the variance) and welch returns the one-sided density (twice), so S_ours = S_P/2 and f_c = G/pi, A = F^2/(2G), B = (1-F^2)*dt/2. No refit was needed — A and B were ALREADY that model's 4F^2 and (1-F^2)dt terms carried as free parameters — so the sequence mapping fidelity F (= 1 - 2*eps for a per-sample mapping-error probability eps) falls out twice: mapping_fidelity = sqrt(2*pi*f_c*A) from the plateau and mapping_fidelity_floor = sqrt(1 - 2*B/dt) from the floor, plus mapping_fidelity_ratio. The normalization is self-consistent by construction (Lorentzian integrates to F^2/4, floor to (1-F^2)/4, summing to the 1/4 variance of a balanced 0/1 series) and a power-budget test pins it. THE TWO ESTIMATES ARE NOT REDUNDANT AND THE RATIO IS THE POINT: on a DIRECTLY sampled telegraph with genuinely white mapping error the floor estimate is exact (measured 1.000x of truth across G = 2-200 Hz, eps = 0-5 %) while the plateau runs ~2 % low from Welch leakage — but on the XOR-derived parity of this no-reset sequence the induced noise is lag-1 correlated, and then the FLOOR SATURATES AT 1, reporting a flawless sequence, while the plateau collapses (planting G = 20 Hz at dt = 50 us: at 0.2 % readout error the corner inflates 71x while F_floor still reads 1.000 and F_plateau drops to 0.285). So the plateau is the headline and a ratio well below 1 means the Lorentzian-plus-WHITE-floor model does not describe the data — which is the readable symptom of the correlated readout error that also inflates the rate. CRITICALLY, psd_contrast IS BLIND TO THIS: those corrupted fits keep a large A/B. It is REPORTED, NEVER GATED — there is no calibrated threshold yet, and a wrong one would reject good runs, exactly how the old p_switch ceiling nearly refused a textbook fit. Real chipA run 20260801-191415-048 scores F = 0.578 (plateau) / 0.634 (floor), ratio 0.91, i.e. a consistent fit at ~20 % per-sample mapping error. FIGURE KEYS CHANGED — SCRIPTS THAT GLOB THE PNG NAMES MUST BE UPDATED: parity_switch `trace` and `parity` are MERGED into one shared-x DEBUG panel `timetrace` (readout over parity, first 100 points), so parity_switch_trace.png and parity_switch_parity.png are replaced by parity_switch_timetrace.png; `psd` and `state_psd` are unchanged. The two series are one differencing step apart, which is the whole reason to see them together, and at ~30 us per shot a 100-point window is ~3 ms — far under one switching period, so the parity row looking CONSTANT is correct, not a fault. The parity tick labels are now XOR=0 / XOR=1, not even / odd: this measurement fixes the parity only up to a global label, so which value is the even charge parity is unknowable from it. The readout panel draws the mean of the WHOLE trace (new key p_state_high — a third fraction, distinct from p_parity_odd, the parity's level, and p_switch, how often the parity changes). NEW — idle_multiple: the derived idle becomes N / (2 x parity_delta_f_hz). The gain is NOT a lower f_min at fixed record time (unchanged) — it is that long runs are BIN-limited: at chipA's 30.4 us shot the Qblox 3e6-bin ceiling caps a run at 91 s (f_min 0.088 Hz), while N=3 stretches the shot to ~48.5 us so the same bins buy 145 s (f_min 0.055 Hz). It also suppresses the readout-error bias (1 + 2*eps/(G*dt)). The cost is T2*: contrast decays as exp(-t/T2*), and t2_star_s is a mode FACT, unreachable at define_sweep time, so that stays a documented caution rather than an automatic check. ONLY ODD N CARRIES SIGNAL — the branches sit at +-delta_f/2, so the parity phase over N/(2*delta_f) is +-N*pi/2 and the readout goes as sin(+-N*pi/2): +-1 for odd N, exactly 0 for even N (both parities land on the same pole). Even N is ALLOWED but warns at define_sweep naming the reason and the nearest odd values; it fails safe either way, since a zero-contrast run produces no telegraph and MIN_PSD_CONTRAST refuses the fit. max_derived_idle_ns applies to the FINAL idle (base x N) and the refusal distinguishes the two causes. EXPECT TO HIT IT: N=3 on chipA is 27.1 us against the 20 us default ceiling, so raise max_derived_idle_ns when using N>1. An explicit idle_time_ns still wins outright and is NOT multiplied. QBLOX FIX — the acquisition timeout was 120 s and killed a 30 s-record parity run on 2026-08-01 (run 20260801-215523-624, 'Sequencers slot 4 sequencer 0 did not stop in timeout period of 2 minutes'); it is now 300 s. qubit_parity_switch is the binding case because it is parameterized by RECORD TIME and plays one long uninterrupted shot train, and the 3e6-bin ceiling bounds that at 91-145 s — so 120 s sat right inside the legal band. NOTE THE UNIT TRAP for anyone tuning it: HardwareAgent.run(timeout=) is documented in SECONDS but the instrument coordinator hands the cluster timeout_sec // 60 MINUTES (floor division), so the real granularity is one minute and anything under 60 s truncates to a ZERO-minute deadline — keep it a multiple of 60. NO RE-MEASUREMENT NEEDED for v0.21.0 data: re-analysing that chipA run through v0.22.0 reproduces 2.3525 Hz and corner 0.748823 Hz exactly and adds the F numbers. Re-run `uv pip install -e . --no-deps` in all three venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout; these uv-managed venvs have NEITHER pip NOR uv inside them, so drive it from outside: `uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps`."

