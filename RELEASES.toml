notes = "The readout state->IQ map becomes a first-class, governed calibration. STAGE-3: use_state_discrimination on qubit_power_rabi/ramsey/echo/relaxation returns the FPGA-discriminated averaged state instead of I/Q (DatasetContract.alt_variables accepts (I,Q) OR state; the estimator consumes the pre-reduced signal path, reduction_method='signal', no iq_plane). single_shot_readout measures the |g>/|e> blobs, always plots them AS MEASURED (it never mutates the readout frame mid-run), stores the measured centres as the readout_pos_* reference, and PROPOSES the readout discriminator as GOVERNED suggestions on three NEW pushed, non-portable ReadableTransmon fields readout_rotation_rad / readout_threshold / readout_rus_threshold (QM realizes them on the readout op's integration_weights_angle [absolute rad] / threshold / rus_exit_threshold; Qblox declares them Unrealized -- acq_rotation/acq_threshold exist but no Qblox single_shot yet, and Qblox has no RUS). This REPLACES both the qualibrate 07_iq_blobs node AND the short-lived out-of-band calibrate_discriminator flag (REMOVED): the phase/threshold are now reviewed with scqo accept and confirmed by re-running, like drive_freq/pi_amp. The discrimination CENTRE is now the density PEAK: scqat's discriminate.py refines the coarse-histogram-argmax seed onto each blob's mode by nearest-centre-confined mean-shift (was frozen vary=False at the ~sigma/3 bin, sitting a fraction of sigma off the peak on low-separation/skewed readout; validated on real 0.88-fidelity 5Q4C data, fidelity 0.876->0.891). CONSUMPTION: the stored readout_pos_* now feed the IQ->1-D reductions -- scqat (bumped to v0.2.1, THE COMBO MUST PIN IT) attaches them to the acquired dataset as per-target ref_pos_* variables at acquisition time (Experiment.attach_readout_positions on qubit_spectroscopy + the coherent-drive four; persisted in dataset.nc so offline replay is faithful), and reduced_signal prefers them (priority explicit kwarg -> stored positions -> PCA): radial reads the stored ground point (ref_source='stored'), axial takes the measured g->e axis (reduction_method='positions'), and the shared iq_plane panel draws the two stored blobs + the g->e vector. RENAME: qubit_spectroscopy_flux -> qubit_spectroscopy_flux_pulse (no alias; the acquisition style becomes experiment identity, the resonator_spectroscopy_power_amp/_chain precedent) -- the name is the probe contract (flux pulsed only during the drive, readout at idle flux every slice; both QM and Qblox probes already conform), so the map is reduced against ONE global IQ reference (scqat ref_scope='global': the whole-map complex median, n_flux x more samples, the same idle-flux condition single_shot calibrates). A DC-held flux-spectroscopy variant would be a separate experiment keeping the per-slice reference. Yuhowlin's PRs #12/#16/#21 superseded-with-credit (closed). Drivers: lchqmdriver + lchqbdriver are REAL tags (QM realizers / Qblox Unrealized + both flux wrappers renamed); scqo-contrib is a no-change re-tag. UPGRADE REQUIRES: git fetch --tags && git checkout v0.11.2 in the four scqo-versioned repos AND scqat at v0.2.1, then re-run `uv pip install -e . --no-deps` in each editable env (refreshes the version scqo doctor reports and registers scqat's new reductions). RENAME user parameters.toml [qubit_spectroscopy_flux] sections to [qubit_spectroscopy_flux_pulse] (old runs stay findable under the old name); drop any calibrate_discriminator key (the parameter is gone -- a stale key fails loudly). QM: pull-mode seeds the three new discriminator fields from each readout op (chipA already carries integration_weights_angle/threshold/rus_exit_threshold from 07_iq_blobs); no config edit. No data action: index stays v7, old run folders immutable. BEHAVIOR: single_shot_readout no longer writes the vendor discriminator itself -- run it, scqo accept the readout_rotation_rad/readout_threshold suggestions, then re-run to confirm; a re-fit of the SAME coherent-drive raw data now takes its reduction axis from the stored blobs when present (deterministic g->e sign) instead of per-run PCA -- same physics, and identical when no positions are stored. DATA CAVEAT: none -- additive to the schema."

