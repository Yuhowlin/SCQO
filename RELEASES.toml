notes = "REQUIRED: re-run the editable installs in ALL THREE venvs (.venv-qm, .venv-qblox, .venv-view) — scqo AND scqat both moved, and a stale editable reports the old version silently. BREAKING, three renames on the amplitude family (qubit_power_rabi, qubit_pi_pulse_error, readout_power, qubit_deterministic_benchmarking). (1) PARAMETER: qubit_power_rabi's `num_points` is now `num_amp_points`, matching the other three. Any ~/.scqo/config.toml, project params TOML or campaign plan carrying `num_points` under [qubit_power_rabi] now FAILS LOUDLY (Parameters sets extra=\"forbid\") — that is the intended outcome, not a silent revert to the default. The other experiments' `num_points` (resonator_spectroscopy, qubit_ramsey, qubit_relaxation, qubit_echo) is UNCHANGED. (2) DATASET AXIS: the swept ratio axis is `amp_prefactor` everywhere (was `amp_factor` on three of the four). Old run folders keep their old coord names and still load — they are immutable data — but a script that reads `ds['amp_factor']` from NEW runs must be updated. (3) FIT KEYS: `pi_amp_factor` / `opt_amp_factor` / `best_amp_factor` / `opt_factor` are all now `opt_amp_prefactor`; qubit_deterministic_benchmarking's redundant `opt_amp` is gone (it duplicated <knob>), and qubit_pi_pulse_error no longer emits its list-valued `amp_factors`/`gate_counts` (they duplicated dataset coords and counted as n_nonscalar in every campaign statistics table). NEW: every amplitude run's dataset.nc now carries a `digital_amp` coordinate — the ABSOLUTE amplitude, per target, behind each swept ratio point — so a saved run says what amplitude actually played without recovering the device snapshot; scqat draws it as a secondary axis on the figures and it survives into plotdata.nc. It is DIMENSIONLESS (a 0-1 fraction of full scale, the unit pi_amp/readout_amp carry), never volts and never dBm. TWO BEHAVIOUR CHANGES worth telling operators about: qubit_power_rabi's default max_amp_factor is 1.9, not 2.0 (2.0 sat exactly on QUA's unrepresentable amp() ceiling and the sweep emitted that endpoint); and a power-Rabi fit whose pi falls OUTSIDE the swept window now reports FAILED instead of silently returning the window edge as the answer. Both drivers now refuse an over-range amplitude BY NAME before building, naming the neutral knob to lower instead of dying inside the vendor compiler on `awg_gain`. Also in this release, from the parallel flux work: the neutral FluxSweepParameters drops its hardcoded +/-0.5 V rail bounds (they baked one vendor's direct-mode rail into the shared API and fired before any backend was consulted), and on Qblox flux volts are now converted to the DAC fraction the wire actually takes — before this, a requested 0.3 V left a QCM as 0.75 V and every fitted flux_offset was wrong by the module's full-scale factor."

[v0-16-0]
date = 2026-07-28
scqo = "v0.16.0"                 # deterministic benchmarking + the independent pi/2 knobs; campaigns; the depletion knob
lchqbdriver = "v0.16.0"          # active reset; mixer calibration; the WinError 87 silence; declines the two x90 knobs
lchqmdriver = "v0.16.0"          # TWO silent QM bugs fixed (virtual-detuning sign, stale pi/2 amplitude) + the x90 bindings
scqo-contrib = "v0.12.0"         # still NOT in the combo (unchanged since v0.13.0)
scqat = "v0.5.0"                 # the deterministic-benchmarking estimator
notes = "READ THE TWO QM BUG FIXES FIRST — both are SILENT, both reached chipA, and both mean previously accepted calibrations are suspect. (1) VIRTUAL-DETUNING SIGN. QUA's frame_rotation_2pi rotates the ELEMENT FRAME, the opposite handedness to a pulse-axis phase (Qblox's X90(phase=...)), so an un-negated ramp puts the effective drive BELOW drive_freq_hz — the opposite of scqo's contract. scqo's shared estimate() writes drive_freq += (f_fit − applied) for BOTH backends, so on QM every accepted Ramsey update DOUBLED the residual detuning instead of cancelling it while the fit still converged and looked clean: chipA q1 walked +47.9 k → +95.7 k → +191.5 k Hz over three accepted runs. Both frame-ramping probes now carry the negation (qubit_ramsey, pair_qcq_zz_coupler_freq) and LCH_Ramsey/update.py ADDS d_f01 to match. The ZZ probe's stakes were lower — un-negated it reported zz = f_fit − detuning with the sign flipped against the physical residual ZZ, but the zero crossing feeding its only writeback (idle_flux on the coupler's flux channel) is EXACTLY invariant under zz → −zz (verified over 2000 noisy trials, max delta 0.000e+00 V, outcomes identical), so no accepted update was ever wrong there; only the reported and plotted sign changes. Do NOT copy the official nodes' sign into a probe: 06a_ramsey.py subtracts to compensate for its own un-negated ramp, and 19_zz_off_jazz.py takes only argmin|zeta|, which cannot tell the difference. (2) STALE pi/2 AMPLITUDE. QM's x90 was unreachable under scqo — no experiment calibrated it and no knob set it — so it simply went stale: chipA q1 ran x180 = 0.28619 with x90 = 0.07302 and −x90 = 0.09329 against a correct 0.14310, a 46-degree 'pi/2' capping Ramsey contrast at sin^2(46 deg) ~ 0.5 while every fit converged cleanly. FEATURE — DETERMINISTIC BENCHMARKING, AND THE pi/2 BECOMES ITS OWN KNOB. New experiment qubit_deterministic_benchmarking: plays ONE target gate N times and sweeps N so a small per-gate over/under-rotation accumulates into a resolvable fringe, repeated across an amplitude-scale sweep whose fringe rate crosses zero at the correct amplitude. Far more sensitive than power Rabi, which sees the rotation error once; run it after power Rabi has the amplitude roughly right. It calibrates whichever gate is benchmarked, which is why the catalog gains TWO knobs on the drive channel: pi_amp_x90 and drag_beta_x90. THE DESIGN POINT MOST LIKELY TO BE 'FIXED' BACK: the pi/2 is INDEPENDENT, never pi_amp/2. A derived x90 cannot be calibrated in its own right, and amplitude response is not perfectly linear — which is precisely the error this experiment measures. LCHQMDriver's set_pi_amp therefore has NO lock_x90 flag at all: once x90 owns a knob the flag is self-contradictory, since it existed only to paper over x90 having none. What replaces it is a table (_AMP_NODES) mapping each family to its storage nodes — one operation, one family, no mode flag and no operation-name ladder. The x90 family deliberately includes −x90_DragCosine, which carries its OWN amplitude (only its alpha/detuning are QUAM references; the negative sense comes from axis_angle = pi), so the two pi/2 gates cannot drift apart. Relatedly, _set_op_alpha no longer takes force=True: forcing a literal over a node whose alpha is a QUAM REFERENCE silently SEVERS the alias so later writes stop propagating, and −x90_DragCosine.alpha is exactly such a reference. The qualibrate power_rabi node keeps its update_x90 GUI option, now expressed as what it always was — a node policy — by composing the two independent writes rather than passing a mode flag into quam_fields. ON QBLOX BOTH NEW KNOBS ARE Unrealized, following the rule drag_beta already states: a vendor slot that exists with no experiment writing it gets declined, not bound. pi_amp_x90's slot DOES exist (PiHalfProperties.amp90) but no Qblox probe writes it — qubit_deterministic_benchmarking is QM-only, as is the rest of that family — so binding an amplitude nothing calibrates would claim a calibration the backend cannot make. Qblox otherwise DERIVES X90 from rxy.amp180 as amp180*theta/180, so pi_amp alone governs both gate widths there. Promotion means moving pi_half from FluxTunableTransmonElement up to the LCHTransmonElement base (fixed-frequency chips need it too) and binding element.pi_half.amp90; drag_beta_x90 promotes with drag_beta, since rxy carries a single beta. Note each declined knob ALSO needs a concrete raising property pair — make_view_base declares an abstract property for every catalogued knob, so declaring one Unrealized without implementing it makes QbloxDriveChannel uninstantiable. THE ESTIMATOR IS scqat's, NOT SCQO's (scqat v0.5.0). SCQO's estimate() delegates via per_qubit_results, per _scqat.py's rule that 'SCQO does not fit anything itself'. Two silent defects were fixed in the estimator on the way in: it read raw I with no axial reduction (the readout blobs sit at an arbitrary rotation in the IQ plane, so raw I is an arbitrarily-signed, arbitrarily-scaled trace — it now goes through reduced_signal like every other coherent-drive estimator), and damped_cosine_zero_phase fixes phi=0 with the fit bounding A >= 0, so a trace that starts LOW collapsed onto the flat A ~ 0 bound. Since the sequence starts in |0>, N=0 is an extremum by construction, so each trace is now oriented to start high. Both failed by returning a clean-looking opt_factor = 1.0 rather than raising, because curve_fit is wrapped in try/except. KNOWN LIMIT, documented in the estimator's tests: the sign heuristic pivots at a = 1.0 rather than the true optimum, so points between the two are signed wrongly and bias the crossing slightly (~0.2% on synthetic data). It CONVERGES across runs — the next run starts nearer 1.0 — which is why it is tolerated rather than redesigned. FEATURE — CAMPAIGNS (see SCQO CLAUDE.md and TUTORIAL for the full surface). A campaign is an ordered list of experiment STEPS walked N times, each (repeat, step) a full run() with its own folder, dataset, fit and timestamp. Finalization now lives in a `finally`, so the manifest is written on EVERY exit path — normal stop, Ctrl-C anywhere (including the cadence sleep, where a period_s campaign spends most of its wall clock and where an interrupt previously left status='running' forever), or an unexpected crash. An interrupted repeat KEEPS the steps that already ran, marked `partial` and counted in repeats_partial, never in repeat_done. statistics.png is rendered on finalize (lazy Agg matplotlib; a figure failure warns and never fails the campaign). single_shot_readout also now reports the Gaussian-fit populations pop_e_prep_g / pop_g_prep_e beside the COUNTED p_e_given_g / p_g_given_e — they are NOT one quantity by two methods and never share a key; the gap between them is roughly the discrimination error. On chipA the count's 125% scatter collapsed to 22% on the fit, and across two campaigns the count mean was flat (1.86% → 1.88%) while the fit rose 48%. TUTORIAL gains a 'Which readout number to trust' block. ALSO IN THIS COMBO: reset_method gains 'active' and an unrealizable method must REFUSE by name rather than downgrade (Qblox realizes it behind one door with four refusals; LCHQMDriver raises); the post-readout photon-depletion wait becomes the governed knob readout_depletion_s with a vendor home on BOTH backends, resolved only via _depletion.depletion_wait_ns; Qblox gains automatic mixer calibration for the RF modules, verified on hardware, built around sideband_cal() returning success while changing nothing on roughly half to three-quarters of calls (hence verify-then-retry, never trust-a-condition); the WinError 87 traceback that ended every scqo run on Windows is silenced at its source in the Qblox transport rather than in SCQO's vendor-neutral CLI; and the datasette canned queries are pointed at runs.targets after the greenfield rename left all four failing with 'no such column: qubits'. UPGRADE: checkout v0.16.0 in SCQO + LCHQBDriver + LCHQMDriver, and scqat at v0.5.0. scqat is REQUIRED, not optional: SCQO's qubit_deterministic_benchmarking imports scqat.estimators.qubit_deterministic_benchmarking, so a scqat CHECKOUT left at v0.4.0 fails at run time with ModuleNotFoundError — this is what reddened SCQO PR #13's CI, whose workflow clones scqat main as a sibling. An EDITABLE install is different and more insidious: it serves live source, so the module is already there and only the recorded VERSION is stale, which means `scqo doctor` reports a number that has nothing to do with the code being run. Audited at release time: .venv-view, .venv-qm and .venv-qblox were ALL still reporting scqo 0.14.0 (and .venv-view scqat 0.1.6) while running current source — v0.15.0's identical instruction had not been carried out in any of them. So: re-run `uv pip install -e . --no-deps` in every editable env (LCHQMDriver's env additionally needs `uv pip install -e D:\\github\\SCQO -e D:\\github\\scqat` if a bare `uv run` has pruned them — its scqo dep is an optional extra, so always `uv run --no-sync` there). DEVICE ACTION REQUIRED ON QM, and it is the reason to upgrade promptly: any qubit whose drive_freq_hz was set by an ACCEPTED Ramsey update before this release may carry a doubled residual detuning, and any whose pi/2 was assumed to be half the pi may be running a short x90. Re-run qubit_ramsey and qubit_deterministic_benchmarking (target_gate=x90) per qubit and accept. No data action — run folders are immutable; datasets recorded before this release are unaffected, though a ZZ map's reported zeta sign flips and its saved figures keep the old one."

[v0-15-0]
date = 2026-07-26
scqo = "v0.15.0"                 # swept time axes are whole nanoseconds; trends read accepted knob suggestions
lchqbdriver = "v0.15.0"          # use_state_discrimination end to end; grid guards on the seconds knobs + a compiling regression net
lchqmdriver = "v0.15.0"          # takes the discriminator solve from scqat, local copy deleted
scqo-contrib = "v0.12.0"         # still NOT in the combo
scqat = "v0.4.0"                 # the g/e discriminator solve promoted into tools/
notes = "TWO THINGS IN ONE COMBO — a state-discrimination FEATURE and an off-grid-time BUG FIX. Cut as a MINOR (not the v0.14.1 the bug fix alone was drafted as) because the feature is user-visible and the tags here are immutable. FEATURE — STATE DISCRIMINATION. `use_state_discrimination` works end to end on the Qblox backend and is VERIFIED ON chipA HARDWARE (discriminated qubit_relaxation and qubit_ramsey both ran clean, which is also what settles that the rotation SIGN is correct — the one thing offline tests could not prove). `readout_rotation_rad` / `readout_threshold` are now REALIZED on Qblox (`element.measure.acq_rotation` / `acq_threshold`), superseding the earlier 'Qblox declares all three Unrealized' position; `readout_rus_threshold` stays Unrealized deliberately — Qblox has no RUS threshold knob, it does conditional playback instead. The g/e discriminator solve is promoted into `scqat.tools.compute_ge_discriminator` (scqat v0.4.0) and BOTH drivers now consume that one implementation — LCHQMDriver deleted its local copy. THE DESIGN POINT MOST LIKELY TO BE 'FIXED' BACK BY SOMEONE READING ONLY THE QM SIDE: accumulate a rotation proposal ONLY when the vendor's rotation feeds back into the acquired data. QM's `integration_weights_angle` is folded into the integration weights, so it rotates every acquisition and `current - delta` converges. Qblox's `acq_rotation` is read on the ThresholdedAcquisition path ONLY, so plain integrated blobs come back in the raw frame forever, the same delta is measured every run, and accumulating has no fixed point — chipA walked 0 -> -0.388 -> -0.788 -> -1.177 rad over three accepted runs before this was caught. Qblox therefore proposes ABSOLUTELY (`-delta`). The rule is written into `scqat/tools/ge_discriminator.py`'s ANGLE docstring and both drivers' `update()`. Angles fold at the VENDOR BOUNDARY, not in the solve: the Qblox sequencer refuses `acq_rotation` outside [0, 360] deg while the neutral field keeps (-pi, pi], and both directions wrap in the view — a test fixture calibrated with a POSITIVE rotation is what let the sign error reach hardware, so fixtures for this knob must be NEGATIVE, which is what the solve returns. Active reset is the next piece of work and its hook already exists: widen `reset_method: Literal[\"thermal\"]` in scqo/experiments/_capabilities/qubit_reset.py. BUG FIX — OFF-GRID SWEPT TIMES. `qubit_relaxation` on chipA/Qblox died at compile time: 'Attempting to use a time value of 2004649.6799999997 ns ... multiples of 1 ns (tolerance: 1e-03 ns)'. NOT a v0.14.0 regression and NOT the thermalization knob (chipA's was a clean 0.001 s): `define_sweep` built its time axes with np.linspace over floats, so the failing window (min_wait_ns=16, max_wait_ns=100000, num_points=51) stepped by 1999.68 ns and 48 of its 51 points were fractional. Those times accumulate into absolute operation timestamps and qblox_scheduler refuses anything off its 1 ns GRID_TIME (tolerance 1.1e-3 ns). The defect is OLD and systemic — the stock defaults of qubit_relaxation (3999.68 ns step), qubit_echo (7999.36) and qubit_ramsey (79.68) were all off-grid too — and QM had been hiding it for every experiment by re-rounding each axis to clock cycles (np.round(wait_ns/4), /8 for echo's two arms). Qblox is simply the backend that enforces the grid. FIX: new `scqo/experiments/_time_grid.py::time_axis_ns` produces a UNIFORM, INTEGRAL axis — start ceil'd, STEP floor'd — used by all six time-swept experiments (qubit_relaxation, qubit_echo, qubit_ramsey, qubit_relaxation_flux, qubit_echo_flux, pair_zz_coupler). Uniform matters as much as integral: the Qblox probes rebuild the axis as linspace(first, last, size), so a merely per-point-rounded axis is no longer evenly spaced and gets re-expanded straight back off-grid. The window is now a BOUND, not a target — the last point can land up to one step short of max_*_ns, which is preferred over silently waiting longer than the caller asked for; an over-dense request (span too short for num_points at 1 ns) is REFUSED with the fix named, a case that was already degenerate (QM collapsed it into duplicate clock counts). The echo family uses grid_ns=2: those probes schedule two `tau / 2` arms, so an odd total would hand the instrument half a nanosecond. SECOND, INDEPENDENT INLET FIXED: LCHQBDriver wrote its seconds knobs raw. `thermalization_time_s` is now ROUNDED onto the 1 ns grid by the new `snap_ns` (matching the policy LCHQMDriver's set_thermalization_time already decided — round, do not refuse, because a T1-derived wait is never on the grid by luck and the calibration loop must be able to write its own result), which matters because the very next accepted `thermalization_factor x t1_s` proposal would have crashed the same way; the per-run thermalization_time_ns override goes through the same snap; `resonator_relaxation_time_ns` is snapped at the probe boundary (and converted with / 1e9, never * 1e-9, per the repo's own float-exactness rule); and `pi_duration_s` now REFUSES a non-whole-nanosecond length rather than accepting it and crashing at compile — refused, not rounded, because the stored pi_amp was calibrated against a specific pulse length. WHY IT WAS NEVER CAUGHT OFFLINE: tests/test_probe_surface.py stops at 'a Schedule was built', and the grid check only runs inside the compiler. LCHQBDriver/tests/test_time_grid.py now COMPILES every time-swept probe with SerialCompiler — the same call HardwareAgent.run makes — and carries a self-check asserting each case's naive linspace step really was fractional (trimming num_points to 7 makes linspace(16, 100000, 7) land on an integer 16664 ns step and the case would pass for the wrong reason). Both suites compare against an ABSOLUTE tolerance: np.allclose's default rtol=1e-5 calls 40012.8 ns equal to 40013 and would make every such assertion vacuous. VERIFIED: 639 offline tests (scqo 473 / lchqmdriver 105 / lchqbdriver 61), the pre-fix axis reproduced and confirmed to still raise under the new compile test, and QM's cycle counts checked to stay distinct and monotonic on the new axes. UPGRADE: checkout v0.15.0 in SCQO + LCHQBDriver + LCHQMDriver, and scqat at v0.4.0 — scqat is REQUIRED, not optional, this time: both drivers import `scqat.tools.compute_ge_discriminator` and LCHQMDriver has deleted its local copy, so an env left on scqat 0.3.0 fails at import. Then re-run `uv pip install -e . --no-deps` in every editable env (LCHQMDriver's env additionally needs `uv pip install -e D:\\github\\SCQO -e D:\\github\\scqat` if a bare `uv run` has pruned them — its scqo dep is an optional extra, so `uv run` syncs them away; always `uv run --no-sync` there). No data action and no device-config change; datasets recorded before this release carry the old fractional time coords, which were never what the instrument played."

