lchqmdriver = "v0.19.0"          # the parity-monitor probe + shell
scqo-contrib = "v0.12.0"         # still NOT in the combo (unchanged since v0.13.0); its sandbox experiments still
                                 # predate the v0.17.0 amplitude renames
scqat = "v0.8.0"                 # the telegraph-PSD reduction + the parity_switch estimator — REQUIRED, see the notes
notes = "REQUIRED: scqat MUST be at v0.8.0 — qubit_parity_switch imports scqat.estimators.parity_switch, which does not exist before it, so an under-version scqat fails the run outright (loudly, unlike v0.18.0's silent trap). Re-run `uv pip install -e . --no-deps` in ALL THREE venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout: an editable install serves live source while reporting a stale version, so `scqo doctor` can read correct while the code is not. NEW — qubit_parity_switch, the charge-parity switching-rate monitor. y90 - fixed idle - x90 - measure, recorded as num_shots single shots with ONLY the resonator depletion wait between them (it carries NO reset_method at all: the sequence re-prepares the equator every shot, and the shot cadence IS the telegraph timebase a reset would stretch). The idle is 1/(2 x parity_delta_f_hz), a +/- pi/2 parity phase, and the 90-degree-shifted second pulse measures sin of it — ODD in parity, where a same-axis pair measures the even cos and sees nothing. The discriminated 0/1 trace is a random telegraph signal; the Lorentzian corner of its Welch PSD gives the rate (parity_rate_hz = pi x corner), a new transmon-family mode FACT. It is fed by qubit_ramsey's beat model, which gains a `ramsey_model` Literal to force the two-frequency fit and now proposes the splitting as the new drive-channel MONITOR parity_delta_f_hz — the splitting has to be a channel monitor because mode facts are unreachable at define_sweep time. Workflow: run qubit_ramsey with ramsey_model='beat' -> scqo accept -> run qubit_parity_switch -> scqo accept; a 2-step campaign repeats it (update='apply' tracks the drifting splitting, update='none' monitors at fixed calibration). It also REQUIRES an accepted single_shot_readout (stored pos_* centres pin the trace discrimination) and an accepted resonator_spectroscopy (readout_depletion_s governs the shot cadence). FIX, AND IT CHANGES ACCEPTED NUMBERS ON QBLOX: the Qblox Ramsey's artificial detuning never reached the instrument. X90(qubit, phase=...) silently DISCARDED the phase (not an Rxy factory kwarg, so it landed in device_overrides and the compiler dropped it) on a schedule that still compiled, so every Qblox Ramsey ever run measured |err| alone — usually under scqat's one-cycle gate, fitted as 'relaxation' and marked FAILED, which is why it went unnoticed. Now Rxy(theta=90, phi=-360*detuning*tau), and the NEGATIVE sign is load-bearing: a positive ramp gives |applied - err| and walks the drive to an absorbing point at err = 2*applied where detuning_error_hz reads exactly 0.0 and the fit looks perfect. A converged Ramsey therefore does NOT prove the sign — cross-witness with qubit_spectroscopy, which finds an absolute peak. Any Qblox qubit frequency calibrated by Ramsey before this release should be re-measured. LCHQMDriver's claim that a frame rotation is 'the opposite handedness to a pulse-axis phase' was FALSE and is corrected; the QM SIGN was always right and does not change."

