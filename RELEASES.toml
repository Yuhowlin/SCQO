notes = "MINOR COMBO - one new experiment plus three fixes; the digit is the experiment's (y+1 for any experiment-level change) and the fixes ride along. NOTHING an operator owns changes shape: no Parameters renames, no experiment renames, no state-file, config or stored-data changes, and no new dependency in the neutral layer. UPGRADE REQUIRES, in order: (1) scqat PIN v0.22.0 IS A HARD FLOOR, and for once a LOUD one - qc_unidirectional_trotter's estimate() lazy-imports scqat.estimators.qc_unidirectional_trotter, which simply does not exist below it, so the run dies with an ImportError naming the missing module and nobody gets wrong numbers. Every other experiment is unaffected. (2) EDITABLE REINSTALLS, and these are OVERDUE ON THIS MACHINE: at the time of this cut all three lab venvs still reported scqo 3.2.0 / scqat 0.20.1, i.e. neither the v3.2.0 nor the v3.3.0 reinstall was ever performed. .dist-info freezes the version at INSTALL time, so a git checkout alone leaves the metadata stale while the CODE is live (the installs are editable and DO import from the trees - only the recorded version lags). Run per venv: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. Verify with importlib.metadata.version, NEVER by checking that the import works. WHAT SHIPS: ADDITIVE - NEW EXPERIMENT qc_unidirectional_trotter (scqo + scqo-qm + scqat; QM only, record-only). Unidirectional (cascaded) coupling by Trotterization on a three-qubit chain: excite the source ONCE, then repeat N times a partial swap source->relay, a partial swap relay->sink, a parametric reset of the relay, and a per-qubit off-resonant AC-Stark phase compensation, reading every chain qubit at the end. Dumping the relay each round destroys the sink's return path, so the coupling is one-way and the populations vs N draw the transport. `targets` are the chain QUBITS and THEIR ORDER IS THE CHAIN ORDER - also the digit order of the joint_state labels; the two swap pairs, the reset qubit and the per-qubit compensation are Parameters, not targets. READ min_transfer AS 'SOMETHING ARRIVED', NEVER AS 'THE TRANSFER WAS GOOD': its default is 0.05, deliberately far below the pair families' 0.3, because the sink CANNOT approach unity in this sequence - the second swap is an exchange like the first, so the sink also emits back into the relay that the next reset dumps. It is the first experiment analysed through _scqat.whole_dataset_results (the joint panel is cross-target, so the per-target split cannot draw it), and the offline demo device grew a third qubit and a pair over every consecutive couple to host it. FIX - broadband_resonator_spectroscopy CRASHED ON EVERY UNSUCCESSFUL FIT. Outcome.WARNING does not exist - the vocabulary is successful/failed/no_data - so estimate() raised AttributeError the moment a fit did NOT succeed, which is exactly when that branch was needed; it fired on hardware as well as offline and the run lost its whole result, not just its verdict. An unsuccessful fit now reports FAILED. Second bug, same file and the reason the first went unnoticed: simulate() planted max(2, len(targets)) dips while estimate() asked the dip finder for the ROSTER's resonator count, agreeing only by coincidence while the demo device carried one resonator per target; both now resolve through one _expected_dips helper. FIX - THE ESTIMATOR BINDING RULE, MADE STRICT AND ENFORCED (scqo + scqat, docs and tests only). scqat's CLAUDE.md said ONE estimator per experiment while scqo's _scqat.py and contract.py said one per PROBING METHOD, and the tree had drifted to the weaker reading. The rule is now 1:1 in BOTH directions, stated once in SCQO's CLAUDE.md (Terminology -> The estimator binding): an estimator is keyed by a READING - a dataset shape AND the model fitted to it - so a binding is a claim that this model describes this signal, and two experiments binding one estimator assert the same physics. Sharing goes through scqat.tools for math and a _-prefixed module under scqat/estimators for presentation. Two cautions are written down because both look like evidence and are not: a DatasetContract is a SHAPE check asserting nothing about MEANING (qubit_spectroscopy and resonator_spectroscopy declare identical contracts down to the axis NAME, because DETUNING_AXIS is shared by both detuning mixins and the frame lives in the Parameters field names), and a shared fit routine is never a shared model (one Lorentzian fits qubit_spectroscopy_overlap only because a Stark-shifted Lorentzian is still a Lorentzian). The tree does NOT yet conform and that is visible rather than hidden: CLAUDE.md gains a GENERATED experiment -> estimator map (a second block in scripts/update_docs.py, derived by AST and resolved through the MRO so an inherited estimate() is attributed to the estimator it actually runs), and tests/test_one_estimator_per_experiment.py carries the four shared bindings (state_discrimination x3, readout_fidelity, resonator_spectroscopy_power, qubit_spectroscopy) and the one unbound experiment (qubit_pi_pulse_error) with each one's migration. It fails in BOTH directions - an unlisted violation fails, and a listed one that has been fixed fails until its entry is deleted - so the list can only shrink. FIX - single_shot_readout LOST ITS WHOLE SUGGESTION SET on an uncalibrated channel (scqo-qm). The QM update() override accumulates the demod rotation as an ABSOLUTE proposal (current - delta), reading the current value with float(view.readout_rotation_rad); that field is None until a discriminator exists, which is precisely the state the FIRST single-shot readout on a fresh chip runs in. The session's suggestion capture swallows the TypeError by design (a failed update must never lose the measurement), so the symptom was the worst kind: the run reported success, kept its data and its fit, and silently proposed NOTHING - no blob centers, no fidelities, no discriminator trio - with the reason buried in result.error. An unset rotation now reads as 0.0. PRE-EXISTING, not a regression from this cut: the line is unchanged since before v3.3.0. WORTH KNOWING BEYOND THAT BUG, and it is why the crash hid for so long: SCQO's own suite is meant to run DRIVER-FREE (in this lab that is .venv-view), and scqo.experiments._discover() swallows a driver entry point's import failure with except Exception: continue. A driver that fails to import against a mismatched scqo does not fail anything loudly - it quietly stops being exercised, and the CORE class registers in its place. Running SCQO's suite in .venv-qm instead silently swaps in the driver's update() overrides and will report failures that are environment artifacts, not defects. OFFLINE-VALIDATED at the cut: scqo 900 (.venv-view, driver-free), scqat 687, scqo-qm 374 (.venv-qm), scqo-qblox 319 (.venv-qblox). scqo-qblox carries NO functional change in this cut - its tree is identical to v3.3.0 apart from the version bump, which is taken rather than a lagging-metadata re-tag because every previous tag of that repo has a matching pyproject version and stale metadata is exactly the trap described above. CI NOTE - A NEW KNOWN FLAKE, do not re-diagnose it: scqat tests/test_ramsey_cryoscope_estimator.py::TestRamseyCryoscopeEstimator::test_iq_path_is_blind_to_readout_rotation failed once on the 3.12 leg of this cut and PASSED on rerun (both legs), having been green on the previous commit and 6/6 green locally on 3.11 and 3.12. It is not caused by this release - the only scqat change here is the version bump. It asserts that the complex-IQ lock-in path and the pre-discriminated real path agree to rel=1e-6, and the failure showed them ~6% apart (0.0883 vs 0.094), which is two code paths landing in different minima rather than noise. scqat pins only floors, so CI resolves numpy/scipy/lmfit fresh; a same-day rerun passing rules out a bad pin and points at run-to-run FP ordering (BLAS threading on differently-sized runners) flipping a shallow fit. THE UNDERLYING FRAGILITY IS REAL and belongs to ramsey_cryoscope, which already owes hardware validation - re-run the leg, but do not read a green rerun as proof the two paths always agree. HARDWARE LEDGER: NEWLY OWED - qc_unidirectional_trotter has had NO instrument contact at all (no acquisition, no gateway preview); it is QM-only and Qblox does not realize it. The single_shot_readout fix is offline-verified only, and the path it repairs is by definition a FIRST bring-up on a fresh chip, so watch the first real SSRO on an uncalibrated channel. STILL OWED, carried forward from v3.3.0 unchanged - both parametric-drive shells on QM, ALL SIX Qblox probes from PR #12, qubit_ramsey_phasor on both backends, the Qblox cryoscopes and their applied filter, qubit_tomography interleaved noise, the broadband RESONATOR variant and cross-band switching, punchout v2 on Qblox, the coupling-coefficient live run, readout average mode on both backends, register_stark.py + qc_n_stark_amp, and the quam-builder v0.5.0 first-real-OPX1000-run watch. SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.4.0 in scqo / scqo-qm / scqo-qblox plus scqat at v0.22.0, the editable reinstalls above (REQUIRED, and overdue), restart the viewer, then scqo doctor from a NON-INSTALLER account over SSH. Neither the v3.2.0 nor the v3.3.0 server upgrade was performed, so this checkout carries THREE cuts' changes at once."

