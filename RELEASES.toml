pans and LO placement, default_targets() now also filters by required_operations, and qubit_tomography gained reset_frame() after reset in the same PR); COUPLING g RECORDED TWICE (g_hz at the idle point + the NEW dimensionless geometry constant g_coeff = g_hz/sqrt(f_q*f_bare), both punchouts and the flux map write it, routes agree to 0.2-2.4% at c~0.0182 on three qubits; both punchouts now propose SIX values and the flux map SEVEN — blind accepts write the coupling pair; DO NOT extrapolate g_coeff down a flux arch, refuted on 13 runs); PUNCHOUT TWO-BAND BRANCH EXTRACTION v2 (f_bare_hz + f_dress0_hz + lamb shift + plateau boundary powers from anchored two-band classification, HW-validated on QM 5Q4C q3, v1 was falsified by the first hardware runs — the global FWHM gate deleted the bare plateau; Qblox live run owed); FLUX DESIGN-g SEED RESCALE (design-tier g seed rescaled to chip frequencies; g(phi) INSIDE the model was implemented and REJECTED by data — do not re-attempt without new evidence); SPECTROSCOPY-CRYOSCOPE DRIVE SHAPE (drive_shape square|cosine|gaussian built per run as a run-scoped op dropped in finally; THE DEFAULT IS SQUARE ON MEASUREMENT — center scatter tracks LINEWIDTH alone at ~0.009 MHz/MHz across envelopes, so the narrowest line wins and shape is NOT the lever, length is; reach for smooth envelopes only against a line that looks WRONG). FIX x2 — qubit_relaxation no longer crashes on a flat trace (failed fit reports success=false + raw-data figure), and peak_fit's min_snr gate measures point-to-point noise (DER_SNR) instead of value-MAD, so a line filling >40% of a window is DETECTABLE again (previously silent n_peaks_found=0; re-analyse any suspicious no-peak runs — two previously-unfittable 5Q4C cryoscope runs now fit, the previously-passing one is bit-identical). HARDWARE LEDGER: VALIDATED THIS CUT — broadband qubit variant (5Q4C q1 run 20260819-151504-090, candidate 5.1438 GHz vs stored 5.14198 GHz), punchout v2 (QM q3), cryoscope drive shapes (