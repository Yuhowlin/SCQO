notes = "REQUIRED, AND THE FAILURE IS SILENT: scqat MUST be at v0.7.0. qubit_thermal_population prepares only |g> and pins the readout channel's STORED g/e centres into the mixture fit, i.e. (n_state, n_center) == (1, 2). Before scqat's fix, discriminate unpacked only n_state centres and — in its own commit's words — SILENTLY DROPPED THE REST: on scqat 0.6.0 the fit does not raise, it quietly returns a wrong n_th. There is no version pin protecting you (SCQO declares a bare `scqat` on purpose — the lab and CI both install scqat EDITABLE, which bypasses resolution entirely, so a floor would enforce nothing; this manifest is the authority, which is exactly why it says so here). So: re-run `uv pip install -e . --no-deps` in ALL THREE venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout — an editable install serves live source while reporting a stale version, so `scqo doctor` can read correct while the code is not. NEW — single_shot_readout_gef, the QUTRIT sibling of single_shot_readout. Same per-shot prepared_state x shot_idx contract with one more prepared state: prepared_state [0,1,2] -> a 3x3 confusion matrix (counted and fitted twins), fidelity_g/e/f, and pos_{g,e,f}_* monitors (three new catalog monitor fields). It proposes NO discriminator knob, deliberately: readout_rotation_rad / readout_threshold describe a scalar cut on ONE rotated quadrature, which separates two blobs and has no three-state analogue — |g>, |e> and |f> sit on a TRIANGLE in the IQ plane and are classified by nearest centre in 2-D. The two-state single_shot_readout remains THE authority for those two knobs; do not 'fix' this by having the qutrit run propose them. QM-ONLY: preparing |f> needs a calibrated 1->2 (EF) pi pulse, which only the QM backend has today — a Qblox session gets the base probe()'s NotImplementedError. Qblox has the <q>.12 clock but no gate targets it. NEW — qubit_thermal_population, the first writer of the mode fact n_th. single_shot_readout already reports this number as a by-product of preparing BOTH states; this experiment prepares only |g> and spends every shot on the ground-state cloud, which is what a 1-5% population needs — the number is a small minority of a large sample, so the STATISTICS, not the fit, set the error bar. Because only one state is prepared, nothing in the data says where |e> is: the centres come from the readout channel's stored pos_* monitors (an accepted single_shot_readout run), pinned into the fit, and the experiment REFUSES to run without them rather than inventing a second centre from a cloud that has only one. That reference is snapshotted into dataset.nc at acquisition time, so the analysis replays offline unchanged. It also REFUSES reset_method='active' BY NAME — active reset removes exactly the population being counted (use 'thermal', and raise thermalization_time_ns if you want a longer wait). Both refusals fire in define_sweep, before any hardware runs. TWO READINGS, AND THEY ARE NOT ONE QUANTITY BY TWO METHODS: p_e_given_g is COUNTED (nearest-centre hard assignment — population PLUS the readout overlap error) and pop_e_prep_g is the FITTED mixture weight (population with the overlap removed). The FITTED one is the chip fact n_th. ALSO: _scqat.per_qubit_results gains a keyword-only per_target_kwargs for knobs whose VALUE differs per qubit (the pinned centres are the first user), merged over the shared kwargs with per-target winning; and report.FIT_ONLY_QUANTITIES gains p_g_given_e, which it had been missing beside its three siblings. NO BREAKING CHANGES — everything here is additive (new modules, new monitors, a keyword-only parameter), nothing like v0.17.0's amplitude renames. No device action and no data action: run folders are immutable and datasets recorded before this release are unaffected."

