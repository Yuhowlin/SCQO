notes = "ADDITIVE COMBO — three features plus one sequencing fix; nothing breaks and there is NO upgrade action beyond the routine checkout + editable reinstall. ADDITIVE (scqo + scqo-qm + scqat) — qubit_stark_phase_echo, the record-only QM-only AC-STARK PHASE ECHO: y90 - wait(D) - x180 - off-resonant stark(D) - {x90 | -y90} - readout, with BOTH arms at the registered `stark` operation's OWN baked length D (arm 1's idle is derived from it). There is deliberately NO dynamic-duration override — the stark waveform is arbitrary and QUA would ZERO-PAD it, leaving free evolution in arm 2; to change D, re-register the op (quam_config/register_stark.py) and arm 1 follows. The tone rides an update_frequency bracket (base_if + stark_detuning_hz) restored to resonance before the closing pulse and the readout, and only the tone AMPLITUDE is swept. Two closing bases (meas_basis: x90 -> <Z> = sin phi, -y90 -> cos phi, the latter realized as y90 with a negated amplitude_scale) let the estimator recover phi = atan2(sin, cos) unambiguously, and the y90 PREP anchors the phi=0 reference so the measured ABSOLUTE phase is the Stark-induced phase (nothing to subtract). The scqat estimator circle-fits the (cos, sin) quadratures and measures the phase about the FITTED CENTER (offset-robust, not a single-anchor subtraction), anchors phi=0 at the smallest |amplitude|, then fits phi vs amp^2 -> the Stark coefficient; phasor figure in expectation-value coordinates (<X>, <Y> = 1 - 2P). Record-only: no writeback, no catalog change. REQUIRES scqat >= v0.17.0 — the estimator (scqat.estimators.qubit_stark_phase_echo) is lazy-imported inside estimate(), so the catalog imports fine under an older scqat but `scqo run qubit_stark_phase_echo` fails LOUDLY with ImportError at estimate (this ONE experiment only; every other experiment is unaffected). HARDWARE-VALIDATED on 5Q4C 2026-08-13 (run 20260813-011304). ADDITIVE (scqo) — `scqo doctor` gains the MULTI-ACCOUNT-SERVER WITNESS: it WARNs when the running venv's base interpreter is profile-resident (pyvenv.cfg home / sys._base_executable under a C:\\Users\\<someone> profile) and when the resolved lab config or data_root lives under a DIFFERENT account's profile — the uv-trampoline trap that passes for the installer and dies for every other SSH account before Python even starts. New [WARN] rows only; no existing behavior changes and warnings still exit 0. INSTALL section 5 gains the SERVER LAYOUT CONTRACT (nothing shared under C:\\Users: the D:\\github stack, the D:\\uv\\python interpreters via Machine-scope UV_PYTHON_INSTALL_DIR, the D:\\scqo config and the data_root all live on the neutral drive; profiles hold only ~/.scqo personal files), the section-1 explicit patch-dir venv form is promoted to REQUIRED on servers, and every tag upgrade now ends with the acceptance gate: `scqo doctor` from a NON-INSTALLER account over SSH. ADDITIVE (scqo-qm; NO ledger fragment was written for this feature — recorded here at release time) — `scqo run <name> --preview` now renders a SELF-ACQUIRING PAIR SHELL when it exposes a preview_program() hook AND exactly one --target is given: the single target's program is built (no acquire) and rendered as usual. qc_n_stark_amp and qc_n_swap_amp opt in (each probe() factored into a shared _build_pair_program); multi-target or hook-less self-acquiring shells still refuse BY NAME, and the other four self-acquiring shells are unchanged. FIX (scqo-qm) — qc_n_stark_amp's round body now idles gap_cycles BETWEEN the swap and the stark tone (swap -> gap -> stark, was swap -> stark -> gap), so the swap's flux pulse settles BEFORE the off-resonant tone plays; sequencing only — the dynamic loop bound, the swept amplitude and the readout are unchanged. STILL OWED from v2.0.0: register_stark.py run + calibrate and qc_n_stark_amp HARDWARE VALIDATION — treat qc_n_stark_amp results as unvalidated until then, and note that this release CHANGES its pulse ordering, so any earlier offline comparison is supers