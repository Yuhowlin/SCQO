notes = "MINOR COMBO - ONE feature, and the smallest cut since v1: qubit_tomography gains two optional per-qubit knobs and a rebuilt QM sequence. The digit is the experiment's (y+1 for any experiment-level change). NOTHING an operator owns changes shape - no Parameters renames, no experiment renames, no state-file, config or stored-data changes, no new dependency, and the scqat floor does not move. UPGRADE REQUIRES exactly one action: EDITABLE REINSTALLS. All three scqo pyproject versions bumped and .dist-info freezes the version at INSTALL time, so a git checkout alone leaves every venv still reporting 3.4.0 while the CODE is live. Run per venv: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO --no-deps (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. scqat needs NO reinstall this cut - it is unchanged at v0.22.0. Verify with importlib.metadata.version, NEVER by checking that the import works. Unlike v3.4.0 the previous cut's reinstalls WERE performed: all three venvs reported 3.4.0 / 0.22.0 at the time of this cut, so the backlog is cleared and only this one bump is outstanding. WHAT SHIPS: ADDITIVE - qubit_tomography per-qubit AMPLITUDE and DETUNING (scqo + scqo-qm; Yuhowlin, SCQO PR #27 + scqo-qm PR #30). Each entry of qubit_configs may now carry `amp` (a scale on the target gate's amplitude, default 1.0) and `detuning` / `frequency_shift` (Hz, default 0.0) beside the existing init_state / target_gate / noise_mode. The detuning is applied with update_frequency immediately before the target gates and restored immediately after, so it shifts the GATE and nothing else in the shot. qubit_configs is dict[str, dict[str, Any]] with NO key validation, so the SCQO half of this feature is literally its Field description and the entire mechanism is the QM probe - which is also why a MISSPELLED key is silently ignored rather than refused, unchanged from before this cut. Be aware the probe additionally honours `amp_scale`, `frequency_detuning`, `intermediate_frequency` and `frequency` as extra spellings that the documented surface does not mention; prefer the two documented names. Qblox does not realize the new knobs - its tomography probe ignores them. BEHAVIOR CHANGE - THE QM TOMOGRAPHY SEQUENCE IS REBUILT AROUND THE SAME MEASUREMENT, so runs taken before and after this cut are NOT directly comparable even with identical parameters. Four changes, none of which alter the output: gate counts unroll through switch_(gc_idx) / case_ with a Python-level repeat instead of for_(rep, 0, rep < gc_idx, rep + 1); every shot now calls reset_if_phase on each xy element and reset_global_phase once, on top of the existing reset_frame; the basis rotation and the symmetrized-readout x180 are played per BASIS under switch_(b_idx) rather than per QUBIT under if_/elif_; and every bare align() became align(*names) over the xy + resonator elements. The dataset dims, variables, TomographyContract and the scqat estimator are all untouched, so OLD RUNS RE-ANALYSE UNCHANGED and no estimator or floor moves - this is a change to how the pulses are emitted, not to what is recorded. The switch_ unrolling also makes program size grow with sum(gate_counts) rather than with len(gate_counts); the default 0..10 is 55 gate plays per qubit per shot, and a much wider sweep is the case to watch for program memory. KNOWN INERT: QMQubitTomography also gained preview_program() (training shots omitted, thermal wait skipped), and it is DEAD CODE in this cut. The dispatch line that would reach it - 'if reason:' becoming 'if hasattr(experiment, preview_program)' in QMBackend.preview - was misfiled into the close-qm PR (scqo-qm #31), which is held. --preview still works: qubit_tomography does not declare probe_self_acquires, so it falls through to probe() and renders the full program INCLUDING the training shots. Tracked as scqo-qm issue #36. ACCEPTED DEFECTS, filed rather than fixed at merge time by the maintainer's call, all three in the QM probe: (1) scqo-qm #33 - num_training_shots=0 now drops the I_train/Q_train stream declarations, but acquire() still fetches both handles unconditionally and TomographyContract still REQUIRES both variables, so a run with zero training shots dies during fetch where it used to produce empty arrays. num_training_shots has no lower bound, so this is reachable from parameters.toml. (2) scqo-qm #34 - align(*names) lists only the xy and resonator elements, so a flux/z element is no longer inside the barrier that bare align() covered, including the one after reset and the one before measurement; a no-op on a fixed-frequency chip, not on a tunable one. (3) scqo-qm #35 - reset_global_phase() sits in a bare except Exception: pass that swallows NameError, while the reset_if_phase() on the line above it does not, so on a qm version lacking both the first dies loud and the second silently never happens. NO NEW TESTS ship with this feature: the scqo-qm suite is 374 both before and after, the same count as v3.4.0, and scqo-qm has no CI workflow at all - the local .venv-qm run below is the ONLY automated check this probe will ever get. HELD, NOT IN THIS CUT, so the ledger records the decisions: SCQO PR #29 (viewer lab-dashboard xlsx + pptx slide export, campaign_query) stays open pending a charter decision - it would bake a lab-specific bilingual reporting template, including a sheet named in Traditional Chinese, into the vendor-neutral core of a public BSD-3-Clause repo, and add python-pptx as a fourth export format beside HTML/xlsx/PDF; its campaign_query defects are filed as SCQO issue #30. SCQO PR #28 (scqo close-qm) was CLOSED unmerged: it put a vendor name into the neutral core three times (scqo close-qm, scqo/cli/close_qm.py, Session.close_qm()) plus an _ALIASES shim that the no-shims house rule forbids and that test_cli_backends.py's 'retired, no aliases' comment contradicts. It is replaced by the _distortion_hint shape - the neutral core holds only a hook NAME and a line builder, the backend returns a command STRING, and the real work is an argparse module in the driver (python -m scqo_qm.backend.close_qm, mirroring apply_distortion) that only runs in .venv-qm. scqo-qm PR #31 stays open carrying QMBackend.close_qm() for that work, once its two unrelated changes are split out. scqo-qblox carries NO functional change in this cut - its tree is identical to v3.4.0 apart from the version bump, which is taken rather than a lagging-metadata re-tag because every previous tag of that repo has a matching pyproject version and stale metadata is exactly the trap described above. OFFLINE-VALIDATED at the cut: scqo 900 (.venv-view, driver-free), scqo-qm 374 (.venv-qm), scqo-qblox 319 (.venv-qblox), plus SCQO 3-OS CI green on main. scqat not re-run - unchanged. HARDWARE LEDGER: NOTHING in this combo has reached an instrument. NEWLY OWED - the rebuilt qubit_tomography QM sequence has had no instrument contact and not even a gateway preview, and it lands ON TOP of the interleaved-noise validation that has been owed for this same experiment since v3.1.0; the two are now one debt and the phase-reset and align() changes are exactly what a real run would test. STILL OWED, carried forward from v3.4.0 unchanged - qc_unidirectional_trotter (no instrument contact at all), the single_shot_readout uncalibrated-rotation fix on a first bring-up, both parametric-drive shells on QM, ALL SIX Qblox probes from PR #12, qubit_ramsey_phasor on both backends, the Qblox cryoscopes and their applied filter, the broadband RESONATOR variant and cross-band switching, punchout v2 on Qblox, the coupling-coefficient live run, readout average mode on both backends, register_stark.py + qc_n_stark_amp, and the quam-builder v0.5.0 first-real-OPX1000-run watch. SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.5.0 in scqo / scqo-qm / scqo-qblox, scqat STAYS at v0.22.0, the editable reinstalls above (REQUIRED), restart the viewer,