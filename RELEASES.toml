notes = "Experiment capabilities become CODE, and catalog tags are DERIVED from them. New scqo/experiments/_capabilities/: one module per capability owning the canonical Parameters mixin + contract fragment + simulate/estimate helpers — state_readout.py (StateReadoutParameters carries THE one use_state_discrimination field text; STATE_ALT; state_row/readout_vars/signal_rename) and flux.py (FluxSweepParameters min_flux_v/max_flux_v/num_flux_points with +-0.5 V rails; the canonical probe axis FLUX_AXIS='flux_bias_v'; FluxComponentParameters + the foreign_flux_source record-only guard). catalog() entries gain 'tags' derived from Parameters-mixin subclassing (state_readout: relaxation/echo/ramsey/power_rabi/sqrb/relaxation_flux/echo_flux; flux: resonator_spectroscopy_flux/qubit_spectroscopy_flux_pulse/relaxation_flux/echo_flux; ZERO tags is legitimate — a new experiment may not be classifiable yet, and no test may demand tag completeness); the CLI menu and --help epilog render them; declared-string tags do not exist, so a tag cannot lie or rot (tests/test_capabilities.py locks the census, the canonical field texts, and the FLUX_AXIS contract). REAL WIRING: qubit_sqrb + qubit_relaxation_flux + qubit_echo_flux now support state discrimination end-to-end (simulate state branch, state->signal, contract accepts state — the flux pair's old contracts REJECTED a state dataset; the QM flux shells now pass the flag through to probes that already implemented the state path); qubit_pi_pulse_error DROPS use_state_discrimination (its QM shell hardcodes False, matching the DRAG pair — the field was a dead promise). RENAME (no alias, the standing rule): qubit_relaxation_flux/qubit_echo_flux parameters min_flux_amp_in_v/max_flux_amp_in_v -> min_flux_v/max_flux_v and sweep axis flux_amp -> flux_bias_v; scqat's coherence-flux estimators (bumped to v0.3.0, THE COMBO MUST PIN IT) consume coord flux_bias and return results key flux_bias; new runs of the pair record fit key flux_bias_v (old run folders immutable, keep flux_amp, no reindex — index stays v7). UPGRADE REQUIRES: git fetch --tags && git checkout v0.12.0 in the four scqo-versioned repos AND scqat at v0.3.0, then re-run `uv pip install -e . --no-deps` in each editable env; RENAME user parameters.toml keys under [qubit_relaxation_flux]/[qubit_echo_flux] (min_flux_amp_in_v -> min_flux_v, max_flux_amp_in_v -> max_flux_v) and DELETE any use_state_discrimination key under [qubit_pi_pulse_error] — stale keys fail loudly (extra='forbid'). BEHAVIOR: the coherence pair's flux window is now rail-bounded to +-0.5 V (was unbounded); carrier field-description texts unify on the canonical mixin texts; catalog entries gain the additive 'tags' key. DATA CAVEAT: none — additive schema, no reindex."

