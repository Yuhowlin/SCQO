notes = "QUBIT RESET BECOMES A CAPABILITY. Every experiment that pulses a qubit and reads it out assumes shot-to-shot independence, but the reset that buys it was invisible and hard-coded: on QM 12 scqo shells passed reset_type='thermal' and 4 more probes called qubit.reset('thermal') inline, so the wait was always QUAM's derived thermalization_time_factor * T1; on Qblox it was element.reset.duration (500 us in the lab config) — except qubit_power_rabi and qubit_ramsey, which had NO Reset at all and leaned on a hard-coded trailing IdlePulse(10 us), shorter than several measured T1s and 50x shorter than the rest of the suite. NEW: `_capabilities/qubit_reset.py` — QubitResetParameters (reset_method: Literal['thermal'] = the extension point active reset will widen, plus the per-run override thermalization_time_ns) and reset_wait_ns(), the ONE precedence point both drivers call so an override cannot come to mean different things per backend. Derived tag `qubit_reset`, appended LAST in _derived_tags so existing tag lists keep their order; carried by all 16 core experiments that already reset (resonator/punchout stay tag-less — no qubit pulse, nothing to reset). NEW PUSHED KNOB: `thermalization_time_s` on the DRIVE channel (q1_xy), absolute seconds, portable — declared after pi_duration_s and before the drive_amp/drive_power_dbm chain pair so push order is unaffected. qubit_relaxation now writes TWO roles from one fit (the placement rule's 'classify each USE'): t1_s stays a fact -> physical.json, and thermalization_factor x T1 (new Parameters field, default 10.0) becomes the knob -> scqo_state.json + pushed. Manual bring-up before any T1 exists is `scqo set q1.thermalization_time_s=...`, which needed no new code (the qubit closure routes it to q1_xy). VENDOR HOMES: Qblox maps 1:1 onto element.reset.duration (both absolute seconds — the one field needing no conversion), and because Reset() compiles to IdlePulse(reset.duration) every Qblox probe honours it with no probe-side argument. QM has no writable absolute field — thermalization_time is a read-only factor*T1 property — so LCHQMDriver adds ThermalizingFixedFrequencyTransmon / ThermalizingFluxTunableTransmon storing thermalization_time_ns and overriding the property to prefer it (falling back to the derived value when scqo has never calibrated), which keeps qubit.reset('thermal') correct in all 16 QM probes with ZERO probe or shell edits. `Unrealized` was evaluated for QM and REJECTED: _set_knob pushes before recording with no NotImplementedError handling (unlike _seed_push), so the knob would be unsettable, and _seed_pull builds its cache from the vendor snapshot alone, so a stored value would read back None every session — a knob needs a real vendor home. The per-run override is a recorded set->revert bracketing probe() on QM (the wait is baked into the compiled program at build time) and the whole acquire on Qblox (the scheduler expands Reset during compilation inside run()); it writes the vendor tree directly, leaving no ChangeRecord and no store row. MIGRATION REQUIRED on QM: each qubit serializes its own __class__, so a device only gets an absolute wait once its state.json qubits name a Thermalizing*Transmon; until then set_thermalization_time raises NotImplementedError naming the fix, and the derived factor*T1 keeps working. This is a per-device-config edit, NOT the quam_config/my_quam.py qubit_type toggle (that is the lab's charge-tunable switch and is governed separately). ALSO: `scqo state` column width is now derived from the widest field name — at the hardcoded 20 the 21-character fields (readout_integration_s, and now thermalization_time_s) collided with their left neighbour. VERIFIED: 605 offline tests (scqo 454 / lchqmdriver 105 / lchqbdriver 46) plus a simulated end-to-end CLI walkthrough (run -> two suggestions -> accept -> both stores -> scqo set -> history). UPGRADE ACTIONS: (1) `git fetch --tags && git checkout v0.14.0` in SCQO + both drivers (scqat stays v0.3.0; do NOT install scqo-contrib, still v0.12.0 and incompatible). (2) RE-RUN `uv pip install -e . --no-deps` in every editable env — an editable install serves live source but freezes its recorded VERSION at install time, so `scqo doctor` otherwise keeps reporting the old number (this is what v0.13.1 existed to fix). (3) QM devices only: migrate each device config with `python scripts/migrate_thermalizing_transmon.py <backend_config_dir>` in LCHQMDriver — it backs the file up to `<name>.pre-thermalizing.bak`, offers `--dry-run`, edits only the `__class__` lines by targeted string replacement (no JSON round-trip, so formatting survives), asserts the root `__class__` and top-level key set are unchanged, and is idempotent. chipA and 5Q4C are ALREADY migrated. An unmigrated device is not broken — it keeps running on the derived factor x T1 and only refuses `scqo set <q>.thermalization_time_s`, naming the script. No data action: run folders are immutable, the index is unchanged."

