date = 2026-08-01
scqo = "v0.21.0"                 # qubit_parity_switch is parameterized by RECORD TIME
lchqbdriver = "v0.21.0"          # shot count from the neutral layer
lchqmdriver = "v0.21.0"          # shot count from the neutral layer
scqo-contrib = "v0.12.0"         # still NOT in the combo (unchanged since v0.13.0)
scqat = "v0.10.0"                # spectral gate + the reach diagnostics — REQUIRED
notes = "PARAMETER CHANGE: qubit_parity_switch now takes record_time_s (default 30 s), not num_shots. What limits the measurement is the parity spectrum's LOWEST FREQUENCY BIN, 8 / record_time_s, so a rate whose corner (rate / pi) sits near it is fitted from only a handful of points. The first real chipA run (20260801-191415-048) made this concrete: 30.379 s of record put the low edge at 0.2633 Hz against a corner at 0.7488 Hz — only 2.84x of headroom, with barely three bins on the plateau. The shot count is DERIVED using the target's estimated shot period (idle + readout + depletion + the two pi/2 pulses). NOTE THE DIVISOR IS THE SHOT PERIOD, NOT THE IDLE: that run has a 9.04 us idle inside a 30.379 us shot, so dividing by 1/(2 x parity_delta_f_hz) would under-record by 3.4x. num_shots SURVIVES as an explicit override and BYPASSES max_num_shots (default 2e6, under the Qblox 3e6 acquisition-bin limit so the neutral refusal fires first) — exactly as idle_time_ns bypasses max_derived_idle_ns; the ceiling guards the derived value only. Old scripts passing num_shots explicitly keep working unchanged. With several targets the count is the MAX over them, so every target records at LEAST record_time_s. The achieved record_time_s (from the period the probe really scheduled) is recorded beside the request, since the count came from an estimate. GATE CHANGE, AND IT CAN FLIP A RUN'S OUTCOME: MAX_ODD_FRACTION on p_switch is REPLACED by MIN_PSD_CONTRAST = 3.0 on the plateau-to-floor ratio A/B. p_switch was the wrong quantity — any shot-to-shot noise drives it toward 0.5 whether or not a knee exists, and that chipA run reported p_switch = 0.294 against the old 0.40 ceiling despite a textbook fit (A/B = 7826), i.e. within 1.4x of refusing a good measurement. Contrast separates by eight orders of magnitude: ~1e-9 on uncorrelated data against 7e2-8e6 on real telegraphs, including one buried under 30% spurious flips. A run previously refused for p_switch > 0.4 may now legitimately PASS; p_switch is still reported but no longer decides. NEW DIAGNOSTICS on the run record: psd_freq_min_hz (the low edge — what your record length bought), psd_contrast, corner_margin_low (= corner / low edge). corner_margin_low is REPORTED, NEVER GATED — a thin margin means a longer record would tighten the fit, which is your decision, and refusing would throw away a usable measurement. The PSD figure draws the low edge and says so. NO RE-MEASUREMENT NEEDED for v0.20.0 data: re-analysing that chipA run through v0.21.0 reproduces 2.3525 Hz and corner 0.748823 Hz exactly, and now passes on contrast. Re-run `uv pip install -e . --no-deps` in all three venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout; these uv-managed venvs have NEITHER pip NOR uv inside them, so drive it from outside: `uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps`."

[v0-20-0]
date = 2026-08-01
scqo = "v0.20.0"                 # the parity is the pair difference, not the readout
lchqbdriver = "v0.20.0"          # docs only (the probe is unchanged and correct)
lchqmdriver = "v0.20.0"          # docs only (the probe is unchanged and correct)
scqo-contrib = "v0.12.0"         # still NOT in the combo (unchanged since v0.13.0)
scqat = "v0.9.0"                 # the fix itself — REQUIRED, see the notes
notes = "RETRACTION: EVERY parity_rate_hz FROM v0.19.0 IS INVALID. qubit_parity_switch fitted its Lorentzian to the wrong time series. The sequence is a unitary, so it maps antipodal Bloch vectors to antipodal ones and |0> and |1> can NEVER give the same outcome; with no qubit reset and a QND readout each shot starts where the last was projected, so s[i] = s[i-1] XOR parity[i]. The readout is the RUNNING XOR of the parity, and the CONSECUTIVE-PAIR DIFFERENCE is the parity telegraph. v0.19.0 fitted the readout, i.e. an integrated telegraph, and its rates mean nothing. Verified: fitting the pair series recovers 50.53 Hz against a 50 Hz truth while fitting the readout fails outright. ACTION: DELETE any parity_rate_hz accepted into physical.json from a v0.19.0 run — do not merely re-check it. THE RAW DATA IS FINE: only the analysis was wrong, so re-analysing an existing run folder is enough and no re-measurement is needed. ROOT CAUSE, now corrected in SCQO and both drivers: the design docs claimed 'the sequence re-prepares the equator each shot regardless of the starting pole'. It re-prepares at the OPPOSITE point. The absence of a qubit reset is consequently REQUIRED and not an optimization — a reset would sever the XOR chain that carries the parity. RENAMES (contract change, hence the minor bump): scqat's p_excited -> p_high and p_odd -> p_switch; scqo's fit dict now carries p_switch, p_parity_odd and n_parity_switches. NOTE p_parity_odd ~ 0.5 is HEALTHY — it only says the chip sits in each parity about half the time — while p_switch is the parity's own switching fraction and the quantity MAX_ODD_FRACTION = 0.40 guards. Under v0.19.1 (prepared, never published) that guard read the wrong series and would have rejected every healthy run. READOUT FIDELITY NOW MATTERS SHARPLY: one bad shot corrupts TWO adjacent parity samples, so the corruption is lag-1 correlated rather than white and the rate inflates as 1 + 2 x eps / (rate x shot_period) — measured 1.4x at eps = 0.1% and 6.6x at 0.6%. Aim for eps < 0.1 x rate x shot_period, and note that sampling SLOWER suppresses the bias (the opposite of the usual instinct) as long as p_switch stays under 0.4. PLOTS: four panels now — `trace` (raw readout, the running XOR), `parity` (the measured telegraph, and the series that is fitted), `psd` (the parity spectrum WITH the Lorentzian fit) and `state_psd` (the raw readout spectrum, deliberately UNFITTED and diagnostic-only). Both time-domain panels are scatter, since at 1e6 shots a connected step plot fills solid. Re-run `uv pip install -e . --no-deps` in all three venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout; these uv-managed venvs have NEITHER pip NOR uv inside them, so drive it from outside: `uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps`."

[v0-19-0]
date = 2026-08-01
scqo = "v0.19.0"                 # qubit_parity_switch + the Ramsey beat splitting it feeds on
lchqbdriver = "v0.19.0"          # the parity-monitor probe, AND the Ramsey virtual-detuning fix
lchqmdriver = "v0.19.0"          # the parity-monitor probe + shell
scqo-contrib = "v0.12.0"         # still NOT in the combo (unchanged since v0.13.0); its sandbox experiments still
                                 # predate the v0.17.0 amplitude renames
scqat = "v0.8.0"                 # the telegraph-PSD reduction + the parity_switch estimator — REQUIRED, see the notes
notes = "REQUIRED: scqat MUST be at v0.8.0 — qubit_parity_switch imports scqat.estimators.parity_switch, which does not exist before it, so an under-version scqat fails the run outright (loudly, unlike v0.18.0's silent trap). Re-run `uv pip install -e . --no-deps` in ALL THREE venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout: an editable install serves live source while reporting a stale version, so `scqo doctor` can read correct while the code is not. NEW — qubit_parity_switch, the charge-parity switching-rate monitor. y90 - fixed idle - x90 - measure, recorded as num_shots single shots with ONLY the resonator depletion wait between them (it carries NO reset_method at all: the sequence re-prepares the equator every shot, and the shot cadence IS the telegraph timebase a reset would stretch). The idle is 1/(2 x parity_delta_f_hz), a +/- pi/2 parity phase, and the 90-degree-shifted second pulse measures sin of it — ODD in parity, where a same-axis pair measures the even cos and sees nothing. The discriminated 0/1 trace is a random telegraph signal; the Lorentzian corner of its Welch PSD gives the rate (parity_rate_hz = pi x corner), a new transmon-family mode FACT. It is fed by qubit_ramsey's beat model, which gains a `ramsey_model` Literal to force the two-frequency fit and now proposes the splitting as the new drive-channel MONITOR parity_delta_f_hz — the splitting has to be a channel monitor because mode facts are unreachable at define_sweep time. Workflow: run qubit_ramsey with ramsey_model='beat' -> scqo accept -> run qubit_parity_switch -> scqo accept; a 2-step campaign repeats it (update='apply' tracks the drifting splitting, update='none' monitors at fixed calibration). It also REQUIRES an accepted single_shot_readout (stored pos_* centres pin the trace discrimination) and an accepted resonator_spectroscopy (readout_depletion_s governs the shot cadence). FIX, AND IT CHANGES ACCEPTED NUMBERS ON QBLOX: the Qblox Ramsey's artificial detuning never reached the instrument. X90(qubit, phase=...) silently DISCARDED the phase (not an Rxy factory kwarg, so it landed in device_overrides and the compiler dropped it) on a schedule that still compiled, so every Qblox Ramsey ever run measured |err| alone — usually under scqat's one-cycle gate, fitted as 'relaxation' and marked FAILED, which is why it went unnoticed. Now Rxy(theta=90, phi=-360*detuning*tau), and the NEGATIVE sign is load-bearing: a positive ramp gives |applied - err| and walks the drive to an absorbing point at err = 2*applied where detuning_error_hz reads exactly 0.0 and the fit looks perfect. A converged Ramsey therefore does NOT prove the sign — cross-witness with qubit_spectroscopy, which finds an absolute peak. Any Qblox qubit frequency calibrated by Ramsey before this release should be re-measured. LCHQMDriver's claim that a frame rotation is 'the opposite handedness to a pulse-axis phase' was FALSE and is corrected; the QM SIGN was always right and does not change."

[v0-18-0]
date = 2026-08-01
scqo = "v0.18.0"                 # the qutrit readout sibling + the thermal-population experiment (n_th's first writer)
lchqbdriver = "v0.18.0"          # the ground-only IQ-cloud probe
lchqmdriver = "v0.18.0"          # GEF and ground-only probes for the scqo readout family
scqo-contrib = "v0.12.0"         # still NOT in the combo (unchanged since v0.13.0); its sandbox experiments still
                                 # predate the v0.17.0 amplitude renames
scqat = "v0.7.0"                 # pinned centres survive the fit and the plot window — REQUIRED, see the notes
notes = "REQUIRED, AND THE FAILURE IS SILENT: scqat MUST be at v0.7.0. qubit_thermal_population prepares only |g> and pins the readout channel's STORED g/e centres into the mixture fit, i.e. (n_state, n_center) == (1, 2). Before scqat's fix, discriminate unpacked only n_state centres and — in its own commit's words — SILENTLY DROPPED THE REST: on scqat 0.6.0 the fit does not raise, it quietly returns a wrong n_th. There is no version pin protecting you (SCQO declares a bare `scqat` on purpose — the lab and CI both install scqat EDITABLE, which bypasses resolution entirely, so a floor would enforce nothing; this manifest is the authority, which is exactly why it says so here). So: re-run `uv pip install -e . --no-deps` in ALL THREE venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout — an editable install serves live source while reporting a stale version, so `scqo doctor` can read correct while the code is not. NEW — single_shot_readout_gef, the QUTRIT sibling of single_shot_readout. Same per-shot prepared_state x shot_idx contract with one more prepared state: prepared_state [0,1,2] -> a 3x3 confusion matrix (counted and fitted twins), fidelity_g/e/f, and pos_{g,e,f}_* monitors (three new catalog monitor fields). It proposes NO discriminator knob, deliberately: readout_rotation_rad / readout_threshold describe a scalar cut on ONE rotated quadrature, which separates two blobs and has no three-state analogue — |g>, |e> and |f> sit on a TRIANGLE in the IQ plane and are classified by nearest centre in 2-D. The two-state single_shot_readout remains THE authority for those two knobs; do not 'fix' this by having the qutrit run propose them. QM-ONLY: preparing |f> needs a calibrated 1->2 (EF) pi pulse, which only the QM backend has today — a Qblox session gets the base probe()'s NotImplementedError. Qblox has the <q>.12 clock but no gate targets it. NEW — qubit_thermal_population, the first writer of the mode fact n_th. single_shot_readout already reports this number as a by-product of preparing BOTH states; this experiment prepares only |g> and spends every shot on the ground-state cloud, which is what a 1-5% population needs — the number is a small minority of a large sample, so the STATISTICS, not the fit, set the error bar. Because only one state is prepared, nothing in the data says where |e> is: the centres come from the readout channel's stored pos_* monitors (an accepted single_shot_readout run), pinned into the fit, and the experiment REFUSES to run without them rather than inventing a second centre from a cloud that has only one. That reference is snapshotted into dataset.nc at acquisition time, so the analysis replays offline unchanged. It also REFUSES reset_method='active' BY NAME — active reset removes exactly the population being counted (use 'thermal', and raise thermalization_time_ns if you want a longer wait). Both refusals fire in define_sweep, before any hardware runs. TWO READINGS, AND THEY ARE NOT ONE QUANTITY BY TWO METHODS: p_e_given_g is COUNTED (nearest-centre hard assignment — population PLUS the readout overlap error) and pop_e_prep_g is the FITTED mixture weight (population with the overlap removed). The FITTED one is the chip fact n_th. ALSO: _scqat.per_qubit_results gains a keyword-only per_target_kwargs for knobs whose VALUE differs per qubit (the pinned centres are the first user), merged over the shared kwargs with per-target winning; and report.FIT_ONLY_QUANTITIES gains p_g_given_e, which it had been missing beside its three siblings. NO BREAKING CHANGES — everything here is additive (new modules, new monitors, a keyword-only parameter), nothing like v0.17.0's amplitude renames. No device action and no data action: run folders are immutable and datasets recorded before this release are unaffected."

