notes = "BREAKING COMBO — ten features (3 breaking / 5 additive / 2 fix), the largest cut since v1; the three breaking fragments all rename things an operator owns. UPGRADE REQUIRES, in order: (1) DETUNING WINDOWS (drive + readout, both frames in the FIELD NAME): the four qubit_spectroscopy* experiments retire frequency_span_hz/num_points (qubit_spectroscopy, _overlap), frequency_span_hz (_flux_pulse) and min/max_detuning_hz (_cryoscope) for start_drive_detuning_hz/end_drive_detuning_hz/num_drive_freq_points, and the five readout sweeps (resonator_spectroscopy, both punchouts, resonator_spectroscopy_flux, readout_frequency) retire frequency_span_hz + num_points/num_freq_points for start_readout_detuning_hz/end_readout_detuning_hz/num_readout_freq_points — update standing parameters.toml overlays, campaign plans and scripts; a stale key is REFUSED at run() (the catalog overlay skips it silently, so --help looks fine and the run does not). Windows may be ASYMMETRIC and the edges take EITHER order; the axis is always emitted ascending because scqat's peak_fit mis-fits a descending axis SILENTLY. The operator parameters.toml on the dev machine is already migrated. (2) RESONATOR FACT RENAMES: f_r0_hz -> f_bare_hz and f_r_hz -> f_dress0_hz in every physical.json and design.toml (values unchanged; a cavity's f_r_hz is NOT renamed) — ALREADY APPLIED to 5Q4C (cd1, cd2) and chipA (cd1 x3) plus both design.toml; any OTHER device folder must be migrated before running. Delete any f_q_max_hz key from [resonator_spectroscopy_flux] tables (Parameter retired, extra=forbid refuses). (3) LOCKSTEP FLOOR, SILENT THE WRONG WAY: scqo-qblox MUST move to v3.0.0 with scqo — a pre-v3 qblox shell against v3 scqo re-derives a symmetric center+/-span/2 NCO sweep, so an ASYMMETRIC window is quietly re-centered and every fitted frequency is attributed wrong; it bites hardest on the punchout, which walks the dip DOWN from f_dress0 toward f_bare. scqo-qm is safe either way (probes consume sweep_axe