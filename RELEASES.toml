notes = "ADDITIVE COMBO - six features (5 additive / 1 fix). Nothing existing changes shape, so there is no migration; the required actions are environmental and analytical. UPGRADE REQUIRES, in order: (1) EDITABLE REINSTALLS - all four pyproject versions bumped and .dist-info freezes at INSTALL time, so a git checkout alone leaves every venv reporting the old number: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps per venv (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. Verify with importlib.metadata.version, never by checking that the import works. (2) scqat PIN v0.20.0 IS A HARD FLOOR, two ways and both LOUD: qubit_ramsey_phasor's estimate() lazy-imports scqat.estimators.ramsey_phasor (ImportError below the pin), and that same commit is also the first to REGISTER get_fitter('stretched_exp') and to export lockin_phasor from scqat.tools - both modules existed in the tree unwired, so get_fitter('stretched_exp') raised ValueError until now. qubit_tomography independently needs scqat >= 0575c24 for the new noise_condition dimension (IndexError below it). (3) RE-ANALYSE, do not replot, any qubit_tomography run recorded before this cut: it re-analyses fine from dataset.nc (the estimator handles a dataset with no noise_condition), but its stored fit dict lacks the new baseline_/delta_ keys, so replotting straight from saved metadata fails. (4) RE-RUN any qubit_sqrb that failed under use_state_discrimination - see FIX below. Nothing recorded is invalidated: those runs produced no fit at all. WHAT SHIPS: ADDITIVE x5 - QUBIT_RAMSEY_PHASOR, a new experiment that sweeps the closing pulse's phase through a full turn at every idle time, so the Ramsey fringe lives in the FRAME axis and the idle axis is free to be LOG-spaced. A lock-in reads the coherence envelope off the phasor magnitude and the accumulated phase off its angle, so it reports the DECAY SHAPE - the stretch exponent p (1 = Markovian/white noise, 2 = the Gaussian decay of a 1/f-dominated environment) - alongside T2*, which plain qubit_ramsey cannot: its linear axis is spent resolving the fringe. Prefer qubit_ramsey for a fast frequency correction; this costs num_frames times as many points and buys the shape. NO artificial detuning is applied or offered (the contrast is provably detuning-independent, so the phase slope IS the residual error), which also removes the negated virtual-detuning ramp and its documented sign trap from both probes. Writes back t2_star_s plus drive_freq_hz / f_01_hz, the latter isfinite-guarded because the detuning is NaN-gated when the phase unwrap runs out of unambiguous branches; stretch_p is record-only (no catalogued field). num_frames floors at 4, NOT 3: a real 2f contaminant from an over-rotated pi/2 pulse carries both +2 and -2 harmonics and at 3 points the -2 aliases onto the signal at full weight (lockin.py's docstring claimed 3 was enough and is corrected). Three estimator design points were forced by measurement and are worth knowing before touching it: a naive whole-axis np.unwrap CANNOT be gated after the fact (unwrap makes every step sub-pi by construction) and aliased a 300 kHz detuning to 20.8 kHz, so the phase is unwrapped against a running prediction and CUT at the first ambiguous branch; the slope fit is weighted by the contrast because a phasor's phase uncertainty goes as 1/|z|; and lmfit reports success=True on pure noise while railing tau low and p high, so the envelope fit is gated on variance explained, on no railed parameter and on the degrees of freedom instead. Both probes ship; the QM one is gateway-verified. QUBIT_PARAMETRIC_DRIVE, a new record-only experiment: pi pulse, then an RF tone on the qubit's own flux (z) line swept over absolute amplitude x frequency at a fixed user-given drive_time_ns, reading the qubit back - the parametric-coupling operating-parameter map. QM-only probe (it patches the GENERATED config with a z-element oscillator through its acquire callable, never the QUAM tree); preview compiles through the new generic QMBackend patch_preview_config hook. Qblox not realized. QBLOX CRYOSCOPE PORT - both cryoscopes now probe on Qblox. qubit_ramsey_cryoscope keeps the full 1-ns duration axis by COMPOSING each duration as a 4k-ns voltage-offset segment plus a 1/2/3-sample SquarePulse remainder (three waveforms total; every flux wait a multiple of 4, since the compiler refuses waits under 4 ns), with the frame axis a realtime PHASE loop via ShiftClockPhase; max_duration_ns is capped at 512 by the readout QRM's 12288-instruction budget and refused by name. qubit_spectroscopy_cryoscope is square-drive ONLY (cosine and gaussian refused by name), its pi-area amplitude sampled from the rxy DRAG envelope. New operator CLI python -m scqo_qblox.backend.apply_distortion (--run/--extend/--clear/--dry-run; the 4-stage bank overflows LOUDLY, --extend merges and re-partitions) writes ONE QbloxHardwareDistortionCorrection under distortion_corrections['<flux_port>-cl0.baseband']. CRYOSCOPE APPLY HINT - both cryoscopes now print on stderr, right after proposing distortion_amp / distortion_tau_s, the command that writes those taps into the VENDOR config. The taps are FACTS and scqo pushes nothing, so applying them was always a manual step that was easy to forget; the command now comes from the backend through the new duck-typed hook backend.distortion_apply_command(target, run_id). QM answers with the apply_distortion CLI (run-addressed when the run is known); Qblox declares none and the hint names the manual hw_config.json step instead. Absence of the hook is legal - an older driver just degrades to the named manual line. QUBIT_TOMOGRAPHY INTERLEAVED NOISE (contributed by Yuhowlin) - interleave_noise (default true) sweeps noise_condition ['off','on'] per shot whenever a spectator carries noise_mode, so common-mode drift (T1/T2) cancels and the estimator reports pure crosstalk drift |dr| alongside baseline/delta populations and a differential-drift figure. Under noise OFF the spectator plays a symmetric idle wait matching its gate length. estimate() now analyses only measured targets (noise_mode spectators are filtered out rather than reported failed), and the QM probe validates target gates / initial states / measurement bases BY NAME instead of silently doing nothing. Its QM probe dim renamed qubit -> target, the name the contract always demanded. FIX x2 - qubit_sqrb under use_state_discrimination had NEVER worked: estimate() handed the dataset to the scqat estimator unrenamed, so the discriminated probe's population variable - none of the I / state / signal names the estimator accepts - failed every run by name. It now routes through signal_rename like every other discriminated carrier; analog I/Q SQRB was never affected. And the interleaved-noise tomography TEST was fixed at this cut: it filled the reg and inv symmetry slices of each noise condition with the same population, and the estimator symmetrises as (p_reg + (1 - p_inv)) / 2, which maps a uniform p to exactly 0.5 whatever its value - so both conditions read 0.500, the delta was identically zero, and differential_drift came back exactly [0,0,0]. The inv slice now carries the INVERTED outcome the probe actually plays. The shipped estimator was correct and is unchanged; only the test's synthetic data was wrong. BEHAVIOR CHANGE, internal only: the log-spaced time-axis helper moved out of qubit_spectroscopy_cryoscope into the shared scqo.experiments._time_grid as log_time_axis_ns (behaviour-identical, verified equal across three windows). Its contract is now documented and tested in one place: THE AXIS SHRINKS - points are snapped to the 4 ns grid and de-duplicated, so the realized length is shorter than num_points (60 asked gives 59, 101 gives 88) and callers must read axis.size. HARDWARE LEDGER: VALIDATED THIS CUT - qubit_ramsey_phasor's QM probe is GATEWAY-VERIFIED (scqo run --preview compiled and SIMULATED on the live cluster with no warnings, emitting idle cycles floored at exactly 4 and endpoint-exclusive frames); qubit_parametric_drive gateway preview on 5Q4C q1 2026-08-20. Neither is a qubit-touching run. STILL OWED, carried forward from v3.0.0 - broadband RESONATOR variant + the cross-band SWITCHING path, punchout v2 on Qblox, the coupling-coefficient live run, readout average mode on both backends (v2.2.0), register_stark.py + qc_n_stark_amp (v2.0/2.1). NEWLY OWED this cut - qubit_ramsey_phasor on BOTH backends, the Qblox cryoscopes and their applied filter, qubit_parametric_drive's qubit-population run, and qubit_tomography interleaved noise. Qblox active reset for qubit_ramsey_phasor stays DENIED pending that hardware run (the QM twin opts in; the reset situation is byte-identical to plain qubit_ramsey, so it is a hardware gate and not a physics one - flipping it later is one ClassVar plus one line). OFFLINE-VALIDATED at the cut: scqat 668, scqo 868 plus 3-OS CI green, scqo-qm 346 (run with the shared .venv-qm), scqo-qblox 303 (run with the shared .venv-qblox). SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.1.0 in scqo / scqo-qm / scqo-qblox plus scqat at v0.20.0, the editable reinstalls above (REQUIRED this cut), restart the viewer, then scqo doctor from a NON-INSTALLER account over SSH."

