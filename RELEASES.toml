notes = "PATCH: v0.13.0 shipped with pyproject still declaring 0.12.0, so a correctly upgraded install REPORTED 0.12.0 — exactly the 'scqo doctor's version can lie' trap that editable installs already make easy to hit. Caught while performing the upgrade itself. Code is byte-identical to v0.13.0; only the declared version changes. The pushed v0.13.0 tag was deliberately NOT moved (standing rule). UPGRADE: checkout v0.13.1 in SCQO only, then re-run `uv pip install -e . --no-deps` in every editable env — the .dist-info metadata is frozen at install time, so without the reinstall the version keeps reporting stale no matter which tag is checked out."

[v0-13-0]
date = 2026-07-25
scqo = "v0.13.0"                 # the greenfield device model replaces the component model
lchqbdriver = "v0.13.0"          # per-kind channel views + kind-keyed fieldmap
lchqmdriver = "v0.13.0"          # same, plus the composite (pair) knob surface
scqo-contrib = "v0.12.0"         # NOT IN THIS COMBO — deliberately left behind, see below
scqat = "v0.3.0"                 # unchanged (estimators are model-agnostic)
notes = "THE DEVICE MODEL IS REPLACED (docs/greenfield-schema.md is the spec). A device is no longer a flat set of COMPONENTS with two category slots; it is four kinds of ENTITY: MODES (quantum degrees of freedom — transmon/flux_transmon/fluxonium/cavity/resonator), COMPOSITES (named mode groups with joint physics — qubit_pair, cat_system), LINES (one physical control path reaching the sample) and CHANNELS (one signal of one kind riding a line). components.toml is schema 3 with [modes]/[composites]/[lines]/[channels]; a line's RIDER LISTS mint the channels (readout=['q1','q2'] on one line IS frequency-multiplexed readout — the topology the old schema could not express) plus each readout target's <t>_res resonator mode. Design values move OUT of the roster into a sibling design.toml (entity-named tables, context-free vocabulary, editable after the production cut). FIELD ROUTING is now per-field by ROLE: fact -> physical.json, knob -> scqo_state.json + pushed, monitor -> scqo_state.json never pushed; both stores are schema 3 with top-level 'values' (scqo_state.json's old 'config' key is gone) and history rows say entity/kind (was component/category). KNOBS RE-HOME onto channels: q1.readout_freq -> q1_ro.readout_freq_hz, q1.pi_amp -> q1_xy.pi_amp, q1.idle_flux_v -> q1_z.idle_flux; measured flux transfer functions v_offset_v/v_per_phi0_v -> q1_z.flux_offset/flux_per_phi0; readout_fidelity DELETED (per-state fidelity_g/fidelity_e); readout_pos_* -> pos_*; the pair's coupler_decouple_v/coupler_interaction_v are gone — a coupler's standing bias is idle_flux on ITS OWN flux channel and gate points are per-operation composite knobs (<op>_coupler_flux). Addressing keeps the qubit-level sugar (scqo set q1.pi_amp routes through the closure to q1_xy). NEW: `scqo device freeze` writes components.lock and the append-only production cut becomes enforceable (superset by signature; retire, never delete); doctor gains model witnesses (unreachable modes, unbiasable couplers, design coverage, lock drift, roster-vs-vendor inventory, line->port wiring, and a live z element on a fixed-frequency qubit = FAIL). DRIVER CONTRACT CHANGE: build_backend(cfg, setup, roster) — a driver serves a view PER CHANNEL ENTITY and resolves names through the roster. UPGRADE REQUIRES: rewrite each device's components.toml to schema 3 and add its design.toml (chipA and 5Q4C are done; old files kept as *.v1.bak); the stores are FRESH-START (pre-v3 files are archived aside as *.v2.bak on first contact — knobs reseed from the vendor under state_sync='pull', monitors are re-measured, facts re-accumulate; a device with measured physics worth keeping can carry it across, since only the two flux-transfer fields rename); user parameters.toml needs no change. DATA: run folders are immutable and stay findable; result.fit keys follow the new spellings for NEW runs only. VERIFIED BEFORE THE CUT: 590 offline tests across the three repos (scqo 450 / lchqbdriver 43 / lchqmdriver 97+4skip), plus REAL-CONFIG and HARDWARE checks on BOTH devices — doctor + pull-mode seeding against the actual vendor configs, and a live resonator-spectroscopy smoke run on chipA and 5Q4C. SCQO-CONTRIB IS DELIBERATELY NOT IN THIS COMBO: its sandbox experiments still import the deleted component model, so it stays at v0.12.0 and is KNOWN-INCOMPATIBLE with scqo v0.13.0 — do not install it into a v0.13.0 env until it is re-pointed (nothing depends on it; the catalog simply loses the contrib group, which _discover() already tolerates). STORE CARRY-OVER: not performed. Each context's pre-cutover stores were archived aside as *.v2.bak on first contact (the fresh-start policy) and the handful of measured facts are being re-measured rather than translated; the archived files remain on disk."

