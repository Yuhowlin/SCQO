notes = "REQUIRED: scqat MUST be at v0.12.0. Three new SCQO experiments lazy-import scqat estimators that DID NOT EXIST before this tag (qubit_cryoscope -> scqat.estimators.cryoscope + tools.step_response_fit; qubit_xyz_delay -> scqat.estimators.xyz_delay + tools.fit_triangle; pair_swap_chevron/pair_swap_flux_map -> scqat.estimators.pair_swap_{chevron,flux_map}), so an under-version scqat fails the run LOUDLY with ImportError, not a silent NaN. Re-run `uv pip install -e . --no-deps` in all three venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout; these uv-managed venvs have NEITHER pip NOR uv inside them, so drive it from outside: `uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps`. NEW EXPERIMENT — qubit_cryoscope (QM-ONLY), the flux-line step-response calibration. A Ramsey phase-tomography sequence (x90 - swept flux-pulse DURATION - fixed idle - swept closing-pulse FRAME - x90) reconstructs the flux line's transient: lock-in phase per duration -> savgol derivative -> detuning -> sqrt arch -> tail-normalize -> multi-exponential fit -> predistortion taps (amp, tau). update() proposes the flux channel's paired FACTS distortion_amp (dimensionless = amp/a_dc) + distortion_tau_s (seconds), REPLACE semantics -- new catalog FieldSpecs on the flux channel kind (fact, non-portable, paired). Facts go to physical.json and are NEVER pushed: LOADING the taps into the instrument output filter (OPX exponential_filter) is a MANUAL vendor step, not automated. Single-target only; needs a calibrated x90; the duration axis must be every ns 1..max. On Qblox the base probe() raises NotImplementedError (no cryoscope probe yet). NEW EXPERIMENT — qubit_xyz_delay (QM-ONLY probe today), the XY<->Z line-delay calibration. Slides a fixed X180 and a same-length Z (flux) pulse past each other at 1 ns resolution over two preps (|e>/|g>) and fits the |e>-|g> contrast to the TRIANGLE overlap of the two pulses; the peak is the flux line's output delay vs the drive line, written to the NEW flux-channel knob flux_delay_s so simultaneous XY+Z gates coincide. Realized on QM PORT-LEVEL (q.z.opx_output.delay, integer ns, negatives REFUSED) and ABSOLUTE (old + fitted, unlike the vendored 16a node's +=). On Qblox flux_delay_s is UNREALIZED: the home exists (hardware_options.latency_corrections) but no Qblox probe writes it, so the knob is unsettable and invisible in pull mode until a Qblox XY-Z probe lands. Additive knob -> every driver must bind-or-decline it (the Qblox fieldmap drift alarm enforces this). Needs a calibrated x180 (its length sets the triangle width) and half_scan_ns > pi length. PARITY CHANGE, AND IT FLIPS A DEFAULT -- qubit_parity_switch gains psd_model: 'constrained' (NEW DEFAULT) vs 'independent'. Both fit the same Welch PSD Lorentzian+floor; 'constrained' is the reference RTS model F^2*4G/((2G)^2+(2pi f)^2)+(1-F^2)*dt with a SINGLE shared mapping fidelity F and dt FIXED to the shot period (a 2-param {F,G} fit) -- F comes out directly. 'independent' is the previous free-floor fit that reads F twice (plateau + floor) with their ratio as the model-consistency diagnostic. BECAUSE THE DEFAULT FLIPPED, a default run now reports ONE mapping_fidelity with mapping_fidelity_floor/ratio = NaN (that pair is now 'independent'-only); the constrained fit's quality is the NEW psd_fit_residual float instead. psd_model is a STRING so it lives in the scqat metadata + run parameters, not the float-only Result.fit. Figure keys unchanged; NO re-measurement needed -- re-analysing a v0.22.0 run under either model reproduces its rate (constrained runs ~0.83x the independent on the two chipA references, both healthy). NEW ANALYSIS — pair_swap_chevron and pair_swap_flux_map, previously record-only with no artifacts, now draw scqat joint-state-population maps (P00/P01/P10/P11 reconstructed from the probe's lossless role-marginal encoding) as figure+plotdata+metadata per pair. Still RECORD-ONLY for the device: the SUCCESS verdict stays in the experiment, the estimator proposes nothing. Additive: no device action, no data action. Run folders are immutable throughout -- no re-measurement anywhere in this release."

