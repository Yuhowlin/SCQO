scqat = "v0.3.0"                 # NEW: coherence-flux estimators' coord/keys flux_amp -> flux_bias (THE COMBO MUST PIN IT)
notes = "Experiment capabilities become CODE, and catalog tags are DERIVED from them. New scqo/experiments/_capabilities/: one module per capability owning the canonical Parameters mixin + contract fragment + simulate/estimate helpers — state_readout.py (StateReadoutParameters carries THE one use_state_discrimination field text; STATE_ALT; state_row/readout_vars/signal_rename) and flux.py (FluxSweepParameters min_flux_v/max_flux_v/num_flux_points with +-0.5 V rails; the canonical probe axis FLUX_AXIS='flux_bias_v'; FluxComponentParameters + the foreign_flux_source record-only guard). catalog() entries gain 'tags' derived from Parameters-mixin subclassing (state_readout: relaxation/echo/ramsey/power_rabi/sqrb/relaxation_flux/echo_flux; flux: resonator_spectroscopy_flux/qubit_spectroscopy_flux_pulse/relaxation_flux/echo_flux; ZERO tags is legitimate — a new experiment may not be classifiable yet, and no test may demand tag completeness); the CLI menu and --help epilog render them; declared-string tags do not exist, so a tag cannot lie or rot (tests/test_capabilities.py locks the census, the canonical field texts, and the FLUX_AXIS contract). REAL WIRING: qubit_sqrb + qubit_relaxation_flux + qubit_echo_flux now support state discrimination end-to-end (simulate state branch, state->signal, contract accepts state — the flux pair's old contracts REJECTED a state dataset; the QM flux shells now pass the flag through to probes that already implemented the state path); qubit_pi_pulse_error DROPS use_state_discrimination (its QM shell hardcodes False, matching the DRAG pair — the field was a dead promise). RENAME (no alias, the standing rule): qubit_relaxation_flux/qubit_echo_flux parameters min_flux_amp_in_v/max_flux_amp_in_v -> min_flux_v/max_flux_v and sweep axis flux_amp -> flux_bias_v; scqat's coherence-flux estimators (bumped to v0.3.0, THE COMBO MUST PIN IT) consume coord flux_bias and return results key flux_bias; new runs of the pair record fit key flux_bias_v (old run folders immutable, keep flux_amp, no reindex — index stays v7). UPGRADE REQUIRES: git fetch --tags && git checkout v0.12.0 in the four scqo-versioned repos AND scqat at v0.3.0, then re-run `uv pip install -e . --no-deps` in each editable env; RENAME user parameters.toml keys under [qubit_relaxation_flux]/[qubit_echo_flux] (min_flux_amp_in_v -> min_flux_v, max_flux_amp_in_v -> max_flux_v) and DELETE any use_state_discrimination key under [qubit_pi_pulse_error] — stale keys fail loudly (extra='forbid'). BEHAVIOR: the coherence pair's flux window is now rail-bounded to +-0.5 V (was unbounded); carrier field-description texts unify on the canonical mixin texts; catalog entries gain the additive 'tags' key. DATA CAVEAT: none — additive schema, no reindex."

[v0-11-2]
date = 2026-07-24
scqo = "v0.11.2"                 # stored-position consumption + governed readout discriminator; qubit_spectroscopy_flux -> _pulse
lchqbdriver = "v0.11.2"          # flux wrapper rename + readout discriminator fields declared Unrealized
lchqmdriver = "v0.11.2"          # QM discriminator realizers (governed) + stage-3 wrapper threading + flux wrapper rename
scqo-contrib = "v0.11.2"         # no-change re-tag
scqat = "v0.2.1"                 # NEW: stored-position consumption, flux ref_scope, mean-shift discrimination centre
notes = "The readout state->IQ map becomes a first-class, governed calibration. STAGE-3: use_state_discrimination on qubit_power_rabi/ramsey/echo/relaxation returns the FPGA-discriminated averaged state instead of I/Q (DatasetContract.alt_variables accepts (I,Q) OR state; the estimator consumes the pre-reduced signal path, reduction_method='signal', no iq_plane). single_shot_readout measures the |g>/|e> blobs, always plots them AS MEASURED (it never mutates the readout frame mid-run), stores the measured centres as the readout_pos_* reference, and PROPOSES the readout discriminator as GOVERNED suggestions on three NEW pushed, non-portable ReadableTransmon fields readout_rotation_rad / readout_threshold / readout_rus_threshold (QM realizes them on the readout op's integration_weights_angle [absolute rad] / threshold / rus_exit_threshold; Qblox declares them Unrealized -- acq_rotation/acq_threshold exist but no Qblox single_shot yet, and Qblox has no RUS). This REPLACES both the qualibrate 07_iq_blobs node AND the short-lived out-of-band calibrate_discriminator flag (REMOVED): the phase/threshold are now reviewed with scqo accept and confirmed by re-running, like drive_freq/pi_amp. The discrimination CENTRE is now the density PEAK: scqat's discriminate.py refines the coarse-histogram-argmax seed onto each blob's mode by nearest-centre-confined mean-shift (was frozen vary=False at the ~sigma/3 bin, sitting a fraction of sigma off the peak on low-separation/skewed readout; validated on real 0.88-fidelity 5Q4C data, fidelity 0.876->0.891). CONSUMPTION: the stored readout_pos_* now feed the IQ->1-D reductions -- scqat (bumped to v0.2.1, THE COMBO MUST PIN IT) attaches them to the acquired dataset as per-target ref_pos_* variables at acquisition time (Experiment.attach_readout_positions on qubit_spectroscopy + the coherent-drive four; persisted in dataset.nc so offline replay is faithful), and reduced_signal prefers them (priority explicit kwarg -> stored positions -> PCA): radial reads the stored ground point (ref_source='stored'), axial takes the measured g->e axis (reduction_method='positions'), and the shared iq_plane panel draws the two stored blobs + the g->e vector. RENAME: qubit_spectroscopy_flux -> qubit_spectroscopy_flux_pulse (no alias; the acquisition style becomes experiment identity, the resonator_spectroscopy_power_amp/_chain precedent) -- the name is the probe contract (flux pulsed only during the drive, readout at idle flux every slice; both QM and Qblox probes already conform), so the map is reduced against ONE global IQ reference (scqat ref_scope='global': the whole-map complex median, n_flux x more samples, the same idle-flux condition single_shot calibrates). A DC-held flux-spectroscopy variant would be a separate experiment keeping the per-slice reference. Yuhowlin's PRs #12/#16/#21 superseded-with-credit (closed). Drivers: lchqmdriver + lchqbdriver are REAL tags (QM realizers / Qblox Unrealized + both flux wrappers renamed); scqo-contrib is a no-change re-tag. UPGRADE REQUIRES: git fetch --tags && git checkout v0.11.2 in the four scqo-versioned repos AND scqat at v0.2.1, then re-run `uv pip install -e . --no-deps` in each editable env (refreshes the version scqo doctor reports and registers scqat's new reductions). RENAME user parameters.toml [qubit_spectroscopy_flux] sections to [qubit_spectroscopy_flux_pulse] (old runs stay findable under the old name); drop any calibrate_discriminator key (the parameter is gone -- a stale key fails loudly). QM: pull-mode seeds the three new discriminator fields from each readout op (chipA already carries integration_weights_angle/threshold/rus_exit_threshold from 07_iq_blobs); no config edit. No data action: index stays v7, old run folders immutable. BEHAVIOR: single_shot_readout no longer writes the vendor discriminator itself -- run it, scqo accept the readout_rotation_rad/readout_threshold suggestions, then re-run to confirm; a re-fit of the SAME coherent-drive raw data now takes its reduction axis from the stored blobs when present (deterministic g->e sign) instead of per-run PCA -- same physics, and identical when no positions are stored. DATA CAVEAT: none -- additive to the schema."

[v0-11-1]
date = 2026-07-23
scqo = "v0.11.1"                 # coherent-drive experiments reduce IQ via scqat axial (not raw I); flux-arch trust gates
lchqbdriver = "v0.11.1"          # no-change re-tag (probe-only; coherent-drive probes already emit I/Q)
lchqmdriver = "v0.11.1"          # no-change re-tag (probe-only; coherent-drive probes already emit I/Q)
scqo-contrib = "v0.11.1"         # no-change re-tag
scqat = "v0.2.0"                 # NEW: IQ->1D radial/axial reduction + flux-arch seed/gates + shared iq_plane panel
notes = "IQ->1-D signal reduction becomes a shared scqat concern and the coherent-drive experiments stop discarding a quadrature. scqat (bumped to v0.2.0, THE COMBO MUST PIN IT -- the experiments' estimate() now calls scqat.tools.iq_reduce, absent in the v0.1.8 tag) gains two geometry-matched reductions: radial |IQ-ref| (the spectroscopy family; ref = off-resonance/ground median, per-slice for flux maps) and axial, the signed projection onto the |0>-|1> axis (the coherent-drive family; axis resolved angle->positions->PCA). The four coherent-drive experiments (qubit_power_rabi/qubit_ramsey/qubit_echo/qubit_relaxation) now hand complex I/Q to the estimator -- reduced via axial, PCA at bring-up -- instead of rename({'I':'signal'}) (raw I lost contrast as cos(readout_rotation), near-zero when the state separation sits in Q); estimate() renames only the sweep axis, and simulate() emits faithful IQ (population placed at a random readout rotation with noise in both quadratures, so the offline sims exercise the reduction instead of hiding it). The estimators still accept a pre-reduced real 'signal' unchanged (the FPGA-discriminated 'state' path). scqat's qubit_spectroscopy_flux / qubit_flux_arch additionally gain a wrong-basin GUARD: the transmon-arch fit seeds its flux period from the arch-top curvature (top-only bring-up windows have period >> the swept span, where the old period=span seed converged to a spurious basin) and GATES success on the arch top being observed inside the swept frequency window (+15% margin) and the curve tracking the branch points (rms residual <= span/4); the flux figures now draw the per-slice REDUCED map (a weak line is invisible under the raw |IQ| ground offset + chain ripple). All seven IQ-reducing estimators emit a shared 'iq_plane' figure (the raw IQ cloud + the reference actually used: radial point / per-slice trajectory / axial axis, titled with the reduction kind), and stamp reduction_method / reduction_angle (+ ref_source) into metadata. Drivers unchanged: every coherent-drive experiment on LCHQM/LCHQB is probe-only and already saves buffered/averaged I/Q (use_state_discrimination False), and simulate() is inherited from scqo, so lchqbdriver/lchqmdriver/scqo-contrib get no-change re-tags at v0.11.1 (an estimation-only combo, the v0.10.2 pattern). UPGRADE REQUIRES: git fetch --tags && git checkout v0.11.1 in the four scqo-versioned repos AND scqat at v0.2.0, then re-run `uv pip install -e . --no-deps` in each editable env (refreshes the version scqo doctor reports -- the frozen .dist-info is not updated by git pull -- and registers scqat.tools.iq_reduce). No config or data action: no schema change and no reindex (index stays v7); old run folders are immutable and stay findable. BEHAVIOR: additive to the schema, but a re-fit of the SAME raw data shifts results two ways. (1) Coherent-drive: the fit now uses the full IQ (axial/PCA) rather than raw I -- it recovers contrast where the readout is not aligned to I (validated on real QM 5Q4C data: up to 2.16x on power_rabi) and is unchanged where it already was; the extracted pi_amp / T1 / T2* / T2echo / detuning are the same physics at higher SNR. (2) qubit_spectroscopy_flux now GATES the arch fit: a fit whose top was never observed in the swept window (or that misses the branch points) is reported FAILED (outcome FAILED, no writeback) instead of a spurious 'success', so an in-window arch that previously read a wildly-off f01_max/Ej_sum now either fits correctly or fails honestly. DATA CAVEAT: pre-v0.11.1 qubit_spectroscopy_flux runs may carry a spurious arch fit (e.g. run 20260723-134245 read f01_max 6.27 GHz / Ej_sum 26.2 GHz for an in-window ~5.14 GHz arch); re-run them, or reject their persisted ej_sum_hz / f_q_max_hz / v_offset_v / v_per_phi0_v, under v0.11.1. PREREQUISITE: v0.11.0 (the drive_power_dbm combo entered below but not yet tagged) must be cut first -- bump SCQO pyproject 0.10.2->0.11.0 and tag the four repos v0.11.0 -- so the tag history and scqo --version stay consistent before v0.11.1 is cut on top."

[v0-11-0]
date = 2026-07-22
scqo = "v0.11.0"                 # drive_amp/drive_power_dbm pushed field pair; qubit_spectroscopy set->revert run()
lchqbdriver = "v0.11.0"          # LCHTransmonElement spec_amp slot; drive output_att solve; probe reads view.drive_amp
lchqmdriver = "v0.11.0"          # drive chain solve on xy full-scale grid + saturation op; probe plays amplitude_scale=1
scqo-contrib = "v0.11.0"         # no-change re-tag
scqat = "v0.1.8"                 # unchanged pin (the qubit_spectroscopy estimator consumes no amplitude/power)
notes = "Absolute drive power. qubit_spectroscopy's drive_amp Parameter (backend units: amplitude factor on QM, voltage offset on Qblox -- the same value delivered ~-21 dBm on QM chipA but ~-33 dBm on Qblox chipA) is REMOVED and replaced by drive_power_dbm (absolute dBm at the instrument drive port; default -25.0, cap +10; stale [qubit_spectroscopy] parameters.toml keys fail loudly -- values are now dBm, not a fraction). Two NEW pushed ReadableTransmon fields mirror the readout pair exactly: drive_amp (the saturation/spec drive amplitude, portable=False chain residual) declared BEFORE drive_power_dbm (portable absolute power, wins on push; coupled drive_amp echo recorded). Setters solve the DRIVE chain keeping the amplitude <= 0.5 full scale: QM picks q.xy full_scale_power_dbm on the -11..+16 dBm 3 dB grid with the saturation op amplitude as the exact residual (power_tools, operation-generic); Qblox picks the largest EVEN drive-port output_att in 0..60 with the residual on the NEW element.spec.spec_amp slot (nominal +5 dBm full scale, +/- a few dB honesty as for readout). qubit_spectroscopy.run() now does the punchout discipline: recorded boundary write of drive_power_dbm -> acquire -> exact revert in finally (2 ChangeRecords + coupled echoes per qubit); it REFUSES when a target's drive_power_dbm is unknown (unconfigured drive chain / unset saturation amplitude). The QM probe plays the saturation op at amplitude_scale=1.0; the Qblox probe plays each qubit's OWN view.drive_amp as the CW VoltageOffset (per-qubit, previously one global value). power_context gains drive-chain provenance keys (drive_full_scale_power_dbm/saturation_amp on QM; drive_output_att_db/spec_amp on Qblox; drive_power_dbm + drive LO on both). SHARED-CHAIN CAVEAT (documented in the catalog + fieldmaps): the drive chain scale is shared by every xy operation, so while it is off its standing value the stored pi_amp means a different power -- harmless in qubit_spectroscopy (no pi pulse played; the discrete chain knob + verbatim amplitude restore make the revert lossless), but scqo set QUBIT.drive_power_dbm=... IS a real re-scale of what pi_amp delivers. Both drive-chain vendor knobs flip kind vendor->realizer in the fieldmaps. UPGRADE REQUIRES (Qblox): flip each dut_config.json element_type BasicTransmonElement->LCHTransmonElement and add a 'spec': {'spec_amp': <value>} block (chipA cd1 updated in-tree with spec_amp 0.1 = the exact old default drive); a config missing the spec block still LOADS (spec_amp deserializes NaN = field unknown) but qubit_spectroscopy refuses until it is seeded (config edit or scqo set q1.drive_power_dbm=...). FluxTunableTransmonElement now subclasses LCHTransmonElement, so flux duts inherit the slot with NO edit. UPGRADE REQUIRES (QM): every qubit needs a 'saturation' xy operation (chipA has one; amp 0.2 at fs +13 = standing ~-1 dBm) -- pull-mode seeds the new fields from it, no config edit. No reinstall: no entry-point changes, git pull suffices on editables. BEHAVIOR: qubit_spectroscopy_flux now takes its OWN per-run drive_power_dbm (default -25 dBm, same recorded set->revert boundary as qubit_spectroscopy, via the shared scqo/experiments/_drive_power.py context manager): QM needed no probe change (its flux probe already played operation_amp=1.0 = the parked saturation amplitude), while the Qblox flux probe was SWITCHED from the calibrated X (pi) pulse to a weak CW saturation VoltageOffset (view.drive_amp / the spec_amp residual, cal07b pattern) -- so drive_power_dbm governs the flux map identically on both backends, and the Qblox flux map no longer needs a calibrated pi (works during bring-up). Old run folders and the index (schema v7) are unchanged; saved user parameter files carrying drive_amp are invalid (rename to drive_power_dbm, in dBm)."

[v0-10-2]
date = 2026-07-21
scqo = "v0.10.2"                 # resonator_spectroscopy gains analysis_method (lorentzian|circle) + baseline_order
lchqbdriver = "v0.10.2"          # no-change re-tag (probe-only; inherits the estimator switch)
lchqmdriver = "v0.10.2"          # no-change re-tag (probe-only; inherits the estimator switch)
scqo-contrib = "v0.10.2"         # no-change re-tag
scqat = "v0.1.8"                 # NEW: multi-method resonator estimator (joint-bg lorentzian + Probst circle)
notes = "Resonator spectroscopy analysis becomes multi-method. resonator_spectroscopy gains two Parameters: analysis_method ('lorentzian' default | 'circle') and baseline_order (0/1/2, lorentzian only). 'lorentzian' is a joint Lorentzian + polynomial-background fit of the power |IQ|^2 that REPLACES the old quantile subtract-then-fit baseline (no legacy path) -- it removes the f_res/kappa bias the value-based quiet-quantile mask produced on sloped/curved backgrounds (a horizontal band of points collapsed the order-1 baseline to nearly flat). 'circle' is a native Probst notch-model fit of the complex S21 (power-Lorentzian-seeded, multi-start over cable-delay candidates + full-model complex least-squares, delay fixed per candidate to avoid the delay/alpha/phi0 degeneracy; phase-less data gated out by a circularity test) that also yields Qi/Qc/phi0/delay; validated on real QM 5Q4C data against the vendored NCU resonator_tools (Qi within 4%, delay within 0.1 ns). The estimator + both fitters live in scqat, bumped to v0.1.8 (the combo MUST pin it -- SCQO.estimate() forwards method=/baseline_order= into scqat.estimators.resonator_spectroscopy, and the circle method + fit_notch_circle/fit_lorentzian_bg do not exist in the older v0.1.7 tag). Drivers unchanged: LCHQB/LCHQM resonator_spectroscopy is probe-only and inherits the switch, so lchqbdriver/lchqmdriver/scqo-contrib get no-change re-tags at v0.10.2 (analysis-only combo). UPGRADE REQUIRES: git fetch --tags && git checkout v0.10.2 (scqo) and scqat at v0.1.8, then re-run `uv pip install -e . --no-deps` in each editable env (refreshes the version scqo doctor reports and registers the new estimator methods). No data action: old run folders and the index (schema v7) are unchanged. BEHAVIOR: additive and non-breaking to the schema; the DEFAULT method stays 'lorentzian' so existing calls keep working, but because the baseline algorithm changed a re-fit of the SAME raw data can shift f_r/kappa slightly (more accurate on sloped backgrounds). 'circle' needs genuine phase and FAILS GRACEFULLY (outcome FAILED, no writeback) on the simulated backend whose Q quadrature is noise; on real hardware it returns f_r/kappa plus Qi/Qc. Circle's extra quality factors appear in the run result but are not yet proposed to Resonator physical fields (follow-up). RE-TAG PROVENANCE: the three driver v0.10.2 tags are no-change re-tags on the exact v0.10.1 commits (verified identical); mid-retag one command ran without an explicit cd and hit an already-tagged repo, failing harmlessly at git tag before any push -- scqo-contrib was then retagged correctly and all four scqo-versioned repos verified at v0.10.2 on origin."

