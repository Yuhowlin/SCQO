notes = "PARAMETER CHANGE: qubit_parity_switch now takes record_time_s (default 30 s), not num_shots. What limits the measurement is the parity spectrum's LOWEST FREQUENCY BIN, 8 / record_time_s, so a rate whose corner (rate / pi) sits near it is fitted from only a handful of points. The first real chipA run (20260801-191415-048) made this concrete: 30.379 s of record put the low edge at 0.2633 Hz against a corner at 0.7488 Hz — only 2.84x of headroom, with barely three bins on the plateau. The shot count is DERIVED using the target's estimated shot period (idle + readout + depletion + the two pi/2 pulses). NOTE THE DIVISOR IS THE SHOT PERIOD, NOT THE IDLE: that run has a 9.04 us idle inside a 30.379 us shot, so dividing by 1/(2 x parity_delta_f_hz) would under-record by 3.4x. num_shots SURVIVES as an explicit override and BYPASSES max_num_shots (default 2e6, under the Qblox 3e6 acquisition-bin limit so the neutral refusal fires first) — exactly as idle_time_ns bypasses max_derived_idle_ns; the ceiling guards the derived value only. Old scripts passing num_shots explicitly keep working unchanged. With several targets the count is the MAX over them, so every target records at LEAST record_time_s. The achieved record_time_s (from the period the probe really scheduled) is recorded beside the request, since the count came from an estimate. GATE CHANGE, AND IT CAN FLIP A RUN'S OUTCOME: MAX_ODD_FRACTION on p_switch is REPLACED by MIN_PSD_CONTRAST = 3.0 on the plateau-to-floor ratio A/B. p_switch was the wrong quantity — any shot-to-shot noise drives it toward 0.5 whether or not a knee exists, and that chipA run reported p_switch = 0.294 against the old 0.40 ceiling despite a textbook fit (A/B = 7826), i.e. within 1.4x of refusing a good measurement. Contrast separates by eight orders of magnitude: ~1e-9 on uncorrelated data against 7e2-8e6 on real telegraphs, including one buried under 30% spurious flips. A run previously refused for p_switch > 0.4 may now legitimately PASS; p_switch is still reported but no longer decides. NEW DIAGNOSTICS on the run record: psd_freq_min_hz (the low edge — what your record length bought), psd_contrast, corner_margin_low (= corner / low edge). corner_margin_low is REPORTED, NEVER GATED — a thin margin means a longer record would tighten the fit, which is your decision, and refusing would throw away a usable measurement. The PSD figure draws the low edge and says so. NO RE-MEASUREMENT NEEDED for v0.20.0 data: re-analysing that chipA run through v0.21.0 reproduces 2.3525 Hz and corner 0.748823 Hz exactly, and now passes on contrast. Re-run `uv pip install -e . --no-deps` in all three venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout; these uv-managed venvs have NEITHER pip NOR uv inside them, so drive it from outside: `uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps`."

