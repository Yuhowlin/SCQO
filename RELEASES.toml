scqo = "v0.13.1"                 # version-string fix; code identical to v0.13.0
lchqbdriver = "v0.13.0"          # unchanged (drivers version by tag, pyproject stays 0.1.0)
lchqmdriver = "v0.13.0"          # unchanged
