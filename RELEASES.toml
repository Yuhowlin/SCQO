er cycle M1 - depletion - x90 - idle - y90 - M2 - pad at a fixed cycle_period_ns; parity = m1 XOR m2 WITHIN each cycle, so M1's re-projection makes slow sampling T1-safe (two acquisition bins per cycle on Qblox; max_num_shots default 1.4e6; p_intercycle_flip is the QND-chain health check). Discrete has NO idle_multiple (continuous keeps it) — extend the period via cycle_period_ns only. Pipeline hardware-proven on chipA/Qblox 2026-08-08; PHYSICS VALIDATION STILL PENDING on both backends (chipA currently sick). BEHAVIOR CHANGE — resonator_spectroscopy depletion_factor default 5 -> 10 (tau_d ~ 10/kappa): the PROPOSED readout_depletion_s doubles on the next accepted run; standing knobs untouched until then. UPGRADE REQUIRES (Qblox) — EVERY Qblox dut_config's persisted acq_rotation is the MIRROR of the calibrated angle: the view now NEGATES readout_rotation_rad at the vendor boundary (Qblox acq_rotation is OPPOSITE-HANDED to QM's integration-weights angle; the old push mirrored the frame — chipA 2026-08-08 discriminated runs classified every shot |g>). Re-run single_shot_readout + accept (or `scqo set <q>_ro.readout_rotation_rad=<current value>` to re-push through the fixed boundary) on every Qblox device config BEFORE any use_state_discrimination or active-reset run; chipA re-validation pending (chip sick). NEW EXPERIMENTS — qubit_t1_ade + qubit_t1_bayesian, T1-vs-LAB-TIME tracking (record-only — qubit_relaxation stays the t1_s authority; QM-only probes; both join the QM active-reset carrier census 4 -> 6): ADE = 3-delay Analytical Decay Estimation with on-FPGA closed form + analytic sigma (arXiv:2602.11912, SPAM cancels, host bootstrap cross-check); Bayesian = per-shot adaptive Bayes (arXiv:2506.09576, u = 1/k so k grows past fixed-point range, tau = c*T1_est, interleaved classical-decay validation; needs discriminator + confusion matrix). BOTH HARDWARE-VALIDATED on 5Q4C q1 2026-08-08 (ADE t1 = 29.95 us; Bayes 33.25 us with adaptive k reaching 17.5 and classical validation 28.2 us — all against qubit_relaxation's 30.4 us). NEW (cryoscope fitting trio, additive): fit_tau_seeds on BOTH cryoscopes — explicit prior-knowledge tau seeds in seconds from the CLI (--set fit_tau_seeds=[1e-7,2.3e-9]); the seeded joint fit RACES the automatic path and the better residual wins (metadata seed_method='seeded'); axis-agnostic, so it is the first seeding mechanism available on the spectroscopy cryoscope's log wait grid. Hankel-SVD Matrix Pencil seeding for the ramsey cryoscope — RamseyCryoscopeEstimator runs BOTH the MPM-seeded and fractions fits and keeps the better residual (provenance seed_method/mpm_n_modes/mpm_oscillatory — the oscillatory flag is the consider-FIR signal); BENIGN BEHAVIOR CHANGE: default ramsey fits may now resolve components the old sequential fit merged; also fixes a hankel.py crash (growing noise-pole overflow) affecting any hankel_decompose consumer. fit_step_response degeneracy guard — bounded amplitudes (amp_max=2.0), identifiability tau floor (>= half the first sample time), cancelling close-tau pair collapse: three real degenerate fits (+-22866, +-22, +-77.8 amplitude pairs) become honest single taps or clean failures; healthy fits are bit-identical; both cryoscope estimators inherit via defaults. NEW TOOLING (QM) — python -m customized.scqo.apply_distortion --target qN [--run <run_id>] [--extend] [--clear] [--dry-run]: one-command cryoscope-tap apply into the OPX z-output exponential filter (offline device/setup resolve, taps from a named run's fit or the accepted facts, --clear = fresh-line reset); hardware-validated 2026-08-06 (full clear -> measure -> apply -> verify loop, ns window flat to noise). Facts stay record-only — applying remains explicit/opt-in. PROCESS — the 0.x version rule is codified in RELEASING.md (bump = max fragment severity: breaking/additive -> y+1, all-fix -> z+1; full SemVer at a deliberate v1.0.0) and the fragment kind vocabulary gains 'fix'. Re-run `uv pip install -e . --no-deps` in all three venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout; these uv-managed venvs have NEITHER pip NOR uv inside them, so drive it from outside: `uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps`."

