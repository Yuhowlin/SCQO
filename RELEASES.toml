— pinned on the COMPILED acquisition mapping, 5x2xnum_shots bins vs 5x2). shot_idx moves out of Contract.sweeps into readout_dims with the averaged form as the alt set. With nothing fitted there is NO fidelity: the optimum is the largest blob SEPARATION, best_fidelity lands NaN, and a new best_separation fit key carries the metric actually optimized (recorded in BOTH modes). The scqat method is DERIVED from readout_mode (_capabilities.discrimination_method), so 'averaged data + mixture fit' stays unrepresentable. The DEFAULT STAYS 'shot' and that path is unchanged. CAVEAT: readout_power in average mode maximizes separation, which keeps growing past the onset of measurement-induced transitions — the outlier check that catches those is GMM-only — so use average mode as the fast coarse scan and calibrate the amplitude in shot mode; readout_frequency has no such asymmetry (separation peaks at the optimal detuning). REQUIRES scqat >= v0.18.0 for these two experiments: estimate() passes method= to the readout_fidelity estimator and an older scqat refuses it BY NAME (loud ValueError at estimate; every other experiment is unaffected). BEHAVIOR CHANGE (figures, scqat) — the readout-sweep figure set loses `std`, `mean_distance`, `mean_I` and `mean_Q` and gains ONE merged `separation` figure: the centre separation and the GMM std are the same IQ quantity, so they now share one axes with the y axis anchored at 0 (`snr` and `outlier` also start at 0; `fidelity` and `norm_res` deliberately do not). Average mode draws separation + means_on_IQ only. Run folders are immutable and keep the PNGs they were written with, but an OLD *_plotdata.nc NO LONGER REPLOTS (it carries no `separation` variable) — re-analyse from dataset.nc instead, and any script naming the old PNGs must switch to <estimator>_separation.png. scqat 93fad3d (the mean_I/mean_Q removal) had NO ledger fragment — recorded here at release time. OFFLINE-VALIDATED ONLY: full suites green at the cut (scqo 784, scqat 596, sc