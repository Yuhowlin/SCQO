notes = "RETRACTION: EVERY parity_rate_hz FROM v0.19.0 IS INVALID. qubit_parity_switch fitted its Lorentzian to the wrong time series. The sequence is a unitary, so it maps antipodal Bloch vectors to antipodal ones and |0> and |1> can NEVER give the same outcome; with no qubit reset and a QND readout each shot starts where the last was projected, so s[i] = s[i-1] XOR parity[i]. The readout is the RUNNING XOR of the parity, and the CONSECUTIVE-PAIR DIFFERENCE is the parity telegraph. v0.19.0 fitted the readout, i.e. an integrated telegraph, and its rates mean nothing. Verified: fitting the pair series recovers 50.53 Hz against a 50 Hz truth while fitting the readout fails outright. ACTION: DELETE any parity_rate_hz accepted into physical.json from a v0.19.0 run — do not merely re-check it. THE RAW DATA IS FINE: only the analysis was wrong, so re-analysing an existing run folder is enough and no re-measurement is needed. ROOT CAUSE, now corrected in SCQO and both drivers: the design docs claimed 'the sequence re-prepares the equator each shot regardless of the starting pole'. It re-prepares at the OPPOSITE point. The absence of a qubit reset is consequently REQUIRED and not an optimization — a reset would sever the XOR chain that carries the parity. RENAMES (contract change, hence the minor bump): scqat's p_excited -> p_high and p_odd -> p_switch; scqo's fit dict now carries p_switch, p_parity_odd and n_parity_switches. NOTE p_parity_odd ~ 0.5 is HEALTHY — it only says the chip sits in each parity about half the time — while p_switch is the parity's own switching fraction and the quantity MAX_ODD_FRACTION = 0.40 guards. Under v0.19.1 (prepared, never published) that guard read the wrong series and would have rejected every healthy run. READOUT FIDELITY NOW MATTERS SHARPLY: one bad shot corrupts TWO adjacent parity samples, so the corruption is lag-1 correlated rather than white and the rate inflates as 1 + 2 x eps / (rate x shot_period) — measured 1.4x at eps = 0.1% and 6.6x at 0.6%. Aim for eps < 0.1 x rate x shot_period, and note that sampling SLOWER suppresses the bias (the opposite of the usual instinct) as long as p_switch stays under 0.4. PLOTS: four panels now — `trace` (raw readout, the running XOR), `parity` (the measured telegraph, and the series that is fitted), `psd` (the parity spectrum WITH the Lorentzian fit) and `state_psd` (the raw readout spectrum, deliberately UNFITTED and diagnostic-only). Both time-domain panels are scatter, since at 1e6 shots a connected step plot fills solid. Re-run `uv pip install -e . --no-deps` in all three venvs (.venv-qm, .venv-qblox, .venv-view) plus the scqat checkout; these uv-managed venvs have NEITHER pip NOR uv inside them, so drive it from outside: `uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps`."

