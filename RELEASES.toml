notes = "MINOR COMBO - two features (1 breaking-kind / 1 additive) plus one unfragmented CI repair. CLASSIFICATION NOTE, and this cut is where the rule got written down properly: the parametric-drive fragment is filed kind = 'breaking' and is cut as a MINOR. RELEASING.md previously mapped kind 'breaking' straight onto x+1 and listed 'renamed registered experiment names or Parameters fields' under it, which would have made this a v4.0.0. The standing policy is narrower - the MAJOR digit is reserved for breakage of STORED DATA (run-folder/dataset layout, state-file or history-DB schema, the datastore index contract) or of the SERVER STRUCTURE (config.toml/user.toml/cooldowns.toml shape, the install/deployment layout); the test is whether upgrading costs a DATA or MACHINE migration rather than a file edit. Both previous majors pass that test (v2.0.0 = change history onto per-context history.sqlite, v3.0.0 = f_r0_hz/f_r_hz renamed inside every physical.json and design.toml) and neither was earned by an experiment rename. RELEASING.md's version rule and RELEASES.d/README.md are rewritten in this cut to separate the fragment KIND (which drives the notes and the coupling floors) from the DIGIT. A 'breaking' fragment still ALWAYS obliges the upgrade action below, whatever the digit. UPGRADE REQUIRES, in order: (1) THE EXPERIMENT RENAME - qubit_parametric_drive is now qubit_parametric_drive_amp. Update saved parameter files, campaign plans and any scqo run scripts naming it; no alias ships (house rule). Old run folders keep the old experiment name and stay findable under it. (2) SIX PARAMETERS FIELD RENAMES to start_/end_ edges. qubit_parametric_drive_amp: min/max_parametric_amp_v -> start/end_parametric_amp_v and min/max_parametric_freq_hz -> start/end_parametric_freq_hz. qubit_parametric_drive_time: min/max_parametric_freq_hz -> start/end_parametric_freq_hz and min/max_drive_time_ns -> start/end_drive_time_ns. A stale key is the DANGEROUS shape, exactly as in v3.0.0: the catalog overlay skips it SILENTLY, so --help looks healthy and only the run dies. The operator parameters.toml on the dev machine is already migrated - it was carrying all six under the already-renamed tables, so both experiments were broken there at the time of the cut. Any OTHER parameters.toml must be migrated by hand. (3) scqat PIN v0.21.0 IS A HARD FLOOR AND A SILENT ONE - the only silent floor in the stack right now. qubit_parametric_drive_time is the first orchestrated consumer of the parametric_drive_decoherence estimator, and v0.21.0 is where that estimator gained per-figure isolation (render_figures). Below it it returns a plain dict of pre-built figures, so a crash in the pure-fit decoherence_params panel takes SCQO's WHOLE artifact set down: the run keeps its data and loses every PNG, including the raw-carrying rho11_fits. NOTHING RAISES - the figures are simply absent. (4) EDITABLE REINSTALLS - all four pyproject versions bumped and .dist-info freezes at INSTALL time, so a git checkout alone leaves every venv still reporting 3.2.0: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps per venv (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. Verify with importlib.metadata.version, NEVER by checking that the import works. WHAT SHIPS: THE PARAMETRIC-DRIVE SPLIT (scqo + scqo-qm + scqat). The family is now two shells and THE SUFFIX NAMES THE SECOND AXIS: qubit_parametric_drive_amp is frequency x volts, the resonance FINDER; qubit_parametric_drive_time is frequency x duration, the CHEVRON that follows it. The _time shell is NEW, QM-only and record-only - it fixes parametric_amp_v and sweeps frequency x drive_time_ns, so each frequency row is an oscillating rho_11(t), and scqat's existing parametric_drive_decoherence estimator reports gamma, lambda, Delta and the EP metric 8*lambda^2/gamma^2 per drive frequency. Its default frequency window is deliberately a narrow ZOOM (180-220 MHz) and not a band scan: the frequency and time windows are physically COUPLED, and a window too wide for its time window yields a chevron narrower than one frequency step. Run it with use_state_discrimination ON - on raw I/Q the fit still runs and reports unphysical rates. The six renamed edges may now be given in EITHER ORDER: the pair defines a window, not a traversal direction, and the emitted axis is always ascending. Only a zero-width window is refused, and that refusal now fires at Parameters construction (a pydantic validator) instead of inside define_sweep. Two bounds relaxed with the rename - end_parametric_amp_v is ge=0.0 (was gt=0.0) and end_drive_time_ns is ge=16.0 (was gt=16.0); those gt's only existed to force max > min, which is the validator's job now. SIX NEW QBLOX PROBES (scqo-qblox only; every shell already existed, so no scqo or scqat change) - broadband_qubit_spectroscopy, broadband_resonator_spectroscopy, qubit_deterministic_benchmarking, qubit_drag_equator, qubit_sqrb, qubit_tomography. Five of the six were QM-only until now. Contributed as scqo-qblox PR #12 (Yuhowlin), based on v3.0.0 and brought forward onto v3.2.0 with the fixes below. drag_beta is REALIZED on Qblox at element.rxy.beta (view in ns, vendor in seconds) now that qubit_drag_equator calibrates it; it is deliberately NOT the same quantity as QM's DragCosinePulse.alpha, and the catalog already marks drag_beta portable=False so each backend may define it in its own convention. pi_amp_x90 and drag_beta_x90 stay Unrealized there: rxy carries ONE beta and X90 is DERIVED from rxy.amp180, so binding them would let a pi/2 calibration overwrite the calibrated pi gate - hence qubit_deterministic_benchmarking REFUSES target_gate=x90 BY NAME on Qblox (benchmark a pi gate there, or run it on QM). Four SILENT-WRONG-DATA bugs in the contributed branch were fixed in the same merge: benchmarking swept the x180 amplitude regardless of target_gate while estimate()/update() used the x90 knob (issue #24 item 2, recurring on Qblox - it now reads amp_reference_field()); broadband tiled targets[0]'s trace across every other target; the vendor's GRID_TIME_TOLERANCE_TIME was relaxed process-wide and never restored (now a scoped context manager); and four hand-rolled acquisition timeouts used magic shot periods and ignored thermalization (issue #24 item 1, recurring inside the self-acquiring probes - now chunk_timeout_s, which counts the real reset). The compile census had also been silently skipping qubit_drag_equator and qubit_tomography while claiming full coverage; both now expose schedule builders that SELF_ACQUIRING_BUILDS compiles, with a census test that fails any probe missing from the map. CI REPAIR (scqo 3de2dd5 / scqat f45d436 / scqo-qblox ea76bd3) - NO ledger fragment was written for this one; recorded here at release time, as v2.1.0 and v2.2.0 did for theirs. The sibling checkout asked 'does the fork exist?' and 'does it have a branch matching this run's?' as two INDEPENDENT questions, so a fork without the branch still won the repo choice and fell back to the FORK's default branch instead of upstream's. PR #12 is the live case: it would have installed Yuhowlin/SCQO@main (v3.0.0) and Yuhowlin/scqat@main (v0.19.0) while upstream was v3.2.0 / v0.20.1, so a green tick there proved nothing about current main. One branch probe now answers both questions, and each run reports the sibling's resolved short SHA and commit date. scqo-qm has no .github/workflows and is correctly untouched. BEHAVIOR CHANGE x3: (1) qubit_parametric_drive_amp's best_peak_amplitude is POLARITY-NORMALIZED, not signed. scqat's fit_peaks picks the stronger polarity per slice and INVERTS a dip trace before fitting, so a well-fit resonance reports a POSITIVE amplitude whether it is a dip or a peak; a negative value signals a badly-conditioned fit, not a dip. The old Result docstring claimed the opposite and the offline test asserted it - that test passed on a 100 MHz-wide artifact fit 119 MHz away from the planted line. Nothing in the fit dict changed shape, only the claim about it, and the test now gates on linewidth. ANYONE READING THE SIGN OF best_peak_amplitude FROM STORED RUNS SHOULD STOP. (2) FIGURES, scqat parametric_drive_decoherence, so every consumer sees it: a THIRD figure rho11_map - the raw 2-D chevron, driving frequency x driving time coloured by population, pinned to a [0,1] colour scale when the data really is a population and autoscaled with a 'NOT a population' title when it is not. It is listed FIRST, being the one figure that draws whether or not any fit converged. Separately the gamma / lambda / |Delta| panels now scale to their VALUES: an abnormal fit's error bar used to set the y-limits and flatten every real point, because matplotlib counts the bar caps as data. The bars are still drawn and simply clip. Old runs replot with the new figures from their saved plotdata.nc with NO re-fit. (3) broadband_qubit_spectroscopy measures ONE target on Qblox and refuses a second BY NAME (it steps a single drive port-clock's LO); the QM half multiplexes an acquisition stream per target and is unaffected. broadband_resonator_spectroscopy legitimately reports the same feedline trace for every target on both backends. INTERNAL: window_bounds moved from scqo/experiments/_capabilities/detuning.py to a new scqo/experiments/_window.py (with the zero-width refusal extracted beside it) so a NON-detuning carrier can reach the single ordering point. scqo.experiments._capabilities no longer re-exports it - import from scqo.experiments._window. The design rationale stays in detuning.py. HARDWARE LEDGER: NOTHING in this combo has reached an instrument - it is OFFLINE-ONLY end to end, and that is the whole ledger entry for it. NEWLY OWED: both parametric-drive shells on QM (qubit_parametric_drive_amp carries forward the population run owed since v3.1.0 - its gateway preview was verified on 5Q4C q1 2026-08-20, but no acquisition run has happened; qubit_parametric_drive_time has had NO hardware contact at all, neither its real-time swept play(duration=) nor a gateway preview) and ALL SIX Qblox probes (validated only as offline tests plus scripts/check_real_config.py against chipA/cd1/qblox, PASS; nothing has reached a cluster). The DRAG equator and tomography probes in particular WRITE device state (rxy.beta) and step LOs mid-run, restoring in a finally - that restore path has never been exercised against real hardware. Qblox: neither parametric-drive shell is realized. STILL OWED, carried forward from v3.2.0 unchanged - qubit_ramsey_phasor on both backends, the Qblox cryoscopes and their applied filter, qubit_tomography interleaved noise, the broadband RESONATOR variant and cross-band switching, punchout v2 on Qblox, the coupling-coefficient live run, readout average mode on both backends, register_stark.py + qc_n_stark_amp, and the quam-builder v0.5.0 first-real-OPX1000-run watch. OFFLINE-VALIDATED at the cut: scqo 883, scqat 677, scqo-qm 359 (shared .venv-qm), scqo-qblox 319 (shared .venv-qblox). CI NOTE: tests/test_index_scale.py::test_two_sessions_write_simultaneously is a KNOWN Windows-only flake (SQLite 'database is locked') - re-run the leg, do not re-diagnose it. SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.3.0 in scqo / scqo-qm / scqo-qblox plus scqat at v0.21.0, the editable reinstalls above (REQUIRED this cut), restart the viewer, then scqo doctor from a NON-INSTALLER account over SSH. The v3.2.0 server upgrade was never performed, so this checkout carries both cuts' changes at once."

