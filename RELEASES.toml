scqat = "v0.23.0"                # UNCHANGED since v3.7.0 - nothing in this cut touches analysis
notes = "MINOR COMBO - ONE feature, scqo ONLY: no driver and no scqat commit since v3.7.0, and the scqat pin does not move. DIGIT NOTE, the same judgement as v3.2.0 and v3.6.0 and recorded again because the rule as written still does not cover this shape: RELEASING.md maps MINOR onto 'every experiment-level change' and PATCH onto 'a fix-only cut', and an ADDITIVE feature that is not an experiment is neither. It takes the minor digit; PATCH stays reserved for cuts carrying nothing but fixes. UPGRADE REQUIRES: (1) EDITABLE REINSTALLS as always - the three scqo pyproject versions bumped and .dist-info freezes at INSTALL time, so a git checkout alone leaves every venv reporting 3.7.0 while the code is live. Run per venv: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO --no-deps (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. scqat needs NO reinstall - unchanged at v0.23.0. (2) THE VIEWER EXTRA specifically, which is new this cut: python-pptx joins it (pulling lxml and XlsxWriter), so the viewer venv needs `uv pip install -e D:\\github\\SCQO[viewer]` or the two .pptx routes answer 503 - by name, with the reinstall command in the message. Everything else, including the .xlsx dashboard, works without it. Verify with importlib.metadata.version, NEVER by checking that the import works. ADDITIVE - a new viewer export, isolated in its own subpackage. Yuhowlin, SCQO PR #29, held since 2026-08-31 across three cuts pending a charter decision and landed here as maintainer commits after that decision. WHAT SHIPS. `scqo/viewer/lab_report/` builds the lab's QPU characterization report from the setup page's values plus campaign statistics: a 3-sheet xlsx dashboard and a 4-slide .pptx deck, reachable from a `lab report...` button on the setup page with options for scope (this setup, or the whole cooldown), the min-repeats quality gate, mean-vs-median, and a tag filter. Also new: `scqo.campaign_query` (exported), which resolves campaign statistics INDEPENDENTLY per (target, quantity), so q1's T1 may come from one campaign and q3's from another. THE CHARTER DECISION, and it is the reason this entry exists rather than a one line \"new export\". What the report encodes is ONE lab's reporting convention - its sheet names, its column order, its field dictionary, its Traditional-Chinese descriptions - and SCQO is a vendor-neutral core that other labs install under BSD-3-Clause. The decision was to KEEP it here WITH ISOLATION, which means: every lab-specific string lives in `field_dictionary.toml` (loaded via importlib.resources, so another lab swaps that ONE file and needs no Python change); nothing in `scqo/` imports the package except a single line in `viewer/app.py`; and the builders take no fastapi, the same data -> bytes contract `_export.py` states. `tests/test_lab_report_isolation.py` enforces all three in both directions, plus a ban on CJK characters anywhere in the package's Python, plus a test that renames the sheets in the TOML and checks the workbook follows - so the swap-the-file promise is checked rather than asserted. The intent is that moving this lab-side later is a directory move, not a refactor. BEHAVIOUR WORTH KNOWING, because these change what the report CLAIMS about a chip relative to the contributed version, and all three were found in review: (1) `f_01_hz` is no longer backfilled from `f_q_max_hz`. The catalog is explicit that the first is the frequency at the CURRENT idle bias and the second the sweet-spot arch top; they coincide only at the sweet spot, and g, kappa, the dispersive shift, EJ/EC, f02/2 and the effective temperature are all computed FROM it, so one substitution moved all of them. A qubit whose idle frequency is unmeasured now reports it - and everything derived from it - as MISSING. (2) The deck's \"Design\" resonator series is the datasheet value from design.toml; it was plotting the MEASURED bare frequency under that label, which invites the reader to conclude fabrication hit its target when nothing of the sort was checked. (3) The generated chip layout is gone: it arranged qubits in a 4-wide grid with dashed lines between horizontal neighbours and captioned it \"Design Pattern\" on three slides, which on a chain or a T is an invented topology presented as the design. A slide with no design_pattern.png now says there is none. Also fixed, from the same review: composite targets no longer collapse onto their first member (`q1_q2` was becoming `q1`, filing every two-qubit result from qc_n_swap_amp / qc_n_stark_amp / pair_zz_coupler under one qubit and potentially shadowing that qubit's own value) - the rider suffixes are now DERIVED from `catalog.CHANNELS[*].rider_suffix` rather than hand-copied; `get_latest_metric_stat(experiment=)` pushes the filter into find_campaigns' SQL instead of comparing after the newest row is already chosen, which returned None whenever the newest campaign was a different experiment; `estimator=\"mad_sigma\"` is gone from the Literal rather than silently returning the mean; store failures raise instead of returning {} (which reads exactly like an unmeasured chip); the unified context ranks setups by change-history TIMESTAMP rather than string-comparing a run_id against a campaign_id; the cooldown routes gate their context like the setup page does, so a malformed cooldown 404s instead of exporting a chip that does not exist; route parameters are typed, so a misspelled estimator is a 422 and `min_repeats=0` cannot disable the quality gate under headings that read \"#100\"; an empty context reports NO qubits instead of a phantom q1; `x or y` value chains became explicit None tests so a genuinely zero thermal population is 0.0 rather than blank; `tunable` reads idle_flux's VALUE rather than key presence; and design.toml is read through `scqo.design.load_design`, which tolerates the BOM PowerShell writes into that hand-edited file - the hand-rolled reader did not, and swallowed the resulting TOMLDecodeError, silently emptying the Design column on any machine where the file had been saved from PowerShell. KNOWN LIMIT, deliberate and worth deciding separately: the viewer is roster-free by design (it reads only the datastore), and `load_design` needs a roster to validate against, so the design column and the deck's Design series are EMPTY in the viewer today. That is honest - empty means unknown - and it is strictly better than the measured-value-labelled-Design it replaces, but the report only gains its design comparison once a roster reaches the viewer. UPGRADE REQUIRES the viewer extra to be reinstalled (python-pptx is new, pulling lxml and XlsxWriter; uv.lock adds those three and nothing else). Without it the two .pptx routes answer 503 naming the fix; everything else is unaffected. OFFLINE-VALIDATED: scqo 948 (.venv-view, driver-free, up from 922). The .pptx path is covered only where python-pptx is installed - the test skips otherwise, so a venv missing it will not fail the suite and will not exercise the deck. HARDWARE: none, and none is meaningful here - the viewer never touches an instrument. FIX riding along, NO fragment (recorded here at release time, as v2.1.0, v2.2.0 and v3.3.0 did for theirs) - scqo e4df4d0, TEST-ONLY. tests/test_campaign.py::test_period_gates_the_repeat_start asserted elapsed_s >= 0.5 exactly and Windows CI returned 0.4999999999999716, short by 3e-14 s. That is 28 femtoseconds: no sleep, scheduler or clock source operates at that scale, so it is a floating-point artifact of reading `monotonic() - started_mono` just after a gate that waited until `started_mono + n * period_s`, not a cadence miss. Worth recording what it is NOT, because it is the obvious guess and it is wrong: cancellation in (base + 0.5) - base. 0.5 needs one fractional bit, so that subtraction is EXACT for every realistic monotonic base - checked from 1e5 to 5e6. The mechanism is unidentified; only the scale is certain, so the tolerance is chosen to be unmistakably sub-physical rather than to model a cause: 1 ns, ~30000x the observed error and ~1e6x below the 0.25 s period, so it cannot hide a real gate failure. THIS IS THE SECOND timing assertion in that file to break in two days - v3.6.0 fixed test_cadence_wait_is_announced_before_sleeping, which was a genuine fragility (period_s=0.4 asserted the machine finishes a repeat inside 0.4 s) rather than an artifact. Different causes, one lesson, and it is now a standing item: wall-clock assertions in test_campaign.py need either an INJECTABLE CLOCK in run_campaign or an explicit tolerance. The injectable clock is the durable repair and is NOT in this cut. CI NOTE, and it corrects an earlier note rather than repeating it: the KNOWN Windows-only SQLite 'database is locked' flake in tests/test_index_scale.py has a SECOND member. v3.2.0 and v3.3.0 both name test_two_sessions_write_simultaneously; this cut also saw test_concurrent_first_open_never_drops_the_schema fail the same way and pass on rerun. Same file, same mode, same platform - re-run the leg, do not re-diagnose it, and do not go looking for the one test name the older notes give. The real repair is still datastore.py's silent WAL fallback and is still not in this cut. OFFLINE-VALIDATED at the cut: scqo 948 (.venv-view, driver-free, up from 922), scqo-qm 416 (.venv-qm, unchanged), scqo-qblox 319 (.venv-qblox, unchanged), plus SCQO 3-OS CI green on main at the release HEAD. scqat not re-run - no commit since v0.23.0. Both drivers carry NO functional change in this cut - their trees are identical to v3.7.0 apart from the version bump, taken so the tags' metadata match rather than lagging. HARDWARE LEDGER: nothing in this combo can reach an instrument - the viewer reads the datastore and nothing else, and it is the only thing that changed. Everything owed at v3.7.0 is owed unchanged, in particular the rebuilt qubit_tomography QM sequence together with the interleaved-noise validation owed since v3.1.0, both new Trotter-family experiments (pair_swap_angle has run on 5Q4C but every angle it has reported is UNCOMPENSATED and therefore an upper bound; qc_trotter_compensation and swap_coupler_flux have had no instrument contact at all), close_qm against a genuinely stuck cluster, and the three qubit_tomography defects accepted at v3.5.0 (scqo-qm #33, #34, #35), which remain open and unfixed. SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.8.0 in scqo / scqo-qm / scqo-qblox, scqat STAYS at v0.23.0, the editable reinstalls above INCLUDING the [viewer] extra on the viewer venv, restart the viewer, then scqo doctor from a NON-INSTALLER account over SSH. Neither the v3.6.0 nor the v3.7.0 server upgrade was performed, so this checkout carries three cuts' changes at once."

[v3-7-0]
date = 2026-09-01
scqo = "v3.7.0"                  # ADDITIVE pair_swap_angle + qc_trotter_compensation + the swap_coupler_flux knob on the Trotter chain
scqo-qm = "v3.7.0"               # the QM probes for both, and the phase-compensation tone the swap-angle read needs
scqo-qblox = "v3.7.0"            # NO functional change - version bump only, so the tag metadata matches (see notes)
scqo-contrib = "v0.12.0"         # RETIRED at v3.2.0 and no longer tagged; pin line kept for history only
scqat = "v0.23.0"                # the two new estimators + the sub-bin cosine seed - REQUIRED floor, LOUD twice and SILENT once, see notes
notes = "MINOR COMBO - ONE cross-repo feature, and the first cut since v3.4.0 whose scqat pin MOVES. Two new experiments plus one new Parameters field on an existing one, so the digit is the experiment's (y+1 for any experiment-level change); nothing an operator owns changes shape - no renames, no state-file, config or stored-data changes. UPGRADE REQUIRES, in order: (1) THE scqat PIN v0.23.0 IS A HARD FLOOR carrying BOTH kinds of failure at once, which is unusual and is why it leads. LOUD, twice: pair_swap_angle and qc_trotter_compensation each lazy-import their own estimator subpackage inside estimate(), so below the floor `scqo run <either>` dies with an ImportError naming the missing module and nobody gets wrong numbers. SILENT, once, and it reaches an ESTIMATOR THAT ALREADY SHIPPED: v0.23.0 also refines the cosine fit's frequency seed to sub-bin precision, and below it swap_oscillation - and any angle read through it - pins a period falling between FFT bins at the nearer bin, returning a plausible angle several percent wrong with a collapsed R^2 that the quality gate then blames on the DATA. So an older scqat does not merely lack the new experiments: do not run either one against one. (2) EDITABLE REINSTALLS, and this cut needs scqat re-pinned too, unlike v3.5.0 and v3.6.0: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps per venv (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. Verify with importlib.metadata.version, NEVER by checking that the import works. ADDITIVE - two new experiments and one new Parameters field, nothing existing changes shape. UPGRADE REQUIRES the usual editable reinstalls (all three scqo pyproject versions plus scqat, whose version DOES move this cut). WHAT SHIPS. pair_swap_angle measures the partial-swap ANGLE: it sweeps the COUPLER flux against the swap count and fits the oscillation period pi/theta per coupler value, returning theta(coupler flux) in radians and - given target_theta_rad - the volts that deliver a wanted angle, interpolated between measured rows. Until now the angle was carried entirely by a QUAM operation NAME, materialized by hand-editing two register scripts, with nothing recording what angle that name actually is; TUTORIAL section 12 said to count the period off a figure by eye. It is deliberately NOT a second binding on qc_n_swap_amp: that one sweeps the control qubit's flux (the RESONANCE knob) and only summarises where transfer peaks. Same sweep shape, different knob, different model. qc_trotter_compensation replaces the ~50-run hand scan that finding the chain's AC-Stark compensation phase used to be, with one 2-D run over (compensation amplitude, Trotter step). Its Parameters SUBCLASS QcUnidirectionalTrotterParameters so the scan and the run it calibrates cannot disagree about the round. Only the DIFFERENTIAL source-sink phase is observable (a common-mode phase cancels), so ONE amplitude is swept and compensation_target refuses the reset qubit BY NAME - that tone fires after the qubit has been emptied and measures nothing. n_at_max is reported beside the peak height because it reads the phase condition independently: cancelling rounds leave the sink peaking at N=1, adding rounds push the peak out to several. Because N is swept, the slice at the optimum IS the population-vs-N curve, so one run answers both questions. qc_unidirectional_trotter gains swap_coupler_flux - per-pair coupler volts, so a (theta_1, theta_2) set is a parameter sweep rather than a re-registered pulse, and the campaign over angle sets is a plan file. VOLTS, not an angle and not a factor, because theta = J_eff(Phi_c) * t_p is not linear in coupler flux; pair_swap_angle measures the curve you invert. Default {} is byte-for-byte the previous sequence. BOTH ARE RECORD-ONLY, and for a reason worth recording: a Stark compensation factor is a per-run sequence choice with no vendor home, and the composite knob <op>_coupler_flux IS in the catalog but its QM fieldmap binding reads macro.coupler_flux_pulse.amplitude, which ISwapImplementation does not have (it carries flux_pulse: str). So today that knob's read returns None and its write raises KeyError - the binding was written against a CZ-shaped macro. Proposing it would write nothing. Worth filing separately. FIX inside scqat, and it is not confined to the new code: the cosine fit seeded its frequency from the FFT peak BIN (spacing 1/(N*dx)). A true frequency landing between two bins pinned the fit there and it never walked off - silently, returning an angle several percent wrong with an R^2 the quality gate then rejected as if the DATA were bad. Nothing makes a swap period fall on a bin; it cost one rejected row per handful in the offline sweep. Now refined by three-point parabolic interpolation with the raw bin kept as a second candidate, so it never does worse. swap_oscillation - previously bound by no experiment, still bound by none - now calls the same shared tools/fit_cosine.fit_swap_oscillation reduction. CORRECTED BEFORE RELEASE, and it is the most important line in this fragment. pair_swap_angle's fitted `theta_rad` is the PER-ROUND COMPOSITE half-angle, not the exchange angle. Between swaps the two members accumulate a relative phase phi, and an exchange followed by a Z rotation does not commute, so the repeated unit satisfies cos(theta_eff) = cos(phi/2) cos(theta). Therefore theta_eff >= theta ALWAYS and an uncompensated run is an UPPER BOUND. Caught on hardware with an internal control: 5Q4C runs 20260901-003455 and -003908 differ only in operation_gap_ns (0 vs 20), and at coupler_flux_v = 0.0 the coupler pulse has zero amplitude so the swap is physically identical -- yet the fitted angle moved 0.993 -> 1.561 rad, the second indistinguishable from a full iSWAP. The experiment now carries compensation_amps + stark_operation + stark_detuning_hz (mirroring the Trotter chain's fields), its simulator plants the phase rather than a bare sin^2(N theta), and every docstring says what the number is. THE RECIPE: calibrate the tone with qc_n_stark_amp, or scan it and take the MINIMUM fitted angle -- the minimum is the exchange angle and is decoherence-immune, because decay changes the oscillation's amplitude and not its frequency. KNOWN LIMIT: phi depends on the coupler amplitude, so one fixed compensation is correct near its calibration point and drifts away from it; the phase-free alternative is a single pulse with swept time, i.e. a coupler-aware pair_swap_chevron, which does not exist yet. STILL OWED (hardware): EVERYTHING here is offline. Both new experiments and swap_coupler_flux have had no instrument contact. pair_swap_angle HAS now run on 5Q4C (2026-09-01), which is how the phase contamination above was found, but every angle it has reported so far is uncompensated and therefore an upper bound. AND A HARDWARE PREREQUISITE, which is the first thing an operator will hit: on 5Q4C BOTH chain couplers carry their swap pulse at amplitude 0.0 V, while the control qubits carry theirs at 0.152 / 0.1515 V. Those swaps are pure control-detuning swaps and TUTORIAL section 12's coupler-as-angle-knob recipe has never been applied to those pairs. The angle CANNOT be swept until register_flattop_cosine.py is re-run with a nonzero coupler amplitude - the macro divides cplr_amp by that stored value. All three QM probes refuse it by name through the new shared _coupler_knob.py rather than dividing by zero inside the vendor macro. LEDGER CORRECTION: v3.6.0 still lists qc_unidirectional_trotter as having had no instrument contact. It reached 5Q4C on 2026-08-27 (a ~50-run compensation scan, q1-q2-q3, runs 20260827-034936 through -044951), which is where this feature's physics comes from. That debt is discharged; what is owed for the chain now is a run WITH swap_coupler_flux set. OFFLINE-VALIDATED at the cut: scqat 707 (up from 687), scqo 922 (.venv-view, driver-free, up from 900), scqo-qm 416 (.venv-qm, up from 386), scqo-qblox 319 (.venv-qblox, unchanged), plus scqat 2-leg and SCQO 3-OS CI green on main at the pushed HEADs. scqo-qblox carries NO functional change - its tree is identical to v3.6.0 apart from the version bump, taken so the tag's metadata matches rather than lagging. STILL HELD: SCQO PR #29 (viewer lab-dashboard xlsx + pptx slide export, campaign_query) is deliberately NOT in this cut and stays open pending a charter decision about a lab-specific bilingual reporting template in the vendor-neutral public core; an xhigh review of it found 15 defects, four filed as SCQO issue #30. Also still open and NOT fixed here: the three qubit_tomography defects accepted at v3.5.0 (scqo-qm #33 num_training_shots=0 drops streams the contract requires, #34 align() narrowed off the flux/z elements, #35 reset_global_phase swallowed by a bare except). SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.7.0 in scqo / scqo-qm / scqo-qblox, scqat at v0.23.0, the editable reinstalls above (REQUIRED, and scqat moves this time), restart the viewer, then scqo doctor from a NON-INSTALLER account over SSH. The v3.6.0 server upgrade was never performed, so this checkout carries both cuts' changes at once."

[v3-6-0]
date = 2026-08-31
scqo = "v3.6.0"                  # NO code change - the consumed ledger, the version bump, and one test-only fix (see notes)
scqo-qm = "v3.6.0"               # ADDITIVE close_qm cluster-lock recovery (backend hook + operator CLI); FIX preview dispatches on the hook
scqo-qblox = "v3.6.0"            # NO functional change - version bump only, so the tag metadata matches (see notes)
scqo-contrib = "v0.12.0"         # RETIRED at v3.2.0 and no longer tagged; pin line kept for history only
scqat = "v0.22.0"                # UNCHANGED since v3.4.0 - nothing in this cut touches analysis
notes = "MINOR COMBO - one additive feature plus two fixes, ALL in scqo-qm; scqo carries no code change at all this cut and scqo-qblox none. DIGIT NOTE, because the rule as written does not cover this shape: RELEASING.md maps MINOR onto 'every experiment-level change' and PATCH onto 'a fix-only cut', and this is neither - an additive feature that is not an experiment. v3.2.0 is the precedent and it was cut MINOR on exactly that basis (the fork-contribution surface, LICENSE, docs and CI - no experiment touched), so an ADDITIVE non-experiment feature takes the minor digit. PATCH stays reserved for a cut carrying nothing but fixes. UPGRADE REQUIRES exactly one action: EDITABLE REINSTALLS. All three scqo pyproject versions bumped and .dist-info freezes the version at INSTALL time, so a git checkout alone leaves every venv still reporting 3.5.0 while the CODE is live. Run per venv: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO --no-deps (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. scqat needs NO reinstall - unchanged at v0.22.0 since v3.4.0. Verify with importlib.metadata.version, NEVER by checking that the import works. WHAT SHIPS: ADDITIVE - close_qm, THE CLUSTER-LOCK RECOVERY DOOR (scqo-qm only). When a QM session crashes or is abandoned its Quantum Machines stay open and keep the hardware locks, and the next run then stalls or never opens; there was no way out short of restarting the cluster. QMBackend.close_qm() halts running jobs and closes the open QMs, and `python -m scqo_qm.backend.close_qm` is the operator command (--qm-id for a single machine, --dry-run to list without closing). THE COMMAND LIVES IN THE DRIVER AND THAT IS THE POINT OF THE ENTRY. The contributed version (SCQO PR #28, CLOSED unmerged) put it in scqo as `scqo close-qm` + Session.close_qm() + an _ALIASES dict: it named a vendor three times inside the vendor-neutral core, gave every Qblox operator a top-level command that could only ever refuse them, and added exactly the compatibility alias the house rule forbids. This follows the apply_distortion precedent instead - the neutral core holds at most a hook NAME and a line builder, the backend returns a command STRING, and an operator command needing the vendor libraries lives beside them in the venv where they are installed. scqo gains NOTHING, and a non-QM setup is refused BY NAME rather than handed a benign-looking empty report. Generalized as a standing rule for future contributions. DESTRUCTIVE, and it does not prompt: halting a job discards whatever it had not yet streamed out, INCLUDING a colleague's running measurement. Hence --dry-run, and hence --qm-id does NOT run the whole-cluster close_all sweep (the contributed version swept regardless, so a targeted close still took out its neighbours). BEST-EFFORT BY DESIGN: every step is an independent cleanup on a cluster that is by hypothesis already misbehaving, so a QM refusing to close must not strand the ones after it. The blanket exception capture is deliberate and is the one place in this backend where it is right, but every arm RECORDS what failed into the report's `errors` instead of passing silently - READ `success`, NEVER THE ABSENCE OF A RAISE. It opens and closes its own manager, which is safe because QMBackend caches none (preview's simulation path already does the same). NOT A WEDGED-GATEWAY FIX, and the module docstring says so to keep the two failure modes apart: a cluster in the DEADLINE_EXCEEDED state answers nothing and still needs an operator restart from its web UI. Implementation from Yuhowlin's scqo-qm PR #31 (CLOSED - landed as maintainer commits), restructured as above. FIX - qubit_tomography's preview_program() WAS DEAD CODE IN v3.5.0 (scqo-qm). QMBackend.preview dispatched on `if reason:` - i.e. 'does this shell declare probe_self_acquires?' - so only a self-acquiring shell could ever reach its own hook. Tomography is a normal build-and-return shell, so --preview fell through to probe() and rendered the full program INCLUDING the training shots the hook exists to drop. The dispatch conflated two separate questions: whether a shell ACQUIRES inside probe() decides whether probe() is a legal fallback and gates the single-target rule, while whether it has a HOOK decides what preview renders. It now asks the second, and _preview_refusal's docstring states that a normal shell may carry a hook too. NO behaviour change for the existing carriers - qc_n_swap_amp and qc_n_stark_amp declare both attributes, and the four self-acquiring shells without a hook are still refused before the dispatch is reached. The only shell whose preview output changes is qubit_tomography. The line was misfiled into the close-qm PR and so shipped in NEITHER half of v3.5.0; it is landed here with the feature it belongs to. Closed scqo-qm issue #36. FIX - a test that asserted how fast the machine is (scqo, TEST-ONLY - no production code touched). tests/test_campaign.py::test_cadence_wait_is_announced_before_sleeping ran a 2-repeat campaign with period_s=0.4 and asserted a cadence_wait event fired, but run_campaign announces that event ONLY when the period still has time left to sleep - a repeat that overran is recorded through overran_by_s and announces nothing, which is the documented and correct behaviour. So the assertion was really 'repeat 0 finishes within 0.4 s on this machine'. Warm it does, cold it does not. IT FAILED THE ubuntu-3.12 LEG OF THE v3.5.0 RELEASE COMMIT ITSELF - the other three legs passed and that commit changed only two TOML files and a version string - and it reproduced 5/5 locally when run in isolation while the whole file passed, the earlier tests warming the imports and caches that otherwise push repeat 0 past the period. period_s is now 30 with time.sleep stubbed, so the wait is guaranteed positive, the test still runs instantly, and it additionally asserts that what was announced is what was actually slept. WORTH KNOWING: v3.5.0's tag was cut on the merge commit's green CI, not on the release commit's own run, which is how this went unnoticed at that cut; check the RELEASE COMMIT's run before tagging. OFFLINE-VALIDATED at the cut: scqo 900 (.venv-view, driver-free), scqo-qm 386 (.venv-qm, up from 374 at v3.5.0 - ten close_qm tests plus two preview-dispatch ones), scqo-qblox 319 (.venv-qblox), plus SCQO 3-OS CI green on main. scqat not re-run - unchanged. scqo-qblox carries NO functional change - its tree is identical to v3.5.0 apart from the version bump, taken rather than a lagging-metadata re-tag so the tag's metadata matches. STILL HELD: SCQO PR #29 (viewer lab-dashboard xlsx + pptx slide export, campaign_query) remains open pending a charter decision - it would bake a lab-specific bilingual reporting template, including a sheet named in Traditional Chinese, into the vendor-neutral core of a public BSD-3-Clause repo, and add python-pptx as a fourth export format beside HTML/xlsx/PDF. Its campaign_query defects are filed as SCQO issue #30. HARDWARE LEDGER: NOTHING in this combo has reached an instrument. NEWLY OWED - close_qm is validated against doubles only, and by its nature it is really validated the first time it is pointed at a genuinely stuck cluster; watch that run, and note it can halt a colleague's job. The three qubit_tomography defects accepted at v3.5.0 are still open and unfixed: scqo-qm #33 (num_training_shots=0 drops streams that acquire() and the contract still require), #34 (align() narrowed off the flux/z elements) and #35 (reset_global_phase swallowed by a bare except). STILL OWED, carried forward from v3.5.0 unchanged - the rebuilt qubit_tomography QM sequence together with the interleaved-noise validation owed since v3.1.0, qc_unidirectional_trotter, the single_shot_readout uncalibrated-rotation fix on a first bring-up, both parametric-drive shells on QM, ALL SIX Qblox probes from PR #12, qubit_ramsey_phasor on both backends, the Qblox cryoscopes and their applied filter, the broadband RESONATOR variant and cross-band switching, punchout v2 on Qblox, the coupling-coefficient live run, readout average mode on both backends, register_stark.py + qc_n_stark_amp, and the quam-builder v0.5.0 first-real-OPX1000-run watch. SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.6.0 in scqo / scqo-qm / scqo-qblox, scqat STAYS at v0.22.0, the editable reinstalls above (REQUIRED), restart the viewer, then scqo doctor from a NON-INSTALLER account over SSH."

