al. OFFLINE-VALIDATED at the cut: scqo 870 plus 3-OS CI green, scqat 671, scqo-qblox 303 (lab venv and Linux CI), scqo-qm 346 (shared .venv-qm). CI NOTE: tests/test_index_scale.py::test_two_sessions_write_simultaneously is a KNOWN Windows-only flake (SQLite 'database is locked'; same failure on run 30335065138, 2026-07-28) - re-run the leg, do not re-diagnose it; the real repair is datastore.py's silent WAL fallback and is not in this cut. HARDWARE LEDGER: NOTHING in this combo touches a probe, schedule, program or instrument path, so no hardware validation is owed FOR THE CODE. One environmental item IS owed: quam-builder v0.5.0 is offline-evidence only, .venv-qm has already been rebuilt onto it, so treat the first real OPX1000 run as its validation step and watch it. STILL OWED, carried forward from v3.1.0 - qubit_ramsey_phasor on both backends, the Qblox cryoscopes and their applied filter, qubit_parametric_drive's population run, qubit_tomography interleaved noise, the broadband RESONATOR variant and cross-band switching, punchout v2 on Qblox, the coupling-coefficient live run, readout average mode on both backends, and register_stark.py + qc_n_stark_amp. SERVER UPGRADE (BLUEFORSAS2): INSTALL section 5 - git fetch --tags && git checkout v3.2.0 in scqo / scqo-qm / scqo-qblox plus scqat at v0.20.1, the editable reinstalls above (REQUIRED this cut), restart the viewer, then scqo doctor from a NON-INSTALLER account over SSH."

