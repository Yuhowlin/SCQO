notes = "ADDITIVE COMBO - three features (2 additive / 1 fix), and the first cut aimed at people OUTSIDE this lab. Nothing an operator owns changes shape - no Parameters, experiment names, state files, config keys or stored state - and no new dependency ships into the neutral layer. UPGRADE REQUIRES exactly one action: EDITABLE REINSTALLS. All four pyproject versions bumped and .dist-info freezes at INSTALL time, so a git checkout alone leaves every venv still reporting 3.1.0: uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\SCQO -e D:\\github\\scqat --no-deps per venv (.venv-qm, .venv-qblox, .venv-view), plus each driver editable into its own venv. Verify with importlib.metadata.version, NEVER by checking that the import works. WHAT SHIPS: ADDITIVE - THE FORK-CONTRIBUTION SURFACE. All four repos are public and now carry a BSD-3-Clause LICENSE, which they did not before: GitHub reported no licence, so forking and redistribution were not actually permitted. Each repo gains AGENTS.md, the contributor brief that Cursor, Codex, Gemini CLI, Windsurf, Aider and Zed all read; it is deliberately NOT a pointer to CLAUDE.md, because that file is lab operations and two of its rules (never switch branches, commit by explicit pathspec) are the OPPOSITE of what a fork needs. SCQO gains the real CONTRIBUTING.md, the siblings stubs. Three publication hazards closed: SCQO and scqo-qblox were shipping CLAUDE.md as their packaged PyPI readme; a tracked .claude/settings.json handed every forker's agent ~160 accumulated permission grants including git reset, git commit and gh api -X DELETE; and scqat's notebooks/, analysis/ and temp/ carried absolute paths into personal lab storage. Two doc blocks are GENERATED now and test-enforced (scripts/update_docs.py): SCQO's tree listed 31 of 41 registered experiments, omitting both cryoscopes, both broadband scans and qubit_ramsey_phasor - the flagship of the release the file was committed for - and scqat's tool table listed 10