notes = "REQUIRED: scqat MUST be at v0.13.0 — the cryoscope estimator RENAMED (scqat.estimators.cryoscope -> ramsey_cryoscope) and the NEW scqat.estimators.spectroscopy_cryoscope exist only at this tag, so an under-version scqat fails qubit_ramsey_cryoscope / qubit_spectroscopy_cryoscope runs LOUDLY with ImportError. Re-run the editable installs (line at the end). BREAKING RENAME — qubit_cryoscope IS NOW qubit_ramsey_cryoscope (the family gained a second member, so the name must say which mechanism). NO alias or shim ships (house rule: one clean cutover): scripts, campaign plans and parameters.toml tables saying qubit_cryoscope now fail by name; edit the name and re-run. Saved run folders are immutable and keep the old experiment name — query historical runs by the OLD name. NEW EXPERIMENT — qubit_spectroscopy_cryoscope (QM-only probe), the LONG-TIME flux-distortion sibling: qubit spectroscopy DURING a long weak flux pulse (settable drive length, asymmetric detuning window) reads the slow tail that ramsey_cryoscope's short window cannot see; same paired distortion_amp/distortion_tau_s facts with REPLACE semantics, and the two experiments propose INDEPENDENTLY. v1 is BAND-LIMITED (no LO shift — the detuning window must fit the current LO band). NEW — the cryoscope taps now REACH the instrument: LCHQMDriver's apply_exponential_filter writes accepted distortion taps into the OPX z-output exponential filter (a documented MANUAL step in v0.23.0), LCHQBDriver gains the matching Qblox flux-distortion config-value wrapper, and scqat gains the sum <-> single-pole-cascade predistortion converter. NEW — ACTIVE RESET ON QM: reset_method='active' is now realized on the QM backend for the four coherent-drive carriers (qubit_relaxation, qubit_ramsey, qubit_echo, qubit_power_rabi) through the one door customized/scqo/experiments/_reset.py (check_reset_method + reset_max_attempts, re-checked in QMBackend.acquire before probe()); every other experiment still REFUSES it by name. QM rules, each refused loudly: active_reset_rounds maps to QUAM max_attempts as an UPPER bound (not Qblox's exactly-N); BOTH readout_threshold AND readout_rus_threshold must be governed (uncalibrated is None on QM and would die nameless deep in QUA); readout_depletion_s must be governed (the 16 ns factory default is refused); thermalization_time_ns together with 'active' is refused, not ignored. WARNING — NOT YET HARDWARE-VALIDATED: offline tests prove the policy and that the QUA program builds, but the feedback loop is hardware, and the chipA walkthrough in _reset.py's docstring is STILL OWED (shipped by decision 2026-08-05). Treat QM active-reset results as unvalidated until the walkthrough passes (refusals fire, thermal-vs-active T1 and T2*/detuning consistent), and note a personal parameters.toml [qubit_ramsey] reset_method='active' line is now LIVE on QM. FIX (QM), AND IT UNBLOCKS A WHOLE EXPERIMENT — qubit_parity_switch on QM crashed AFTER the full QUA program ran: QMBackend.acquire took the progress-counter total from getattr(params, 'num_shots', 1), which returns the present-but-None value for record_time_s-derived experiments, and the vendor progress_counter died on int/None. The total now resolves through experiment.resolved_num_shots() (the same number the probe buffers with) — hardware-verified on chipA (run completes, dataset.nc written). This fix rode in LCHQMDriver commit 2377bc5, whose message names only active reset. FIX (scqat), AND IT CAN FLIP A RUN'S OUTCOME — the Ramsey time-domain fit collapse: the phi=0 phase seed plus the a>=0 amplitude bound collapsed anti-phase/beat fringes to the flat mean (a ~ 1e-11) while still reporting SUCCESSFUL, and force_model='beat' collapsed identically. Both fitters now seed amplitude+phase from an LS quadrature projection (new tools helper seed_amp_phase) and ramsey_fit folds a MIN_VAR_EXPLAINED=0.05 gate into success (new var_explained result field): a collapsed fit now reports success=False and the run marks FAILED