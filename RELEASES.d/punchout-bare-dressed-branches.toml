name = "punchout-bare-dressed-branches"
repos = { scqo = "72451c9", scqat = "5dff7ea" }
kind = "additive"
coupling = "scqo needs scqat >= 5dff7ea: both punchout carriers read the branch keys (f_bare/f_dress0/lamb_shift/branch_success + dress_max_power/bare_min_power) out of the power estimator's results. An older scqat raises KeyError at estimate time — LOUD, not silent, but a hard floor."
validated = "HARDWARE-VALIDATED on QM (5Q4C, 2026-08-18, operator-confirmed): live v2 runs 213849/214012/214045 (q3) all resolved both branches with the boundary powers bracketing the transition (e.g. dispersive <= -27.1 dBm, punched out >= -1.75 dBm, Lamb 15.0 MHz), after replay against the six earlier 5Q4C runs that falsified v1. Qblox live run still owed. Offline: scqat 29 power-estimator tests green incl. the run-20260818-204626 regression fixture; scqo punchout suite green; the punchout -> flux pin loop is covered by test_punchout_feeds_the_flux_map_a_measured_bare_frequency."
notes = """
Both punchouts (resonator_spectroscopy_power_amp / _chain) extract the punchout's TWO BRANCHES and propose them as resonator-mode facts: the low-power dip is the DRESSED resonator (f_dress0_hz, qubit in |0>) and the high-power one, where the qubit saturates, is the BARE resonator (f_bare_hz). Their gap is the Lamb shift g^2/Delta, recorded as lamb_shift_hz (derivable from the two facts, so deliberately NOT a catalog field), alongside old_idle_flux — the flux the dressed frequency was measured at — and the plateau boundary powers dress_max_power_dbm / bare_min_power_dbm (highest still-dispersive / lowest fully-punched-out power; setup-chain properties, record-only).
This closes the loop with resonator_spectroscopy_flux, which pins a stored f_bare_hz to make its fitted coupling g quantitative: a punchout is the only DIRECT measurement of f_bare_hz. The operator loop runs both ways — power_amp -> flux -> power_amp — with the second punchout measuring f_dress0_hz at the sweet spot the flux map re-parked to.
EXTRACTION v2 (first 5Q4C hardware runs falsified v1, run 20260818-204626): branches are found by ANCHORED TWO-BAND CLASSIFICATION — each plateau anchored at its own end of the power axis, every point classified against the two FIXED anchors (band = branch_band_frac x anchor separation), plateau = the leading in-band run from each end with isolated single-point glitches bridged, transition points feed NEITHER branch. v1's lagging-median growth crept into the transition, and its global median/MAD FWHM gate deleted the entire bare plateau (the dressed dip is qubit-broadened ~8-9 MHz, the bare one ~3-4 MHz — a population width gate flags the smaller plateau on any such chip); the per-slice gate is now in-window + fittable-width only. A side whose anchor scatter exceeds the band is refused (window truncated mid-transition), and estimator kwargs n_sigma / branch_tol_frac plus result keys settled_power / dip_amplitude_median / dip_amplitude_mad were removed unreleased.
NO catalog change and NO upgrade action: f_bare_hz/f_dress0_hz already exist on the resonator mode, and f_bare_hz's doc already named a high-power punchout as its source.
BEHAVIOR CHANGE: both punchouts now propose four values instead of two, so an operator who accepts blindly will also write the two resonator facts. A window that never reaches saturation — or whose top ends mid-transition — reports f_dress0_hz only and withholds f_bare_hz (branch_success false) rather than guessing.
Also in scqat: the power estimator's generate_figures moved onto render_figures thunks (fixing a pre-existing per-figure-isolation violation) and gained the missing figures-render-on-a-failed-fit test.
"""
