name = "readout-detuning-capability"
repos = { scqo = "814f9a9", "scqo-qblox" = "7222b1f", "scqo-qm" = "2bff33f" }
kind = "breaking"
coupling = "scqo and scqo-qblox move in LOCKSTEP (scqo-qblox >= 7222b1f with scqo >= 814f9a9): an old qblox shell against new scqo dies loudly reading the retired params.num_points / num_freq_points on resonator_spectroscopy and the two punchouts — but the floor that matters is SILENT the other way round: pre-7222b1f shells re-derive a symmetric center+/-span/2 NCO sweep from the detuning axis, so an ASYMMETRIC [start,end] window is quietly re-centered on readout_freq_hz, with the width and the point count intact and every fitted frequency attributed wrong. It bites hardest on exactly the sweep that needs the asymmetry — a punchout walks the dip DOWN from f_dress0 to f_bare. The flux and readout_frequency probes already used the endpoint form and are unaffected. scqo-qm probes consume sweep_axes as given (2bff33f is test-only)."
validated = "offline"
notes = "New derived capability readout_detuning (mixin ReadoutDetuningSweepParameters; catalog + scqo run --capability): resonator_spectroscopy, resonator_spectroscopy_power_amp, resonator_spectroscopy_power_chain, resonator_spectroscopy_flux and readout_frequency sweep an explicit [start_readout_detuning_hz, end_readout_detuning_hz] window (asymmetric allowed, ascending enforced) relative to the current readout frequency. That is EVERY readout-frequency window in the registry, so the catalog's 'none' bucket is now empty. The two detuning frames share one axis (detuning_hz) but are INDEPENDENT SIBLINGS, not a subclass pair like flux/flux_pulse — one experiment could sweep both — so the frame moved into the FIELD NAME on both sides in the same unreleased cycle (see drive-detuning-capability). BREAKING / UPGRADE REQUIRES: frequency_span_hz no longer exists on these five, nor num_points (resonator_spectroscopy) / num_freq_points (the other four) — update standing parameters.toml overlays, campaign plans and scripts to start_readout_detuning_hz / end_readout_detuning_hz / num_readout_freq_points. A stale key is refused at run() (the catalog overlay skips it silently, so `scqo run <name> --help` will look fine and the run will not)."
