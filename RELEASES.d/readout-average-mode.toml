name = "readout-average-mode"
repos = { scqat = "8cf4284", scqo = "1b04c19", scqo-qm = "b151d8a", scqo-qblox = "a68ff79" }
kind = "breaking"
coupling = """
scqo needs scqat >= 8cf4284: estimate() passes method= to the readout_fidelity \
estimator, which an older scqat refuses by name. Both drivers need scqo >= 1b04c19: \
their probes read params.readout_mode, absent from the older Parameters (AttributeError \
before any pulse). All four repos move together.\
"""
validated = "offline (scqat 596, scqo experiments+contract+capabilities 153, scqo-qm 318, scqo-qblox 268); average mode on hardware still owed on BOTH backends"
notes = """
readout_power and readout_frequency gain readout_mode='average': the FPGA averages the \
shots, so one I/Q point per prepared state, no Gaussian fit, no fidelity — the optimum \
becomes the largest blob SEPARATION (new best_separation fit key, recorded in both modes; \
best_fidelity is NaN in average mode). Default stays 'shot' and that path is unchanged. \
BEHAVIOR CHANGE: the readout-sweep figure set loses 'std' and 'mean_distance' for one \
merged 'separation' figure (both curves on one axes, same IQ units, y anchored at 0); \
'snr' and 'outlier' also start at 0. UPGRADE REQUIRES nothing of an operator, but scripts \
naming the old PNGs must switch to <estimator>_separation.png, and readout_power in \
average mode maximizes separation with no measurement-induced-transition guard — coarse \
scan only, calibrate the amplitude in shot mode.\
"""
