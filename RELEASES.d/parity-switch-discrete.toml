name = "parity-switch-discrete"
repos = { scqat = "4008186", scqo = "90c3bb1", lchqmdriver = "a0fe125", lchqbdriver = "1606ced" }
kind = "breaking"
coupling = "scqo needs scqat >= 4008186: estimate() lazy-imports scqat.estimators.parity_switch_continuous / parity_switch_discrete (an older scqat raises ImportError at estimate time — loud), and the discrete fit keys (p_intercycle_flip, p_m1_high, p_m2_high) are read via .get(..., nan), so a scqat that predates them would degrade SILENTLY to NaN."
validated = "offline"
notes = "UPGRADE REQUIRES: qubit_parity_switch is renamed qubit_parity_switch_continuous (no alias) — re-key any ~/.scqo/parameters.toml [qubit_parity_switch] table to the new name or its defaults silently stop applying; scqat artifacts follow (parity_switch_* -> parity_switch_continuous_*). NEW: qubit_parity_switch_discrete on both backends — per cycle M1 - depletion - x90 - idle - y90 - M2 - pad at a fixed cycle_period_ns; parity = m1 XOR m2 within each cycle, so M1's re-projection makes slow sampling T1-safe (two acquisition bins per cycle on Qblox; max_num_shots default 1.4e6). Discrete has NO idle_multiple (the continuous variant keeps it) — the period is extended with cycle_period_ns, not by stretching the idle. BEHAVIOR CHANGE: resonator_spectroscopy depletion_factor default 5 -> 10 (tau_d ~ 10/kappa) — proposed readout_depletion_s waits double on the next accepted run; standing knobs are untouched until then. Hardware validation of the discrete variant pending on both backends."
