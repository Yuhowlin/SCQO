notes = '''BEHAVIOR CHANGE: none — purely additive. `track_peaks()` and the parametric_drive_resonance / qubit_spectroscopy_flux estimators now emit `peak_inverted` (per peak) and `n_inverted` (per map) beside the existing fields; no existing key changes value, and `reduced_map` is still never negated. Why it exists: `peak_fit.fit_peaks` picks the stronger polarity per row and, when the dip wins, fits POSITIVE Lorentzians on the negated trace, so `peak_amplitude` is polarity-NORMALIZED and cannot by itself tell an absorption dip from an emission peak — a NEGATIVE amplitude means a badly-conditioned fit, not a dip. `peak_inverted` is the only place that distinction survives the pooling; signed physics is recovered as `np.where(peak_inverted, -peak_amplitude, peak_amplitude)`. Two things the release notes must carry: the flag has NO consumer yet (both visualizations only document that it rides along in plot_data, nothing plots it or branches on it, so a dip-heavy map still reads as if every peak were an emission peak), and the source commit 193b3f0, written 2026-08-26, calls itself UNFINISHED AND UNREVIEWED — it was merged as 0b14f0a because it applied clean onto 23 commits of untouched files and its tests pass, with the remaining work tracked as BACKLOG F12. A `plotdata.nc` written before 2026-09-20 has no `peak_inverted`, so any future consumer must tolerate its absence or old runs stop replotting.'''
