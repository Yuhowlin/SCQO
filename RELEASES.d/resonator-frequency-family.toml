name = "resonator-frequency-family"
repos = { scqo = "8bb6a1a", scqat = "bb75128", scqo-qm = "b037d70", scqo-qblox = "98b6e5d" }
kind = "breaking"
coupling = "scqo needs scqat >= bb75128: estimate() always passes the f_r0/fit_f_r0 flux-model kwargs (and ec/g_init from the prior feature). An older scqat routes them to the dip stage and raises ValueError at estimate time — LOUD, not silent, but a hard floor."
validated = "offline (scqat 606 + scqo 806 + scqo-qblox glue 6 green); refit of saved 5Q4C run 20260817-210427-171 reproduces g and the junction-resistance round trip lands within 4 MHz. scqo-qm glue suite NOT run (its venv could not install pytest — a live process holds msgpack/_cmsgpack.pyd); the identical qblox fixture passes and the seed hop was verified directly."
notes = """
UPGRADE REQUIRES two operator actions.
(1) Rename the resonator facts in every physical.json and design.toml: f_r0_hz -> f_bare_hz, f_r_hz -> f_dress0_hz (the digit is the QUBIT STATE dressing the resonator; f_dress1_hz is reserved for the |1> dip, giving chi = (f_dress0_hz - f_dress1_hz)/2). Values are unchanged. ALREADY APPLIED to 5Q4C (cd1, cd2) and chipA (cd1 x3 setups) plus both design.toml. A cavity's f_r_hz is NOT renamed. f_bare_hz is now design-legal; f_dress0_hz stays design-legal because readout_freq_hz seeds from it.
(2) Delete any f_q_max_hz key from a [resonator_spectroscopy_flux] table in ~/.scqo/parameters.toml — the Parameter is gone and Parameters is extra=forbid, so the run refuses (gracefully, naming the file).
BEHAVIOR CHANGE: resonator_spectroscopy_flux now sources the dispersive fit's fixed inputs itself. f_q_max resolves standing drive_freq_hz -> fab junction_resistance_ohm via Ambegaokar-Baratoff -> design f_q_max_hz -> assumed; the bare resonator is PINNED when f_bare_hz is a stored measurement (which is what makes the reported g quantitative) and only SEEDED, with a UserWarning and a seeded: run tag, when it is merely designed. New catalog facts: ec_hz, junction_resistance_ohm, gap_delta_hz on the transmon base. New Experiment.fact_sourced() reports which tier answered and tags design-sourced reads.
"""
