name = "spectroscopy-cryoscope-drive-shape"
repos = { scqo = "d3eddc8", "scqo-qm" = "12284c2" }
kind = "additive"
coupling = "drive_shape='cosine'/'gaussian' needs scqat >= bd614a5 (see peak-fit-wide-line-gate), and the floor is SILENT: a smooth envelope is 1.4-1.7x wider than square at the same drive_len_ns, and against the old value-MAD significance gate a line filling ~45% of the detuning window returned n_peaks_found=0 with no indication why. The default 'square' does not need it. No scqo <-> scqo-qm ordering hazard: the parameters carry defaults and an old driver simply ignores them."
validated = "hardware 5Q4C q1 2026-08-19 (three runs, one per envelope, at one setting)"
notes = "ADDITIVE: qubit_spectroscopy_cryoscope gains drive_shape (square | cosine | gaussian), drive_sigma_frac and drive_amp_factor. The spectroscopy tone is now BUILT per run — a run-scoped xy operation at exactly drive_len_ns and at the pi-area amplitude, played bare (no duration= stretch, no amplitude_scale, so QUA's +/-2 amp() bound no longer binds this path) and dropped again in run()'s finally, so it never reaches state.json. Nothing existing changes: the default 'square' reproduces the retired stretched-saturation tone's rotation area EXACTLY (verified against the live 5Q4C state, 1.0000x), and saved runs are unaffected. THE DEFAULT IS SQUARE ON MEASUREMENT, NOT THEORY: across three runs differing only in envelope, the per-wait center scatter tracked the LINEWIDTH and nothing else — 0.0087 / 0.0088 / 0.0101 MHz of scatter per MHz of FWHM for square / gaussian / cosine, i.e. 0.064 / 0.128 / 0.164 MHz against widths 7.4 / 14.6 / 16.2 MHz. Square has the narrowest main lobe per ns (FWHM x length = 0.799, vs 1.095 gaussian at sigma=T/4 and 1.334 cosine/Hann), and its 11.6% Rabi-nutation shoulders — the whole reason to want a smooth envelope — cost nothing measurable. Guidance in the parameter docs: reach for cosine/gaussian against a line that looks WRONG (split, asymmetric), never to narrow the band; LENGTH is the lever, capped by the Fourier tradeoff that waits shorter than drive_len_ns average the settling over the pulse. Driver-side trap fixed on the way: a subtracted GaussianPulse renders a peak of only amplitude x (1 - e^-2) at sigma = T/4 while `amplitude` is what gets stored, so the built pulse is measured by _mean_per_amplitude (mean per NOMINAL amplitude) rather than _area_ratio (mean per rendered PEAK) — the latter left the tone 13.5% under a pi pulse, a silent under-rotation costing only contrast. _area_ratio still measures the x180 reference, whose convention the calibrated pi amplitude has always been read against."
