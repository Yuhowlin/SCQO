notes = "Both cryoscopes now probe on Qblox: qubit_ramsey_cryoscope keeps the full 1-ns duration axis by COMPOSING each duration as a 4k-ns voltage-offset segment + a 1/2/3-sample SquarePulse remainder (3 waveforms total; every flux wait a multiple of 4 - the compiler refuses waits under 4 ns), frame axis = realtime PHASE loop via ShiftClockPhase (+360*frame), max_duration_ns capped at 512 by the readout QRM's 12288-instruction budget (refused by name); qubit_spectroscopy_cryoscope is square-drive ONLY (cosine/gaussian refused by name), pi-area amplitude sampled from the rxy DRAG envelope. New operator CLI python -m scqo_qblox.backend.apply_distortion (--run/--extend/--clear/--dry-run; the 4-stage bank overflows LOUDLY, --extend merges + re-partitions) writes ONE QbloxHardwareDistortionCorrection under distortion_corrections['<flux_port>-cl0.baseband'] (the _distortion.py docstring's old '<q>:fl-<q>.flux' key was WRONG), and QbloxBackend.distortion_apply_command feeds the cryoscopes' writeback hint. SCQO side is doc-only (drops 'QM-only probe today')."
