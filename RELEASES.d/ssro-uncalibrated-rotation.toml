name = "ssro-uncalibrated-rotation"
repos = { scqo-qm = "1ddacfc" }
kind = "fix"
coupling = ""
validated = "offline"
notes = "FIX (scqo-qm) - single_shot_readout LOST ITS WHOLE SUGGESTION SET on a channel whose discriminator had never been calibrated. The QM update() override accumulates the demod rotation as an ABSOLUTE proposal (current - delta), reading the channel's current value with float(view.readout_rotation_rad). That field is None until a discriminator exists, which is precisely the state the FIRST single-shot readout on a fresh chip runs in, so float(None) raised TypeError. The session's suggestion capture swallows that exception by design (a failed update must never lose the measurement), so the visible symptom was the WORST kind: the run reported success, kept its data and its fit, and silently proposed NOTHING - no blob centers, no per-state fidelities, no discriminator trio - with the reason buried in result.error. An unset rotation now reads as 0.0, the honest baseline for a channel that has had no rotation applied; a calibrated channel is unaffected. PRE-EXISTING, not a regression from this cut: the line is unchanged since before v3.3.0. It hid because SCQO's own suite is meant to run driver-free (in the lab that is .venv-view), and in any venv where the driver IS installed the entry point silently fails to import against a mismatched scqo - scqo.experiments._discover swallows the ImportError and the CORE class registers instead, so the driver override never ran. WORTH KNOWING BEYOND THIS BUG: a driver whose entry point fails to import does not fail anything loudly, it just quietly stops being exercised. Found while validating the v3.4.0 cut."
