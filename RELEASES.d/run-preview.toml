name = "run-preview"
repos = { scqo = "a269cf4", lchqbdriver = "14bf12e", lchqmdriver = "5dd756b" }
kind = "additive"
coupling = "new scqo CLI + OLDER drivers: --simulate-ns/--no-simulate reach a driver preview() without **options and die as 'preview failed: TypeError' instead of a named refusal — cosmetic, not silent; plain --preview is graceful both ways (missing hook -> named refusal; new driver + old scqo -> dead code). No silent-failure combination."
validated = "offline + real-config CLI smokes (chipA qblox render/refusal in .venv-qblox; chipA qm_OPX1000 in .venv-qm incl. LIVE gateway simulate against 10.21.19.201); no qubit ever plays by design"
notes = "scqo run <name> --preview [--out DIR] [--no-open] [--simulate-ns NS] [--no-simulate] builds and stops after probe(), rendering the sequence to ./scqo_preview/<name>_<ts>/ and auto-opening it. Qblox: interactive pulse_diagram.html + timing_table.html, refused by name above 256 rendered shots = points x averages (the vendor visualizer unrolls every loop). QM: qua_script.py + AUTO gateway-simulated simulated_waveforms.html (2 s TCP probe; any gateway problem degrades to script + warning; six self-acquiring shells refuse by name via probe_self_acquires). Simulated backend refuses by name. Nothing runs on qubits, nothing saved, no updates."
