name = "broadband-spectroscopy"
repos = { scqo = "8e406505", "scqo-qm" = "1ea194d5", scqat = "09e7e6f7" }
kind = "additive"
coupling = "scqo needs scqat >= 09e7e6f7: both experiments lazy-import their estimator (scqat.estimators.broadband_qubit_spectroscopy / broadband_resonator_spectroscopy) inside estimate(), so the catalog imports fine under an older scqat and the run fails LOUDLY with ImportError at estimate time (these two experiments only). No scqo <-> scqo-qm ordering hazard: the experiments are new names, absent from an older driver's registry."
validated = "qubit variant HARDWARE-VALIDATED on 5Q4C q1 2026-08-19 (run 20260819-151504-090: single-band 4.95-5.35 GHz scan at drive_power_dbm=-40 recovered the candidate at 5.1438 GHz vs the stored drive_freq_hz 5.14198 GHz — within 1.8 MHz on an ~18 MHz-FWHM saturation line) and offline pre-flighted: the multi-band QUAM mutation path (bands 1->2->3, 12 LO slices, port-pair partner parked at IF=0) passes generate_config() on the real 5Q4C cd2 state at every slice. The RESONATOR variant and the cross-band SWITCHING path are OFFLINE-ONLY (sim + config gate; never executed on an instrument). Offline: scqat 598, scqo-qm 318/328, SCQO main CI 3-OS green at the merge."
notes = """
ADDITIVE: two new record-only wideband SEARCH experiments (contributed by Yuhowlin, PRs SCQO#25 / scqo-qm#28 / scqat#28) for bring-up on an uncharacterized chip — sweep an ABSOLUTE [start_freq_hz, stop_freq_hz] span (not a detuning window; deliberately no drive/readout_detuning capability) by stepping the LO across sub-bands, stitch the sub-sweeps, and mark candidates without touching device state.
broadband_qubit_spectroscopy (capability qubit_reset): two-tone saturation scan across stepped drive-LO sub-bands -> top-N candidate_qubit_frequencies_hz per target, via scqat fit_peaks() (the same baseline/polarity/FWHM-guard/Lorentzian reduction as qubit_spectroscopy; knobs max_peaks/prominence/min_snr forwarded verbatim). broadband_resonator_spectroscopy (no capability): feedline scan -> candidate resonator_frequencies_hz dips, via the new scqat tools/dip_finder.py + estimator pair.
QM MULTI-BAND MW-FEM SUPPORT: the drive probe splits the RF range into band segments (Band 1 LO 0.05-5.5 / Band 2 4.5-7.5 / Band 3 6.5-10.5 GHz), switches opx_output.band per segment, and — the sharp edge — switches each target's PORT-PAIR PARTNER ((2,3)(4,5)(6,7) must share a band) with it, parking the partner's LO at the new band's lo_min with RF=LO (IF=0), all restored in a finally. ON 5Q4C THAT MEANS SCANNING q1 TAKES q2 ALONG (FEM6 ports 2+3), q3 takes q4; q5's partner port is unused, making it the least disruptive target. Both probes declare probe_self_acquires, so `scqo run --preview` REFUSES them by name — the first execution is always on the instrument.
KNOWN GAPS shipped deliberately (review debt from merging on green CI, tracked in the PR follow-up comments): (1) the qubit estimator has NO scqat test and the qubit experiment NO sim-run test (both new tests exercise the resonator variant); (2) PARAMETER SEMANTICS DIVERGE between the neutral layer and the QM probe — define_sweep() segments at bandwidth_per_lo_hz (default 300 MHz) while the probe derives min_if=max(50MHz, lo_gap_hz/2), max_if=min(250MHz, min_if+bw) => 200 MHz spans, and lo_gap_hz punches its hole at the segment CENTRE while the probe places the LO BELOW the segment — so the declared axis is not exactly the measured one (harmless today because the backend passes the probe's stitched conforming dataset straight through, but the sim grid and hardware grid differ); (3) scqo/cli/_backends.py default_targets() now ALSO filters roster entities by required_operations — a behavior change for EVERY experiment's no---targets default that rode in unsplit and unpinned; (4) scqo-qm qubit_tomography gained reset_frame() after reset in the same PR (untested ride-along). DEFAULTS ARE HOT: drive_power_dbm defaults to -25 dBm vs the -40 the 5Q4C validation used — set it explicitly.
"""
