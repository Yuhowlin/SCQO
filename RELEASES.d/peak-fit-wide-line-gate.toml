name = "peak-fit-wide-line-gate"
repos = { scqat = "bd614a5" }
kind = "fix"
coupling = ""
validated = "hardware 5Q4C q1 2026-08-19 (three spectroscopy_cryoscope runs; two previously-unfittable ones re-analysed, the one that already passed comes out bit-identical)"
notes = "BEHAVIOR CHANGE (a repair): fit_peaks' min_snr significance gate no longer rejects a WIDE line. Its noise estimate was 1.4826 * MAD(signal_corrected) — the spread of the VALUES, which is the noise only while most sweep points sit off resonance. Once a line filled a large fraction of the sweep the MAD measured the LINE, min_snr * sigma climbed past the whole signal span, and find_peaks returned nothing at all: a clean, high-contrast line silently reported as 'no peak', with nothing in the result pointing at the gate. Measured on 5Q4C q1: a line filling 25% of the window inflated the estimate 5x over the true noise and cleared the gate by only 1.07x, while the same line at 41-45% inflated it 39-42x and could not be detected — though it carried the same 0.89 contrast at 2.5x LOWER noise. New scqat.tools.peak_fit.robust_noise is the three-point DER_SNR estimator 1.4826/sqrt(6) * median(|2 y[i] - y[i-2] - y[i+2]|): the middle combination cancels any locally linear trend, so a peak's steep flanks contribute nothing. Both estimators are unbiased on pure noise (+/-1% over 2000 traces of 51 points), so the noise-only rejection the gate exists for is UNCHANGED — they differ only where there is real structure to be confused by; traces that already fitted are unaffected. Affects every peak_fit consumer (ac_stark_shift, parametric_drive_resonance, qubit_spectroscopy, qubit_spectroscopy_flux, readout_pulse_photon, spectroscopy_cryoscope). Diagnostic worth keeping: n_peaks_found=0 with an obvious line in the raw map means checking what FRACTION of the sweep the line occupies, not the fit. Old runs that failed this way are re-analysable from their saved dataset.nc — nothing was lost."
