name = "qubit-tomography-interleaved-noise"
repos = { scqo = "e233774", scqat = "0575c24", "scqo-qm" = "df7ecb5" }
kind = "additive"
coupling = "scqo needs scqat >= 0575c24: the qubit_tomography dataset grew a `noise_condition` dimension and an older estimator raises IndexError on it (LOUD, not silent). scqo-qm needs scqo >= e233774: the probe emits the new contract, and its tomography dim renamed `qubit` -> `target` (the name the contract always demanded — the QM probe had been emitting the wrong one)."
validated = "offline"
notes = "qubit_tomography gains interleaved crosstalk measurement: `interleave_noise` (default true) sweeps noise_condition ['off','on'] per shot whenever a spectator carries `noise_mode`, so common-mode drift (T1/T2) cancels and the estimator reports pure crosstalk drift |dr| alongside baseline/delta populations and a differential-drift figure. Under noise OFF the spectator plays a symmetric idle wait matching its gate length. estimate() now analyses only measured targets (noise_mode spectators are filtered out instead of reported failed), and the QM probe validates target gates / initial states / measurement bases by name instead of silently doing nothing. BEHAVIOR CHANGE: a qubit_tomography run recorded before this lands still RE-ANALYSES fine (the estimator handles a dataset with no noise_condition), but its stored fit dict lacks the new baseline_/delta_ keys, so replotting one straight from saved metadata fails — re-analyse from dataset.nc instead. QM-only probe; not yet hardware-validated."
