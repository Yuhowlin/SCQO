notes = "Campaigns become a first-class provenance source with a writeback path: at finalize the statistics replay through each step experiment's own update() and land on campaign.json as PENDING campaign-level suggestions (plan [writeback]: stat mean|median, min_n floor, default mean/3; update='apply' campaigns generate nothing), decided with `scqo accept --campaign <id>` (same era/staleness guards and interactive review as a run's) and stamped ChangeRecord.campaign_id -> new provenance status 'campaign' in scqo state --sources and the viewer; `scqo campaign --suggest <id>` regenerates proposals for pre-feature campaigns from stored statistics; the viewer gains /campaigns + /campaign/<id> pages (statistics, statistics.png, suggestion decisions, children) plus a runs-list campaign column/filter and run-page backlinks. UPGRADE: index schema v9 -> v10 (campaigns.suggestions_pending) — the first DataStore open after upgrading drops and rebuilds index.sqlite from the folders (expected, minutes at most; the folders are the truth). BEHAVIOR CHANGE: a campaign plan whose label shadows a registered experiment name is now refused at preflight (the self-named 1-step `scqo run --repeat` shape stays allowed)."
