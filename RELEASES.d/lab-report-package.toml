kind = "additive"
coupling = """
NONE in the version sense - no scqat floor moves and no driver is touched. There \
is one INSTALL-level coupling: python-pptx joins the `viewer` extra, so a venv \
that is not reinstalled answers 503 on the two .pptx routes (with the reinstall \
hint in the message). The .xlsx routes and every existing export are unaffected.
"""
validated = "offline"
notes = """
ADDITIVE - a new viewer export, isolated in its own subpackage. Yuhowlin, SCQO PR \
#29, held since 2026-08-31 across three cuts pending a charter decision and landed \
here as maintainer commits after that decision.

WHAT SHIPS. `scqo/viewer/lab_report/` builds the lab's QPU characterization report \
from the setup page's values plus campaign statistics: a 3-sheet xlsx dashboard \
and a 4-slide .pptx deck, reachable from a `lab report...` button on the setup \
page with options for scope (this setup, or the whole cooldown), the min-repeats \
quality gate, mean-vs-median, and a tag filter. Also new: `scqo.campaign_query` \
(exported), which resolves campaign statistics INDEPENDENTLY per (target, \
quantity), so q1's T1 may come from one campaign and q3's from another.

THE CHARTER DECISION, and it is the reason this entry exists rather than a one \
line "new export". What the report encodes is ONE lab's reporting convention - its \
sheet names, its column order, its field dictionary, its Traditional-Chinese \
descriptions - and SCQO is a vendor-neutral core that other labs install under \
BSD-3-Clause. The decision was to KEEP it here WITH ISOLATION, which means: every \
lab-specific string lives in `field_dictionary.toml` (loaded via \
importlib.resources, so another lab swaps that ONE file and needs no Python \
change); nothing in `scqo/` imports the package except a single line in \
`viewer/app.py`; and the builders take no fastapi, the same data -> bytes contract \
`_export.py` states. `tests/test_lab_report_isolation.py` enforces all three in \
both directions, plus a ban on CJK characters anywhere in the package's Python, \
plus a test that renames the sheets in the TOML and checks the workbook follows - \
so the swap-the-file promise is checked rather than asserted. The intent is that \
moving this lab-side later is a directory move, not a refactor.

BEHAVIOUR WORTH KNOWING, because these change what the report CLAIMS about a chip \
relative to the contributed version, and all three were found in review: (1) \
`f_01_hz` is no longer backfilled from `f_q_max_hz`. The catalog is explicit that \
the first is the frequency at the CURRENT idle bias and the second the sweet-spot \
arch top; they coincide only at the sweet spot, and g, kappa, the dispersive \
shift, EJ/EC, f02/2 and the effective temperature are all computed FROM it, so one \
substitution moved all of them. A qubit whose idle frequency is unmeasured now \
reports it - and everything derived from it - as MISSING. (2) The deck's "Design" \
resonator series is the datasheet value from design.toml; it was plotting the \
MEASURED bare frequency under that label, which invites the reader to conclude \
fabrication hit its target when nothing of the sort was checked. (3) The generated \
chip layout is gone: it arranged qubits in a 4-wide grid with dashed lines between \
horizontal neighbours and captioned it "Design Pattern" on three slides, which on \
a chain or a T is an invented topology presented as the design. A slide with no \
design_pattern.png now says there is none.

Also fixed, from the same review: composite targets no longer collapse onto their \
first member (`q1_q2` was becoming `q1`, filing every two-qubit result from \
qc_n_swap_amp / qc_n_stark_amp / pair_zz_coupler under one qubit and potentially \
shadowing that qubit's own value) - the rider suffixes are now DERIVED from \
`catalog.CHANNELS[*].rider_suffix` rather than hand-copied; \
`get_latest_metric_stat(experiment=)` pushes the filter into find_campaigns' SQL \
instead of comparing after the newest row is already chosen, which returned None \
whenever the newest campaign was a different experiment; `estimator="mad_sigma"` \
is gone from the Literal rather than silently returning the mean; store failures \
raise instead of returning {} (which reads exactly like an unmeasured chip); the \
unified context ranks setups by change-history TIMESTAMP rather than \
string-comparing a run_id against a campaign_id; the cooldown routes gate their \
context like the setup page does, so a malformed cooldown 404s instead of \
exporting a chip that does not exist; route parameters are typed, so a misspelled \
estimator is a 422 and `min_repeats=0` cannot disable the quality gate under \
headings that read "#100"; an empty context reports NO qubits instead of a phantom \
q1; `x or y` value chains became explicit None tests so a genuinely zero thermal \
population is 0.0 rather than blank; `tunable` reads idle_flux's VALUE rather than \
key presence; and design.toml is read through `scqo.design.load_design`, which \
tolerates the BOM PowerShell writes into that hand-edited file - the hand-rolled \
reader did not, and swallowed the resulting TOMLDecodeError, silently emptying the \
Design column on any machine where the file had been saved from PowerShell.

KNOWN LIMIT, deliberate and worth deciding separately: the viewer is roster-free \
by design (it reads only the datastore), and `load_design` needs a roster to \
validate against, so the design column and the deck's Design series are EMPTY in \
the viewer today. That is honest - empty means unknown - and it is strictly better \
than the measured-value-labelled-Design it replaces, but the report only gains its \
design comparison once a roster reaches the viewer.

UPGRADE REQUIRES the viewer extra to be reinstalled (python-pptx is new, pulling \
lxml and XlsxWriter; uv.lock adds those three and nothing else). Without it the \
two .pptx routes answer 503 naming the fix; everything else is unaffected.

OFFLINE-VALIDATED: scqo 948 (.venv-view, driver-free, up from 922). The .pptx path \
is covered only where python-pptx is installed - the test skips otherwise, so a \
venv missing it will not fail the suite and will not exercise the deck.

HARDWARE: none, and none is meaningful here - the viewer never touches an \
instrument.
"""
