kind = "breaking"
coupling = "scqo and scqo-qblox move in LOCKSTEP (scqo-qblox >= 539bb97 with scqo >= 90afb2f): the four qubit_spectroscopy* experiments replaced their window parameters, and an old qblox shell against new scqo dies loudly reading the retired params.num_points — but the floor that matters is SILENT the other way round: pre-539bb97 qblox shells re-derive a symmetric center+/-span/2 NCO sweep from the detuning axis, so an ASYMMETRIC [start,end] window is quietly re-centered on drive_freq_hz and every fitted frequency is attributed wrong. scqo-qm probes consume sweep_axes as given (27701f7 is test-only)."
validated = "offline"
notes = "New derived capability drive_detuning (mixin DriveDetuningSweepParameters; catalog + scqo run --capability): the four qubit_spectroscopy* experiments sweep an explicit [start_drive_detuning_hz, end_drive_detuning_hz] window (asymmetric allowed, ascending enforced) relative to the current drive frequency. FIELD NAMES: the sibling readout-detuning window landed in the same unreleased cycle (see readout-detuning-capability), so the frame moved into the field name before either shipped — the interim spelling start/end_detuning_hz + num_freq_points existed only between 90afb2f and that commit and was never released. BREAKING / UPGRADE REQUIRES: frequency_span_hz + num_points (qubit_spectroscopy, _overlap), frequency_span_hz (_flux_pulse) and min/max_detuning_hz (_cryoscope) no longer exist on these four — update standing parameters.toml overlays, campaign plans and scripts to start_drive_detuning_hz / end_drive_detuning_hz / num_drive_freq_points."
