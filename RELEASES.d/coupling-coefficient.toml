validated = "offline (209 green over the unfiltered experiment sweep + catalog + capabilities + the new pure-math suite; viewer 52 green for the catalog-derived field orders) AND cross-checked on 2026-08-18 5Q4C hardware: g_coeff computed by BOTH routes agrees to -2.4% / -0.8% / -0.2% on q1 / q2 / q3, inside each route's own run-to-run scatter, landing on c ~ 0.0182 for all three qubits (identical-by-design geometry). A live run of the NEW code path is still owed."
notes = """
NEW resonator fact g_coeff (dimensionless, design_ok): the qubit-resonator coupling as a GEOMETRY constant, g_coeff = g_hz / sqrt(f_q * f_bare_hz). g = g_coeff * sqrt(f_q * f_r), so g_hz is valid only at the operating point it was measured at while g_coeff survives re-tuning, re-parking and cooldowns — which is what makes a stored coupling reusable and what a datasheet more naturally designs. g_hz's doc now states that operating-point convention. Storing both is a deliberate exception to the no-derivable-quantities rule: unlike lamb_shift (same entity, always recoverable) this derivation needs the qubit frequency AT THE TIME g was measured, on another mode, which moves.
TWO WRITERS, both gated. resonator_spectroscopy_power_amp / _chain now derive the coupling from their OWN two branches plus the standing drive_freq_hz (g = sqrt(lamb_shift * (f_bare - f_q))) — no arch fit, so this route is independent of the f_r0-pin systematic that moves the flux fit's g by ~13%. Withheld (g_source='none', nothing proposed, run still successful) with no calibrated drive frequency, or when the pull and the detuning disagree in sign — that is not a dispersive pull and g is undefined, not clamped. resonator_spectroscopy_flux converts its fitted g and proposes g_coeff under the same arch-anchored gate as g_hz.
BEHAVIOR CHANGE: both punchouts now propose SIX values (was four) and the flux map SEVEN (was six); an operator who accepts blindly also writes the coupling pair. Punchout is now a g_hz writer alongside the flux map.
F_Q_MAX GUARD (new provenance tag 'drive_freq_arch'): drive_freq_hz is the qubit at the PARKED flux, which equals f_q_max only at the sweet spot. With a stored flux_offset + flux_per_phi0 the flux map projects it to the arch top; it degrades to the old tag ('drive_freq', assumption explicit) when the arch is unknown or the park is too far down it to invert. On 5Q4C the qubits park within 0.5 mV of their sweet spots, so this is a correctness guard for a deliberately detuned park, not a numeric fix. Consumers reading f_q_max_source must accept the new value.
DO NOT extrapolate g_coeff down a flux arch — the sqrt(f_q) scaling holds between transmon-regime operating points and was REFUTED along the arch on 13 real target-runs (see flux-design-g-seed-rescale).
"""
