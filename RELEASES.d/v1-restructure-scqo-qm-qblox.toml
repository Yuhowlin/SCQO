coupling = "All three move in lockstep at the combo tag; scqat: no floor. The SILENT hazard is state-vs-driver, not repo-vs-repo: a QM state.json migrated to scqo_qm.* under a pre-rename driver install - or an unmigrated one under the new - LOADS via QUAM's base-class fallback (a warning, wrong physics, not an error). Driver install and state migration are ONE atomic step per machine."
validated = "offline 2026-08-09: full suites green (scqo-qm 308, scqo-qblox 266, SCQO 696+1skip, scqat 568); golden harness 35/35 QUA programs byte-identical vs the pre-restructure baseline at EVERY stage, two state profiles; load + to_dict round-trip + generate_config gates on every migrated state. No hardware run: no probe semantics changed (one deliberate contract edit: the tracker/tomography 3-tuple's third element is now the acquire CALLABLE, offline-covered)."
notes = "BREAKING RESTRUCTURE - LCHQMDriver IS NOW scqo-qm (package customized -> scqo_qm reshaped to the driver-symmetric layout: scqo_backend.py + backend/ + experiments/ with ONE FUSED FILE PER EXPERIMENT; scqo is a hard dependency; the 22 qualibrate LCH shells + their node packages + the 8 shell-only probes are DELETED - official qualibrate nodes unchanged, calibrations/exclude/ + customized/ frozen as archive) and LCHQBDriver IS NOW scqo-qblox (package lchqb -> scqo_qblox; _amp -> _amp_limits; element CLASS names unchanged - persisted registry keys). Dists scqo-qm / scqo-qblox; GitHub redirects the old URLs. UPGRADE REQUIRES, in order, per machine: (1) update remotes/folders (gh repo rename already done upstream; git remote set-url + folder rename locally); (2) per venv UNINSTALL the old dist THEN editable-reinstall - uv pip uninstall --python <venv>\\Scripts\\python.exe superconducting-calibrations (qm) / lchqb-driver (qblox); uv pip install --python <venv>\\Scripts\\python.exe -e D:\\github\\scqo-qm (resp. scqo-qblox) --no-deps - entry points re-register at INSTALL time and a stale dist leaves a broken duplicate 'qm'/'qblox'; (3) run scqo-qm\\scripts\\migrate_state_scqo_qm.py over EVERY QM backend_config + state_lib folder (customized.* -> scqo_qm.* class paths; the script verifies POSITIVELY by load + round-trip + generate_config because QUAM otherwise falls back to base classes SILENTLY); (4) re-point ~/.qualibrate config.toml AND config_new.toml [quam] state_path + [qualibrate.calibration_library] folder to D:\\github\\scqo-qm\\...; (5) the LCH GUI shells are gone - run experiments via scqo run; the qualibrate GUI serves official nodes only. Driver pyproject versions -> 1.0.0 at the cut (both currently 0.1.0)."
