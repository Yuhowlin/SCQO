notes = """
Opens the four public repos to fork-based contribution, and fixes what made that unsafe.

NEW DOCS, TWO AUDIENCES. AGENTS.md is the contributor brief in every repo and is what \
Cursor, Codex, Gemini CLI, Windsurf, Aider and Zed read; CLAUDE.md stays the lab-operations \
document. They are deliberately NOT the same file: CLAUDE.md's "never switch branches" and \
"commit by explicit pathspec" exist to protect a shared live checkout and are the opposite of \
what a fork needs, so AGENTS.md overrides them by name. Pointer files (.github/\
copilot-instructions.md, .cursor/rules/scqo.mdc, GEMINI.md) carry only the fork-vs-lab decision \
rule. CONTRIBUTING.md is real in SCQO and a stub in the siblings, because a release is a combo \
and three drifting copies would disagree within one cycle.

PUBLICATION HAZARDS FIXED. (1) None of the four repos had a LICENSE, so despite pyproject \
declaring BSD-3-Clause, forking and redistribution were not actually permitted; all four now \
carry BSD-3-Clause and scqat's placeholder author metadata ("Your Name") is gone. (2) SCQO and \
scqo-qblox set readme = "CLAUDE.md", making the lab-internal document their packaged PyPI long \
description - both now point at README.md. (3) A tracked .claude/settings.json shipped ~160 \
accumulated permission grants from local sessions to every fork of SCQO - including `git reset \
*`, `git commit *`, `gh api -X DELETE`, reads into a personal miniconda tree, and \
additionalDirectories pointing at one machine's D:\\cases - plus a smaller one in scqo-qm \
granting `git rm *`. Both untracked; the file is gitignored in all four repos now. \
(4) scqat's notebooks/, analysis/ and temp/ left the published tree: they carried absolute \
paths into personal lab storage, and temp/ had been tracked despite an existing ignore rule. \
No test depended on them and the wheel only ships scqat*, so this is packaging-neutral. \
(5) scqo-qblox's README was still titled LCHQBDriver and its check_real_config.py error path \
handed users an install command for a D:/github/LCHQBDriver that has not existed since the v1 \
rename.

DERIVED DOCS ARE NOW GENERATED. scripts/update_docs.py in SCQO (the experiment census) and in \
scqat (the tool-to-consumer table and the coverage gap), each enforced by \
tests/test_docs_current.py. This was not tidying: SCQO's layout tree - described in the file as \
the AI's decision menu - listed 31 of 41 registered experiments, omitting both cryoscopes, both \
broadband scans, both qc_n_* calibrations and qubit_ramsey_phasor, the flagship feature of the \
very release the file was last committed for. scqat's tool table listed 10 tools when 25 have \
consumers, showed iq_reduce with 5 consumers against 8 and peak_fit with 5 against 7, named a \
hankel_analysis module that does not exist, and omitted lockin and fit_stretched_exp although \
both were wired in at v0.20.0 - and that table is what a tools/ edit consults to decide which \
families to re-test. Every hand-kept test count was DELETED rather than refreshed (771 vs a \
real 868, 329 vs 671, 266/33/618/329 in scqo-qblox alone, 309 vs 346); RELEASES.toml's \
OFFLINE-VALIDATED line is the only place per-release counts belong.

STALE CLAIMS CORRECTED, all of them census lists that named a test as the authority while \
restating it in prose: active reset documented as symmetric across backends when Qblox opts in \
4 carriers and QM 7 (the same rotted sentence was in _capabilities/qubit_reset.py, and this is \
a silent-failure field); scqo-qm's "six coherent-drive carriers" against a pinned seven and \
"six experiments acquire inside probe()" against a pinned nine; scqo-qm citing TUTORIAL section \
9 for the placement rule when it is section 10, contradicting scqo-qblox which had it right; \
module counts of 17 and 36 against a real 20 and 41. All now defer to the test literal.

CI. SCQO's workflow hardcoded shiau109/scqat at default-branch HEAD, so a paired scqat+SCQO \
change got a signal reflecting upstream rather than the pair - exactly the silent-coupling \
class these fragments keep recording. All three workflows now resolve the sibling checkout \
from workflow_dispatch inputs, else the head owner's fork at a MATCHING BRANCH NAME, else \
upstream, and write the resolved choice to the run summary. scqat gained CI for the first time \
and runs SCQO's whole suite against the PR's scqat. scqo-qblox gained CI (303 tests green on \
Linux; the qblox-scheduler prerelease pin installs fine). scqo-qm deliberately has none - \
git-sourced deps plus a py3.11 lockfile - so its PRs rely on a pasted local run, which \
AGENTS.md states plainly.

ALSO: scripts/check_contribution.py, a preflight checking sibling layout, editable-install \
freshness, branch pairing and staged ledger fragments, and printing each repo's test command - \
instruction files are best-effort across agent brands, a script whose output they read is not. \
And the scqo-contrib tier is RETIRED: it routed contributors into a repo that is private, \
pinned at v0.12.0, excluded from every combo since greenfield, and whose template imports a \
QubitSelection that greenfield renamed to TargetSelection, so it fails on import. Forks are the \
prototyping path; the promotion checklist doubles as the PR checklist.

NO USER ACTION REQUIRED. Nothing an operator owns changes shape - no Parameters, experiment \
names, state files, config keys or stored state - and no dependency ships. The one behaviour \
change for CONTRIBUTORS: adding an experiment now requires running scripts/update_docs.py, or \
tests/test_docs_current.py fails. OFFLINE-VALIDATED at the landing: SCQO 150 targeted (full \
experiment sweep) plus the new docs tests, scqat 671, scqo-qblox 303 in both the lab venv and \
Linux CI; all three CI workflows GREEN on the landing commits. The first CI run failed and \
was worth it - the census generator read the LIVE registry, which four test modules widen \
with deliberately-broken fixtures at import time (46 vs 41), so it passed in isolation and \
failed in the suite: the v2.3.0 trap again. It now enumerates scqo.experiments.__all__ and \
selects by TYPE, the guard test_model_experiments' CORE already used. No hardware validation is owed: nothing touches a probe, schedule, program or \
instrument path.
"""
