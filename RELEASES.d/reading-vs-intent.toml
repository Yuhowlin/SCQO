notes = "FIX - THE ESTIMATOR BINDING RULE, MADE STRICT AND ENFORCED. Nothing an operator owns changes: no Parameters, experiment names, state files, config keys, stored data or dependencies, and no runtime behaviour. scqat's CLAUDE.md and AGENTS.md said ONE estimator per experiment while SCQO's _scqat.py and contract.py said one per PROBING METHOD, and the tree had drifted to the weaker reading - four estimators bound by more than one experiment and one experiment binding none. The rule is now 1:1 in BOTH directions, stated once in SCQO's CLAUDE.md (Terminology -> The estimator binding) with scqat pointing at it, because an estimator is keyed by a READING - a dataset shape AND the model fitted to it - so a binding is a claim that this model describes this signal, not a filing convention. Two experiments binding one estimator assert the same physics; if they really do, they are one experiment. Sharing goes through scqat.tools for math and a _-prefixed module under scqat/estimators for presentation. The section carries the decision procedure and the two things that look like evidence for sharing and are not: a DatasetContract is a SHAPE check asserting nothing about MEANING (qubit_spectroscopy and resonator_spectroscopy declare identical contracts down to the axis NAME, since DETUNING_AXIS is shared by both detuning mixins and the frame lives in the Parameters field names), and a shared fit routine is never a shared model (one Lorentzian fits qubit_spectroscopy_overlap only because a Stark-shifted Lorentzian is still a Lorentzian). The tree does NOT conform yet and that is deliberate rather than hidden: scripts/update_docs.py gains a second generated block, the experiment -> estimator map, derived by AST and resolved through the MRO so an inherited estimate() is attributed to the estimator it actually runs; tests/test_one_estimator_per_experiment.py carries the four shared bindings (state_discrimination x3, readout_fidelity, resonator_spectroscopy_power, qubit_spectroscopy) and the one unbound experiment (qubit_pi_pulse_error) with each migration, and fails in BOTH directions so the list can only shrink. FOLLOW-UPS OWED, one per entry: readout_fidelity becomes a tools/fidelity_sweep reduction (its two consumers have different dataset SHAPES, bridged today by a sweep_coord class attribute); state_discrimination splits three ways, which also moves the label mapping out of SCQO's estimate(); the two punchouts MERGE into one experiment with the mechanism as an advanced-user knob, since the split is a converter limitation (DAC resolution, log-scale power span) that leaked into the physics catalog; qubit_spectroscopy_overlap gets its own estimator because its line is genuinely Stark-shifted; qubit_pi_pulse_error's inline np.polyfit moves into scqat. OFFLINE-VALIDATED: scqo tests/test_docs_current.py + tests/test_one_estimator_per_experiment.py + tests/test_estimator_method_sync.py (14), scqat tests/test_docs_current.py + tests/test_no_estimator_layering.py (4), plus update_docs.py --check clean in both repos. The allowlist was proven load-bearing by deleting an entry and confirming the suite goes red. No hardware validation is owed - nothing in this fragment touches a probe, schedule, program or instrument path."
