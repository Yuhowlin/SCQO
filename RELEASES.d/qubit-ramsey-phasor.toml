name = "qubit-ramsey-phasor"
repos = { scqat = "6fa62d5", scqo = "8d8a8dd", scqo-qm = "93cd2e9", scqo-qblox = "43630a2" }
kind = "additive"
coupling = "scqo needs scqat >= 6fa62d5: estimate() lazily imports scqat.estimators.ramsey_phasor, which does not exist below it - an under-versioned scqat fails LOUDLY with ImportError at estimate(), not silently. Same commit also first REGISTERS get_fitter('stretched_exp') and exports lockin_phasor from scqat.tools (both modules existed unwired before it, so get_fitter('stretched_exp') raised ValueError)."
validated = "offline (scqat 44 new tests + full 667-test suite; SCQO whole-catalog sweep + capabilities/time-grid; scqo-qm 346; scqo-qblox 303 in the lab venv). QM probe GATEWAY-VERIFIED: scqo run --preview compiled and simulated on the live cluster with no warnings. HARDWARE RUN OWED on both backends."
notes = "New experiment qubit_ramsey_phasor: a Ramsey whose closing-pulse phase is swept through a full turn at every idle time, so the fringe lives in the FRAME axis and the idle axis is free to be LOG-spaced. A lock-in reads the coherence envelope off the phasor magnitude and the accumulated phase off its angle, so it reports the DECAY SHAPE - the stretch exponent p (1 = Markovian/white, 2 = the Gaussian decay of a 1/f-dominated environment) - alongside T2*, which plain qubit_ramsey cannot: its linear axis is spent resolving the fringe. Prefer qubit_ramsey for a fast frequency correction; this costs num_frames times as many points. NO artificial detuning is applied or offered (the contrast is detuning-independent, so the phase slope IS the residual error), which also drops the negated virtual-detuning ramp and its sign trap from both probes. Writes back t2_star_s plus drive_freq_hz/f_01_hz, the latter isfinite-guarded because the detuning is NaN-gated; stretch_p is record-only (no catalogued field). num_frames floors at 4, not 3: a REAL 2f contaminant carries both +2 and -2 harmonics and at 3 points the -2 aliases onto the signal at full weight (lockin.py's docstring claimed otherwise and is corrected). BEHAVIOR CHANGE, internal only: the log-spaced axis helper moved out of qubit_spectroscopy_cryoscope into scqo.experiments._time_grid as log_time_axis_ns (behaviour-identical, verified equal across three windows). Qblox active reset stays DENIED pending hardware validation; the QM twin opts in."
