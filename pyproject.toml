[project]
name = "scqo"
version = "3.7.0"
description = "Superconducting Qubit Orchestration — instrument-agnostic experiment API shared by QM and Qblox backends"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
dependencies = [
    "pydantic>=2.6",
    "xarray>=2024.7.0",
    "numpy>=1.26",
    "scqat",            # the shared analysis engine: estimators + fitters (import-light; lazy-imported in estimate())
                        # needs scqat tag v0.1.4+ (punchout outlier test is baseline-normalized for the |IQ|-scaled sim,
                        # SCQO 586af0e); scqat metadata caught up at v0.1.5, but the lab installs scqat editable at the
                        # RELEASES.toml-pinned tag, so no version pin here — the manifest is the authority.
                        # As of v0.18.0 the real floor is scqat v0.7.0: qubit_thermal_population pins a stored g/e
                        # reference while preparing one state, and before scqat 2d501f0 discriminate unpacked only
                        # n_state centres and SILENTLY dropped the rest — a wrong n_th, not an error. A pin would not
                        # help (editable installs bypass resolution, which is how both the lab and CI consume scqat),
                        # so the manifest carries it: see RELEASES.toml [v0-18-0].
                        # qubit_xyz_delay raises the floor to scqat v0.12.0 (the XyzDelayEstimator +
                        # fit_triangle tool it lazy-imports); a missing module is a loud ImportError.
                        # As of v2.2.0 the floor is scqat v0.18.0: readout_power / readout_frequency
                        # pass method= to the readout_fidelity estimator (derived from readout_mode),
                        # which an older scqat refuses by name — loud ValueError at estimate, and only
                        # for those two experiments. See RELEASES.toml [v2-2-0].
                        # As of v3.1.0 the floor is scqat v0.20.0, two ways and both loud:
                        # qubit_ramsey_phasor lazy-imports scqat.estimators.ramsey_phasor
                        # (ImportError below it), and that same commit is the first to
                        # REGISTER get_fitter('stretched_exp') and export lockin_phasor from
                        # scqat.tools — both modules sat in the tree unwired, so the factory
                        # raised ValueError until then. qubit_tomography independently needs
                        # the noise_condition dimension (IndexError below it), which v3.0.0's
                        # scqat v0.19.0 floor already covered. See RELEASES.toml [v3-1-0].
                        # As of v3.3.0 the floor is scqat v0.21.0, and this one is SILENT:
                        # qubit_parametric_drive_time is the first orchestrated consumer of
                        # parametric_drive_decoherence, and v0.21.0 is where that estimator
                        # gained per-figure isolation (render_figures). Below it the estimator
                        # returns a plain dict of pre-built figures, so a crash in the pure-fit
                        # decoherence_params panel takes the WHOLE artifact set down: the run
                        # keeps its data and loses every PNG, including the raw-carrying
                        # rho11_fits. Nothing raises. See RELEASES.toml [v3-3-0].
                        # As of v3.4.0 the floor is scqat v0.22.0, and this one is LOUD:
                        # qc_unidirectional_trotter's estimate() lazy-imports
                        # scqat.estimators.qc_unidirectional_trotter, which does not exist
                        # below it - an ImportError naming the missing module, so nobody
                        # gets wrong numbers. Unusual for this stack, where the floors are
                        # usually silent; the experiment is simply unusable below it.
                        # See RELEASES.toml [v3-4-0].
                        # The NEXT cut raises the floor to scqat v0.23.0, LOUD the same
                        # way twice over: pair_swap_angle and qc_trotter_compensation
                        # each lazy-import their own estimator subpackage, neither of
                        # which exists below it. It ALSO carries a silent half worth
                        # naming - scqat v0.23.0 seeds the cosine fit at sub-bin
                        # frequency resolution, and below it a swap period falling
                        # between FFT bins pins the fit at the nearer bin and returns a
                        # plausible-looking angle that is several percent wrong with a
                        # collapsed R^2. That affects swap_oscillation too, so an older
                        # scqat does not merely lack the new experiments.
    "netcdf4>=1.6",     # datastore: dataset.nc has a string qubit coord (needs netCDF4, not the scipy netCDF3 fallback)
    "tomli>=2.0; python_version<'3.11'",  # labconfig TOML parsing on py3.10
]

# IMPORTANT: scqo deliberately depends on NO instrument library (no qm-qua, no
# quam, no qualibrate, no qblox-scheduler). That is what lets both LCHQMDriver
# and LCHQBDriver depend on scqo without dragging each other's hardware stack in.
# scqat is the one allowed non-instrument dependency: it is the single estimator
# engine (one estimator per experiment, one experiment per estimator), so SCQO
# never fits inline. lmfit is now a transitive dependency via scqat.

[project.scripts]
scqo = "scqo.cli.__main__:main"  # the lab command; re-run `uv pip install -e` after upgrading

[project.optional-dependencies]
viewer = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # FastAPI Form(...) — the tag-edit POST
    "openpyxl>=3.1",            # the setup page's .xlsx export (PDF rides matplotlib via scqat; HTML is stdlib)
]

[tool.uv.sources]
scqat = { path = "../scqat", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scqo"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx: FastAPI TestClient for the viewer tests

[tool.black]
line-length = 120
